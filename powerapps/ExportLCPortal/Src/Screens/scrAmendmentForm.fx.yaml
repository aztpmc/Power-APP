# =============================================================================
# scrAmendmentForm - amendment form
# =============================================================================
# Record an amendment. The before values are captured from the LC as it stands right now, so the amendment carries its own evidence of what changed and the LC is never edited in place.
#
# Shared mechanics with every other record form in the portal:
#   * A working copy (gblDraft) is edited, never the datasource directly, so validation
#     can see the whole prospective record before anything is written.
#   * Validation is one expression producing a list of messages; Save is disabled while
#     that list is non-empty.
#   * A status change is checked against 16_StatusMaster before it is allowed.
#   * Derived values are computed on save, not typed.
#   * One audit row per changed critical field, sharing one correlation id.
# =============================================================================

scrAmendmentForm As screen:
    Fill: =ThemeCanvas
    OnVisible: |
        =Set(gblCorrelation, GUID());
        // The parent LC is needed for validation (tolerance, expiry, utilisation) and for
        // the denormalised keys written on save.
        Set(
            gblParentLC,
            Coalesce(
                LookUp('01_ExportLCs', ID = Coalesce(gblChildContext.LCItemId, gblEditChild.LCItemId, -1)),
                gblCurrentLC
            )
        );
        Set(gblOriginal, gblEditChild);
        Set(
            gblDraft,
            If(
                gblFormMode = "New",
                {
                    Title: "",
                    AmendmentNumber: Blank(),
                    AmendmentDate: Blank(),
                    BankAmendmentRef: "",
                    AmendmentDescription: "",
                    AmountAfter: Blank(),
                    ExpiryAfter: Blank(),
                    ShipmentDateAfter: Blank(),
                    ChangedField: "",
                    PreviousValue: "",
                    NewValue: "",
                    CustomerAcceptance: "Not Required",
                    CustomerAcceptanceDate: Blank(),
                    BankConfirmation: "Not Required",
                    BankConfirmationDate: Blank(),
                    AmendmentCharges: Blank(),
                    AmendmentStatus: "Received",
                    AmendmentNotes: ""
                },
                gblEditChild
            )
        );
        Set(gblShowErrors, false)

    lblValidationSource As label:
        X: =-1000
        Y: =-1000
        Width: =1
        Height: =1
        Visible: =false
        Text: |
            =Concat(
                Filter(
                    Table(
                        { M: "Amendment reference is required.",
                          F: Len(Trim(Coalesce(gblDraft.Title, ""))) = 0 },
                        { M: "Amendment number is required.",
                          F: IsBlank(gblDraft.AmendmentNumber) },
                        { M: "Amendment date is required.",
                          F: IsBlank(gblDraft.AmendmentDate) },
                        { M: "Description is required.",
                          F: Len(Trim(Coalesce(gblDraft.AmendmentDescription, ""))) = 0 },
                        { M: "This amendment number is already recorded against this LC.",
                          F: !IsBlank(gblDraft.AmendmentNumber) && !IsBlank(LookUp('02_LCAmendments', LCItemId = gblChildContext.LCItemId && AmendmentNumber = gblDraft.AmendmentNumber && ID <> Coalesce(gblOriginal.ID, -1))) },
                        { M: "An amendment must change something - set a new amount, expiry, latest shipment date, or describe another changed field.",
                          F: IsBlank(gblDraft.AmountAfter) && IsBlank(gblDraft.ExpiryAfter) && IsBlank(gblDraft.ShipmentDateAfter) && Len(Trim(Coalesce(gblDraft.NewValue, ""))) = 0 },
                        { M: "New LC amount cannot be negative.",
                          F: Coalesce(gblDraft.AmountAfter, 0) < 0 },
                        { M: "New LC amount is below the amount already drawn under this credit.",
                          F: !IsBlank(gblDraft.AmountAfter) && gblDraft.AmountAfter < Coalesce(gblParentLC.UtilizedAmount, 0) },
                        { M: "New latest shipment date cannot be after the expiry date this amendment leaves in force.",
                          F: !IsBlank(gblDraft.ShipmentDateAfter) && gblDraft.ShipmentDateAfter > Coalesce(gblDraft.ExpiryAfter, gblParentLC.ExpiryDate) },
                        { M: "An amount increase above the configured threshold requires treasury manager approval.",
                          F: !IsBlank(gblDraft.AmountAfter) && (gblDraft.AmountAfter - Coalesce(gblParentLC.LCAmount, 0)) > CfgN("AmendmentApprovalThreshold", 100000) && !CanApprove },
                        { M: "Customer acceptance date cannot be recorded while acceptance is still pending.",
                          F: !IsBlank(gblDraft.CustomerAcceptanceDate) && gblDraft.CustomerAcceptance = "Pending" },
                        { M: TransitionBlockReason("Amendment", Coalesce(gblOriginal.AmendmentStatus, "Received"), gblDraft.AmendmentStatus),
                          F: gblFormMode = "Edit" && !CanTransition("Amendment", Coalesce(gblOriginal.AmendmentStatus, "Received"), gblDraft.AmendmentStatus) }
                    ),
                    F
                ),
                M,
                Char(10)
            )

    topBar As cmpTopBar:
        X: =ThemeSpace5
        Y: =0
        Width: =Parent.Width - (ThemeSpace5 * 2)
        Height: =ThemeTopBarHeight
        TitleText: |
            =If(gblFormMode = "New", "New amendment", "Edit " & Coalesce(gblDraft.Title, "amendment"))
        Breadcrumb: |
            =Coalesce(gblParentLC.LCNumber, "No LC selected") & "  /  amendment"
        ShowSearch: =false
        ShowBack: =true
        OnBack: =Back()
        ShowPrimary: =false

    # Creating from a module register rather than from an LC workspace: pick the parent
    # first. Without it the record cannot be linked, and an unlinked child record is the
    # one thing this data model must never contain.
    cboParentLC As combobox:
        X: =ThemeSpace5
        Y: =ThemeTopBarHeight + ThemeSpace2
        Width: =400
        Height: =34
        Visible: =IsBlank(gblChildContext) || IsBlank(gblChildContext.LCItemId)
        Items: =SortByColumns(Filter('01_ExportLCs', IsClosed = false), "LCNumber", SortOrder.Ascending)
        DisplayFields: =["LCNumber"]
        SearchFields: =["LCNumber", "CustomerName", "OurReference"]
        IsSearchable: =true
        SelectMultiple: =false
        InputTextPlaceholder: ="Select the LC this amendment belongs to"
        Font: =ThemeFont
        Size: =ThemeSizeBody
        OnChange: |
            =Set(gblParentLC, Self.Selected);
            Set(
                gblChildContext,
                {
                    LCItemId: Self.Selected.ID,
                    LCNumber: Self.Selected.LCNumber,
                    InternalLCID: Self.Selected.Title,
                    CustomerName: Self.Selected.CustomerName,
                    CurrencyCode: Self.Selected.CurrencyCode
                }
            )

    recErrors As rectangle:
        X: =ThemeSpace5
        Y: =If(cboParentLC.Visible, cboParentLC.Y + 42, ThemeTopBarHeight + ThemeSpace3)
        Width: =Parent.Width - (ThemeSpace5 * 2)
        Height: =lblErrors.Height + ThemeSpace4
        Fill: =ThemeDangerSoft
        BorderColor: =ThemeDanger
        BorderThickness: =1
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        Visible: =gblShowErrors && Len(lblValidationSource.Text) > 0

    lblErrors As label:
        X: =recErrors.X + ThemeSpace4
        Y: =recErrors.Y + ThemeSpace2
        Width: =recErrors.Width - (ThemeSpace4 * 2)
        Height: |
            =(CountRows(Split(lblValidationSource.Text, Char(10))) * 20) + 8
        Text: =lblValidationSource.Text
        Font: =ThemeFont
        Size: =ThemeSizeBody
        Color: =ThemeDanger
        Visible: =recErrors.Visible
        PaddingLeft: =0

    galForm As gallery:
        X: =ThemeSpace5
        Y: |
            =If(recErrors.Visible, recErrors.Y + recErrors.Height + ThemeSpace3,
                If(cboParentLC.Visible, cboParentLC.Y + 42, ThemeTopBarHeight + ThemeSpace3))
        Width: =Parent.Width - (ThemeSpace5 * 2)
        Height: =Parent.Height - Self.Y - 72
        TemplateSize: =64
        TemplatePadding: =0
        ShowScrollbar: =true
        DelayItemLoading: =false
        WrapCount: =If(IsCompact, 1, 3)
        Items: |
            =Table(
                { K: "Title", L: "Amendment reference *", T: "text", O: "" },
                { K: "AmendmentNumber", L: "Amendment number *", T: "number", O: "" },
                { K: "AmendmentDate", L: "Amendment date *", T: "date", O: "" },
                { K: "BankAmendmentRef", L: "Bank amendment reference", T: "text", O: "" },
                { K: "AmendmentDescription", L: "Description *", T: "text", O: "" },
                { K: "AmountAfter", L: "New LC amount", T: "number", O: "" },
                { K: "ExpiryAfter", L: "New expiry date", T: "date", O: "" },
                { K: "ShipmentDateAfter", L: "New latest shipment date", T: "date", O: "" },
                { K: "ChangedField", L: "Other field changed", T: "text", O: "" },
                { K: "PreviousValue", L: "Previous value", T: "text", O: "" },
                { K: "NewValue", L: "New value", T: "text", O: "" },
                { K: "CustomerAcceptance", L: "Customer acceptance", T: "choice", O: "Not Required,Pending,Accepted,Rejected" },
                { K: "CustomerAcceptanceDate", L: "Customer acceptance date", T: "date", O: "" },
                { K: "BankConfirmation", L: "Bank confirmation", T: "choice", O: "Not Required,Pending,Confirmed,Rejected" },
                { K: "BankConfirmationDate", L: "Bank confirmation date", T: "date", O: "" },
                { K: "AmendmentCharges", L: "Amendment charges", T: "number", O: "" },
                { K: "AmendmentStatus", L: "Status", T: "status", O: "" },
                { K: "AmendmentNotes", L: "Notes", T: "text", O: "" }
            )

        lblFieldLabel As label:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =18
            Text: =ThisItem.L
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            Color: =ThemeTextSecondary
            PaddingLeft: =0

        txtField As text:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T in ["text", "number"]
            Format: =If(ThisItem.T = "number", TextFormat.Number, TextFormat.Text)
            Font: =ThemeFont
            Size: =ThemeSizeBody
            BorderColor: =ThemeBorderStrong
            FocusedBorderColor: =ThemeAccent
            BorderThickness: =1
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            Default: |
                =Switch(
                    ThisItem.K,
                    "Title", Coalesce(gblDraft.Title, ""),
                    "BankAmendmentRef", Coalesce(gblDraft.BankAmendmentRef, ""),
                    "AmendmentDescription", Coalesce(gblDraft.AmendmentDescription, ""),
                    "ChangedField", Coalesce(gblDraft.ChangedField, ""),
                    "PreviousValue", Coalesce(gblDraft.PreviousValue, ""),
                    "NewValue", Coalesce(gblDraft.NewValue, ""),
                    "AmendmentNotes", Coalesce(gblDraft.AmendmentNotes, ""),
                    "AmendmentNumber", Text(gblDraft.AmendmentNumber),
                    "AmountAfter", Text(gblDraft.AmountAfter),
                    "AmendmentCharges", Text(gblDraft.AmendmentCharges),
                    ""
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "Title", Patch(gblDraft, { Title: Trim(Self.Value) }),
                        "BankAmendmentRef", Patch(gblDraft, { BankAmendmentRef: Trim(Self.Value) }),
                        "AmendmentDescription", Patch(gblDraft, { AmendmentDescription: Trim(Self.Value) }),
                        "ChangedField", Patch(gblDraft, { ChangedField: Trim(Self.Value) }),
                        "PreviousValue", Patch(gblDraft, { PreviousValue: Trim(Self.Value) }),
                        "NewValue", Patch(gblDraft, { NewValue: Trim(Self.Value) }),
                        "AmendmentNotes", Patch(gblDraft, { AmendmentNotes: Trim(Self.Value) }),
                        "AmendmentNumber", Patch(gblDraft, { AmendmentNumber: Value(Self.Value) }),
                        "AmountAfter", Patch(gblDraft, { AmountAfter: Value(Self.Value) }),
                        "AmendmentCharges", Patch(gblDraft, { AmendmentCharges: Value(Self.Value) }),
                        gblDraft
                    )
                )

        dpField As datepicker:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "date"
            Font: =ThemeFont
            Size: =ThemeSizeBody
            DefaultDate: |
                =Switch(
                    ThisItem.K,
                    "AmendmentDate", gblDraft.AmendmentDate,
                    "ExpiryAfter", gblDraft.ExpiryAfter,
                    "ShipmentDateAfter", gblDraft.ShipmentDateAfter,
                    "CustomerAcceptanceDate", gblDraft.CustomerAcceptanceDate,
                    "BankConfirmationDate", gblDraft.BankConfirmationDate,
                    Blank()
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "AmendmentDate", Patch(gblDraft, { AmendmentDate: Self.SelectedDate }),
                        "ExpiryAfter", Patch(gblDraft, { ExpiryAfter: Self.SelectedDate }),
                        "ShipmentDateAfter", Patch(gblDraft, { ShipmentDateAfter: Self.SelectedDate }),
                        "CustomerAcceptanceDate", Patch(gblDraft, { CustomerAcceptanceDate: Self.SelectedDate }),
                        "BankConfirmationDate", Patch(gblDraft, { BankConfirmationDate: Self.SelectedDate }),
                        gblDraft
                    )
                )

        tglField As toggle:
            X: =0
            Y: =20
            Width: =80
            Height: =28
            Visible: =ThisItem.T = "boolean"
            Default: =false

        drpChoice As dropdown:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "choice"
            Font: =ThemeFont
            Size: =ThemeSizeBody
            Items: =Split(ThisItem.O, ",")
            Default: |
                =Switch(
                    ThisItem.K,
                    "CustomerAcceptance", Coalesce(gblDraft.CustomerAcceptance, ""),
                    "BankConfirmation", Coalesce(gblDraft.BankConfirmation, ""),
                    ""
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "CustomerAcceptance", Patch(gblDraft, { CustomerAcceptance: Self.Selected.Value }),
                        "BankConfirmation", Patch(gblDraft, { BankConfirmation: Self.Selected.Value }),
                        gblDraft
                    )
                )

        # The status picker offers only the transitions 16_StatusMaster permits from the
        # current status, so an illegal move is not presented in the first place - the
        # validation rule behind it is the backstop, not the only control.
        drpStatus As dropdown:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "status"
            Font: =ThemeFont
            Size: =ThemeSizeBody
            Items: |
                =If(
                    gblFormMode = "New",
                    SortByColumns(Filter(colStatus, EntityName = "Amendment"), "SortOrder", SortOrder.Ascending),
                    Filter(
                        SortByColumns(Filter(colStatus, EntityName = "Amendment"), "SortOrder", SortOrder.Ascending),
                        CanTransition("Amendment", Coalesce(gblOriginal.AmendmentStatus, "Received"), StatusCode)
                    )
                )
            Default: =gblDraft.AmendmentStatus
            OnChange: |
                =Set(gblDraft, Patch(gblDraft, { AmendmentStatus: Self.Selected.StatusCode }))

        cboLookup As combobox:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "lookup"
            IsSearchable: =true
            SelectMultiple: =false
            Font: =ThemeFont
            Size: =ThemeSizeBody
            DisplayFields: =["Title"]
            SearchFields: =["Title"]
            Items: |
                =Switch(
                    ThisItem.O,
                    "currency",     colCurrencies,
                    "incoterm",     colIncoterms,
                    "doctype",      colDocTypes,
                    "disccategory", colDiscCategories,
                    "bank",         SortByColumns(Filter('12_Banks', IsActive = true), "Title", SortOrder.Ascending),
                    "advisingbank", SortByColumns(Filter('12_Banks', IsActive = true, CanAdvise = true), "Title", SortOrder.Ascending),
                    "port",         SortByColumns(Filter('22_Ports', IsActive = true), "Title", SortOrder.Ascending),
                    "user",         SortByColumns(Filter('17_Users', IsActive = true), "Title", SortOrder.Ascending),
                    Blank()
                )

    recActionBar As rectangle:
        X: =0
        Y: =Parent.Height - 64
        Width: =Parent.Width
        Height: =64
        Fill: =ThemeSurface
        BorderColor: =ThemeBorder
        BorderThickness: =1

    lblSaveHint As label:
        X: =ThemeSpace5
        Y: =Parent.Height - 64
        Width: =Parent.Width - 400
        Height: =64
        Text: |
            =If(
                IsBlank(gblChildContext) || IsBlank(gblChildContext.LCItemId),
                "Select the LC this amendment belongs to before saving.",
                If(
                    Len(lblValidationSource.Text) > 0,
                    CountRows(Split(lblValidationSource.Text, Char(10))) & " issue(s) to resolve before saving.",
                    "Ready to save."
                )
            )
        Font: =ThemeFont
        Size: =ThemeSizeSmall
        Color: =If(Len(lblValidationSource.Text) > 0, ThemeDanger, ThemeTextMuted)
        VerticalAlign: =VerticalAlign.Middle
        PaddingLeft: =0

    btnCancel As button:
        X: =Parent.Width - 280
        Y: =Parent.Height - 48
        Width: =120
        Height: =34
        Text: ="Cancel"
        Fill: =ThemeSurface
        HoverFill: =ThemeSurfaceHover
        Color: =ThemeTextSecondary
        BorderColor: =ThemeBorderStrong
        BorderThickness: =1
        Font: =ThemeFont
        Size: =ThemeSizeBody
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        OnSelect: =Back()

    btnSave As button:
        X: =Parent.Width - 150
        Y: =Parent.Height - 48
        Width: =150 - ThemeSpace5
        Height: =34
        Text: ="Save"
        Fill: =ThemeAccent
        HoverFill: =ThemeAccentHover
        DisabledFill: =ThemeMutedSoft
        Color: =ThemeTextInverse
        DisabledColor: =ThemeTextMuted
        BorderThickness: =0
        Font: =ThemeFont
        Size: =ThemeSizeBody
        FontWeight: =FontWeight.Semibold
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        DisplayMode: |
            =If(
                Len(lblValidationSource.Text) > 0 || !IsOfficer ||
                IsBlank(gblChildContext) || IsBlank(gblChildContext.LCItemId),
                DisplayMode.Disabled,
                DisplayMode.Edit
            )
        OnSelect: |
            =Set(gblShowErrors, true);
            If(
                Len(lblValidationSource.Text) > 0,
                Notify("Resolve the listed issues before saving.", NotificationType.Error, 4000),
                (
                    Set(gblCorrelation, GUID());
                    Set(
                        gblSaved,
                        Patch(
                            '02_LCAmendments',
                            If(gblFormMode = "New", Defaults('02_LCAmendments'), gblOriginal),
                            gblDraft,
                            // Denormalised parent keys. Written on every save so a child row can
                            // never drift away from its LC, and so every child query stays a
                            // single indexed server-side filter.
                            {
                                LCItemId: gblChildContext.LCItemId,
                                LCNumber: gblChildContext.LCNumber,
                                InternalLCID: gblChildContext.InternalLCID
                            },
                            {
                            // The before values are snapshotted from the LC at the moment the
                            // amendment is recorded, not read later - that is what makes the
                            // before/after trail evidence rather than a reconstruction.
                            AmountBefore: If(IsBlank(gblDraft.AmountAfter), Blank(), gblParentLC.LCAmount),
                            ExpiryBefore: If(IsBlank(gblDraft.ExpiryAfter), Blank(), gblParentLC.ExpiryDate),
                            ShipmentDateBefore: If(IsBlank(gblDraft.ShipmentDateAfter), Blank(), gblParentLC.LatestShipmentDate),
                            AppliedToLC: Coalesce(gblOriginal.AppliedToLC, false)
                        }
                        )
                    );

                    ForAll(
                        Filter(
                            Table(
                                    { F: "AmendmentStatus", O: Coalesce(gblOriginal.AmendmentStatus, ""), N: Coalesce(gblDraft.AmendmentStatus, "") },
                                    { F: "CustomerAcceptance", O: Coalesce(gblOriginal.CustomerAcceptance, ""), N: Coalesce(gblDraft.CustomerAcceptance, "") },
                                    { F: "BankConfirmation", O: Coalesce(gblOriginal.BankConfirmation, ""), N: Coalesce(gblDraft.BankConfirmation, "") }
                            ),
                            O <> N
                        ) As chg,
                        Patch(
                            '10_AuditLog', Defaults('10_AuditLog'),
                            {
                                Title: "Amendment:" & gblSaved.Title & ":" & chg.F,
                                EntityName: "Amendment",
                                RecordItemId: gblSaved.ID,
                                RecordReference: gblSaved.Title,
                                InternalLCID: gblChildContext.InternalLCID,
                                LCNumber: gblChildContext.LCNumber,
                                ActionType: If(gblFormMode = "New", "Create", "Update"),
                                FieldName: chg.F,
                                OldValue: chg.O,
                                NewValue: chg.N,
                                IsCriticalField: chg.F in Split(CfgT("CriticalAuditFields", ""), ";").Value,
                                ActionByEmail: User().Email,
                                ActionByName: User().FullName,
                                ActionTimestamp: Now(),
                                ActionSource: "Power App",
                                CorrelationId: gblCorrelation,
                                PartitionKey: Text(Today0, "yyyy-mm")
                            }
                        )
                    );

                    Patch(
                        '01_ExportLCs',
                        LookUp('01_ExportLCs', ID = gblChildContext.LCItemId),
                        {
                            AmendmentCount: CountRows(Filter('02_LCAmendments', LCItemId = gblChildContext.LCItemId)),
                            LastActivityDate: Now()
                        }
                    );
                    Set(gblCurrentLC, LookUp('01_ExportLCs', ID = gblChildContext.LCItemId));
                    Notify("Saved.", NotificationType.Success, 2500);
                    Back()
                )
            )
