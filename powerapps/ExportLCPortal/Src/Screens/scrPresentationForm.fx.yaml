# =============================================================================
# scrPresentationForm - presentation form
# =============================================================================
# Create or edit a presentation. The presentation deadline is calculated as the earlier of transport document date plus the LC presentation period and the LC expiry - the single most common source of an unrecoverable discrepancy, so it is computed rather than typed.
#
# Shared mechanics with every other record form in the portal:
#   * A working copy (gblDraft) is edited, never the datasource directly, so validation
#     can see the whole prospective record before anything is written.
#   * Validation is one expression producing a list of messages; Save is disabled while
#     that list is non-empty.
#   * A status change is checked against 16_StatusMaster before it is allowed.
#   * Derived values are computed on save, not typed.
#   * One audit row per changed critical field, sharing one correlation id.
# =============================================================================

scrPresentationForm As screen:
    Fill: =ThemeCanvas
    OnVisible: |
        =Set(gblCorrelation, GUID());
        // The parent LC is needed for validation (tolerance, expiry, utilisation) and for
        // the denormalised keys written on save.
        Set(
            gblParentLC,
            Coalesce(
                LookUp('01_ExportLCs', ID = Coalesce(gblChildContext.LCItemId, gblEditChild.LCItemId, -1)),
                gblCurrentLC
            )
        );
        Set(gblOriginal, gblEditChild);
        Set(
            gblDraft,
            If(
                gblFormMode = "New",
                {
                    Title: "",
                    PresentationNumber: Blank(),
                    PresentingBank: "",
                    PresentationDate: Blank(),
                    AmountPresented: Blank(),
                    ShipmentNumber: "",
                    InvoiceNumbers: "",
                    DocumentsCount: Blank(),
                    CourierName: "",
                    CourierTrackingNumber: "",
                    DispatchDate: Blank(),
                    BankReceiptDate: Blank(),
                    ExaminationStatus: "Not Started",
                    AcceptanceDate: Blank(),
                    NegotiationDate: Blank(),
                    MaturityDate: Blank(),
                    PaymentDate: Blank(),
                    AmountAccepted: Blank(),
                    PresentationStatus: "Draft",
                    PresentationNotes: ""
                },
                gblEditChild
            )
        );
        Set(gblShowErrors, false)

    lblValidationSource As label:
        X: =-1000
        Y: =-1000
        Width: =1
        Height: =1
        Visible: =false
        Text: |
            =Concat(
                Filter(
                    Table(
                        { M: "Presentation reference is required.",
                          F: Len(Trim(Coalesce(gblDraft.Title, ""))) = 0 },
                        { M: "Amount presented is required.",
                          F: IsBlank(gblDraft.AmountPresented) },
                        { M: "Amount presented cannot be negative.",
                          F: Coalesce(gblDraft.AmountPresented, 0) < 0 },
                        { M: "Presentation date is after LC expiry. Documents presented after expiry are a discrepancy that cannot be cured.",
                          F: !IsBlank(gblDraft.PresentationDate) && !IsBlank(gblParentLC.ExpiryDate) && gblDraft.PresentationDate > gblParentLC.ExpiryDate },
                        { M: "Amount accepted cannot exceed the amount presented.",
                          F: Coalesce(gblDraft.AmountAccepted, 0) > Coalesce(gblDraft.AmountPresented, 0) },
                        { M: "Payment date cannot be before the acceptance date.",
                          F: !IsBlank(gblDraft.PaymentDate) && !IsBlank(gblDraft.AcceptanceDate) && gblDraft.PaymentDate < gblDraft.AcceptanceDate },
                        { M: "A presentation cannot be marked Clean while it has open discrepancies.",
                          F: gblDraft.PresentationStatus = "Clean" && !IsEmpty(Filter('06_Discrepancies', PresentationId = Coalesce(gblOriginal.ID, -1), IsOpen = true)) },
                        { M: "This presentation number is already used on this LC.",
                          F: !IsBlank(gblDraft.PresentationNumber) && !IsBlank(LookUp('05_Presentations', LCItemId = gblChildContext.LCItemId && PresentationNumber = gblDraft.PresentationNumber && ID <> Coalesce(gblOriginal.ID, -1))) },
                        { M: TransitionBlockReason("Presentation", Coalesce(gblOriginal.PresentationStatus, "Draft"), gblDraft.PresentationStatus),
                          F: gblFormMode = "Edit" && !CanTransition("Presentation", Coalesce(gblOriginal.PresentationStatus, "Draft"), gblDraft.PresentationStatus) }
                    ),
                    F
                ),
                M,
                Char(10)
            )

    topBar As cmpTopBar:
        X: =ThemeSpace5
        Y: =0
        Width: =Parent.Width - (ThemeSpace5 * 2)
        Height: =ThemeTopBarHeight
        TitleText: |
            =If(gblFormMode = "New", "New presentation", "Edit " & Coalesce(gblDraft.Title, "presentation"))
        Breadcrumb: |
            =Coalesce(gblParentLC.LCNumber, "No LC selected") & "  /  presentation"
        ShowSearch: =false
        ShowBack: =true
        OnBack: =Back()
        ShowPrimary: =false

    # Creating from a module register rather than from an LC workspace: pick the parent
    # first. Without it the record cannot be linked, and an unlinked child record is the
    # one thing this data model must never contain.
    cboParentLC As combobox:
        X: =ThemeSpace5
        Y: =ThemeTopBarHeight + ThemeSpace2
        Width: =400
        Height: =34
        Visible: =IsBlank(gblChildContext) || IsBlank(gblChildContext.LCItemId)
        Items: =SortByColumns(Filter('01_ExportLCs', IsClosed = false), "LCNumber", SortOrder.Ascending)
        DisplayFields: =["LCNumber"]
        SearchFields: =["LCNumber", "CustomerName", "OurReference"]
        IsSearchable: =true
        SelectMultiple: =false
        InputTextPlaceholder: ="Select the LC this presentation belongs to"
        Font: =ThemeFont
        Size: =ThemeSizeBody
        OnChange: |
            =Set(gblParentLC, Self.Selected);
            Set(
                gblChildContext,
                {
                    LCItemId: Self.Selected.ID,
                    LCNumber: Self.Selected.LCNumber,
                    InternalLCID: Self.Selected.Title,
                    CustomerName: Self.Selected.CustomerName,
                    CurrencyCode: Self.Selected.CurrencyCode
                }
            )

    recErrors As rectangle:
        X: =ThemeSpace5
        Y: =If(cboParentLC.Visible, cboParentLC.Y + 42, ThemeTopBarHeight + ThemeSpace3)
        Width: =Parent.Width - (ThemeSpace5 * 2)
        Height: =lblErrors.Height + ThemeSpace4
        Fill: =ThemeDangerSoft
        BorderColor: =ThemeDanger
        BorderThickness: =1
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        Visible: =gblShowErrors && Len(lblValidationSource.Text) > 0

    lblErrors As label:
        X: =recErrors.X + ThemeSpace4
        Y: =recErrors.Y + ThemeSpace2
        Width: =recErrors.Width - (ThemeSpace4 * 2)
        Height: |
            =(CountRows(Split(lblValidationSource.Text, Char(10))) * 20) + 8
        Text: =lblValidationSource.Text
        Font: =ThemeFont
        Size: =ThemeSizeBody
        Color: =ThemeDanger
        Visible: =recErrors.Visible
        PaddingLeft: =0

    galForm As gallery:
        X: =ThemeSpace5
        Y: |
            =If(recErrors.Visible, recErrors.Y + recErrors.Height + ThemeSpace3,
                If(cboParentLC.Visible, cboParentLC.Y + 42, ThemeTopBarHeight + ThemeSpace3))
        Width: =Parent.Width - (ThemeSpace5 * 2)
        Height: =Parent.Height - Self.Y - 72
        TemplateSize: =64
        TemplatePadding: =0
        ShowScrollbar: =true
        DelayItemLoading: =false
        WrapCount: =If(IsCompact, 1, 3)
        Items: |
            =Table(
                { K: "Title", L: "Presentation reference *", T: "text", O: "" },
                { K: "PresentationNumber", L: "Presentation number *", T: "number", O: "" },
                { K: "PresentingBank", L: "Presenting bank", T: "lookup", O: "advisingbank" },
                { K: "PresentationDate", L: "Presentation date", T: "date", O: "" },
                { K: "AmountPresented", L: "Amount presented *", T: "number", O: "" },
                { K: "ShipmentNumber", L: "Shipment number", T: "text", O: "" },
                { K: "InvoiceNumbers", L: "Invoices included", T: "text", O: "" },
                { K: "DocumentsCount", L: "Documents count", T: "number", O: "" },
                { K: "CourierName", L: "Courier", T: "text", O: "" },
                { K: "CourierTrackingNumber", L: "Courier tracking", T: "text", O: "" },
                { K: "DispatchDate", L: "Dispatch date", T: "date", O: "" },
                { K: "BankReceiptDate", L: "Bank receipt date", T: "date", O: "" },
                { K: "ExaminationStatus", L: "Examination status", T: "choice", O: "Not Started,Under Examination,Clean,Discrepant,Re-presented" },
                { K: "AcceptanceDate", L: "Acceptance date", T: "date", O: "" },
                { K: "NegotiationDate", L: "Negotiation date", T: "date", O: "" },
                { K: "MaturityDate", L: "Maturity date", T: "date", O: "" },
                { K: "PaymentDate", L: "Payment date", T: "date", O: "" },
                { K: "AmountAccepted", L: "Amount accepted", T: "number", O: "" },
                { K: "PresentationStatus", L: "Status", T: "status", O: "" },
                { K: "PresentationNotes", L: "Notes", T: "text", O: "" }
            )

        lblFieldLabel As label:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =18
            Text: =ThisItem.L
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            Color: =ThemeTextSecondary
            PaddingLeft: =0

        txtField As text:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T in ["text", "number"]
            Format: =If(ThisItem.T = "number", TextFormat.Number, TextFormat.Text)
            Font: =ThemeFont
            Size: =ThemeSizeBody
            BorderColor: =ThemeBorderStrong
            FocusedBorderColor: =ThemeAccent
            BorderThickness: =1
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            Default: |
                =Switch(
                    ThisItem.K,
                    "Title", Coalesce(gblDraft.Title, ""),
                    "ShipmentNumber", Coalesce(gblDraft.ShipmentNumber, ""),
                    "InvoiceNumbers", Coalesce(gblDraft.InvoiceNumbers, ""),
                    "CourierName", Coalesce(gblDraft.CourierName, ""),
                    "CourierTrackingNumber", Coalesce(gblDraft.CourierTrackingNumber, ""),
                    "PresentationNotes", Coalesce(gblDraft.PresentationNotes, ""),
                    "PresentationNumber", Text(gblDraft.PresentationNumber),
                    "AmountPresented", Text(gblDraft.AmountPresented),
                    "DocumentsCount", Text(gblDraft.DocumentsCount),
                    "AmountAccepted", Text(gblDraft.AmountAccepted),
                    ""
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "Title", Patch(gblDraft, { Title: Trim(Self.Value) }),
                        "ShipmentNumber", Patch(gblDraft, { ShipmentNumber: Trim(Self.Value) }),
                        "InvoiceNumbers", Patch(gblDraft, { InvoiceNumbers: Trim(Self.Value) }),
                        "CourierName", Patch(gblDraft, { CourierName: Trim(Self.Value) }),
                        "CourierTrackingNumber", Patch(gblDraft, { CourierTrackingNumber: Trim(Self.Value) }),
                        "PresentationNotes", Patch(gblDraft, { PresentationNotes: Trim(Self.Value) }),
                        "PresentationNumber", Patch(gblDraft, { PresentationNumber: Value(Self.Value) }),
                        "AmountPresented", Patch(gblDraft, { AmountPresented: Value(Self.Value) }),
                        "DocumentsCount", Patch(gblDraft, { DocumentsCount: Value(Self.Value) }),
                        "AmountAccepted", Patch(gblDraft, { AmountAccepted: Value(Self.Value) }),
                        gblDraft
                    )
                )

        dpField As datepicker:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "date"
            Font: =ThemeFont
            Size: =ThemeSizeBody
            DefaultDate: |
                =Switch(
                    ThisItem.K,
                    "PresentationDate", gblDraft.PresentationDate,
                    "DispatchDate", gblDraft.DispatchDate,
                    "BankReceiptDate", gblDraft.BankReceiptDate,
                    "AcceptanceDate", gblDraft.AcceptanceDate,
                    "NegotiationDate", gblDraft.NegotiationDate,
                    "MaturityDate", gblDraft.MaturityDate,
                    "PaymentDate", gblDraft.PaymentDate,
                    Blank()
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "PresentationDate", Patch(gblDraft, { PresentationDate: Self.SelectedDate }),
                        "DispatchDate", Patch(gblDraft, { DispatchDate: Self.SelectedDate }),
                        "BankReceiptDate", Patch(gblDraft, { BankReceiptDate: Self.SelectedDate }),
                        "AcceptanceDate", Patch(gblDraft, { AcceptanceDate: Self.SelectedDate }),
                        "NegotiationDate", Patch(gblDraft, { NegotiationDate: Self.SelectedDate }),
                        "MaturityDate", Patch(gblDraft, { MaturityDate: Self.SelectedDate }),
                        "PaymentDate", Patch(gblDraft, { PaymentDate: Self.SelectedDate }),
                        gblDraft
                    )
                )

        tglField As toggle:
            X: =0
            Y: =20
            Width: =80
            Height: =28
            Visible: =ThisItem.T = "boolean"
            Default: =false

        drpChoice As dropdown:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "choice"
            Font: =ThemeFont
            Size: =ThemeSizeBody
            Items: =Split(ThisItem.O, ",")
            Default: |
                =Switch(
                    ThisItem.K,
                    "ExaminationStatus", Coalesce(gblDraft.ExaminationStatus, ""),
                    ""
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "ExaminationStatus", Patch(gblDraft, { ExaminationStatus: Self.Selected.Value }),
                        gblDraft
                    )
                )

        # The status picker offers only the transitions 16_StatusMaster permits from the
        # current status, so an illegal move is not presented in the first place - the
        # validation rule behind it is the backstop, not the only control.
        drpStatus As dropdown:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "status"
            Font: =ThemeFont
            Size: =ThemeSizeBody
            Items: |
                =If(
                    gblFormMode = "New",
                    SortByColumns(Filter(colStatus, EntityName = "Presentation"), "SortOrder", SortOrder.Ascending),
                    Filter(
                        SortByColumns(Filter(colStatus, EntityName = "Presentation"), "SortOrder", SortOrder.Ascending),
                        CanTransition("Presentation", Coalesce(gblOriginal.PresentationStatus, "Draft"), StatusCode)
                    )
                )
            Default: =gblDraft.PresentationStatus
            OnChange: |
                =Set(gblDraft, Patch(gblDraft, { PresentationStatus: Self.Selected.StatusCode }))

        cboLookup As combobox:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "lookup"
            IsSearchable: =true
            SelectMultiple: =false
            Font: =ThemeFont
            Size: =ThemeSizeBody
            DisplayFields: =["Title"]
            SearchFields: =["Title"]
            Items: |
                =Switch(
                    ThisItem.O,
                    "currency",     colCurrencies,
                    "incoterm",     colIncoterms,
                    "doctype",      colDocTypes,
                    "disccategory", colDiscCategories,
                    "bank",         SortByColumns(Filter('12_Banks', IsActive = true), "Title", SortOrder.Ascending),
                    "advisingbank", SortByColumns(Filter('12_Banks', IsActive = true, CanAdvise = true), "Title", SortOrder.Ascending),
                    "port",         SortByColumns(Filter('22_Ports', IsActive = true), "Title", SortOrder.Ascending),
                    "user",         SortByColumns(Filter('17_Users', IsActive = true), "Title", SortOrder.Ascending),
                    Blank()
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "PresentingBank", Patch(gblDraft, { PresentingBank: Coalesce(Self.Selected.Title, Self.Selected.UserEmail, "") }),
                        gblDraft
                    )
                )

    recActionBar As rectangle:
        X: =0
        Y: =Parent.Height - 64
        Width: =Parent.Width
        Height: =64
        Fill: =ThemeSurface
        BorderColor: =ThemeBorder
        BorderThickness: =1

    lblSaveHint As label:
        X: =ThemeSpace5
        Y: =Parent.Height - 64
        Width: =Parent.Width - 400
        Height: =64
        Text: |
            =If(
                IsBlank(gblChildContext) || IsBlank(gblChildContext.LCItemId),
                "Select the LC this presentation belongs to before saving.",
                If(
                    Len(lblValidationSource.Text) > 0,
                    CountRows(Split(lblValidationSource.Text, Char(10))) & " issue(s) to resolve before saving.",
                    "Ready to save."
                )
            )
        Font: =ThemeFont
        Size: =ThemeSizeSmall
        Color: =If(Len(lblValidationSource.Text) > 0, ThemeDanger, ThemeTextMuted)
        VerticalAlign: =VerticalAlign.Middle
        PaddingLeft: =0

    btnCancel As button:
        X: =Parent.Width - 280
        Y: =Parent.Height - 48
        Width: =120
        Height: =34
        Text: ="Cancel"
        Fill: =ThemeSurface
        HoverFill: =ThemeSurfaceHover
        Color: =ThemeTextSecondary
        BorderColor: =ThemeBorderStrong
        BorderThickness: =1
        Font: =ThemeFont
        Size: =ThemeSizeBody
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        OnSelect: =Back()

    btnSave As button:
        X: =Parent.Width - 150
        Y: =Parent.Height - 48
        Width: =150 - ThemeSpace5
        Height: =34
        Text: ="Save"
        Fill: =ThemeAccent
        HoverFill: =ThemeAccentHover
        DisabledFill: =ThemeMutedSoft
        Color: =ThemeTextInverse
        DisabledColor: =ThemeTextMuted
        BorderThickness: =0
        Font: =ThemeFont
        Size: =ThemeSizeBody
        FontWeight: =FontWeight.Semibold
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        DisplayMode: |
            =If(
                Len(lblValidationSource.Text) > 0 || !IsOfficer ||
                IsBlank(gblChildContext) || IsBlank(gblChildContext.LCItemId),
                DisplayMode.Disabled,
                DisplayMode.Edit
            )
        OnSelect: |
            =Set(gblShowErrors, true);
            If(
                Len(lblValidationSource.Text) > 0,
                Notify("Resolve the listed issues before saving.", NotificationType.Error, 4000),
                (
                    Set(gblCorrelation, GUID());
                    Set(
                        gblSaved,
                        Patch(
                            '05_Presentations',
                            If(gblFormMode = "New", Defaults('05_Presentations'), gblOriginal),
                            gblDraft,
                            // Denormalised parent keys. Written on every save so a child row can
                            // never drift away from its LC, and so every child query stays a
                            // single indexed server-side filter.
                            {
                                LCItemId: gblChildContext.LCItemId,
                                LCNumber: gblChildContext.LCNumber,
                                InternalLCID: gblChildContext.InternalLCID
                            },
                            {
                            CurrencyCode: gblParentLC.CurrencyCode,
                            // Earlier of (transport doc date + presentation period) and LC expiry.
                            PresentationDeadline: With(
                                {
                                    fromShip: DateAdd(
                                        Coalesce(gblDraft.DispatchDate, gblDraft.PresentationDate, Today0),
                                        Coalesce(gblParentLC.PresentationPeriodDays, CfgN("DefaultPresentationPeriodDays", 21)),
                                        Days
                                    )
                                },
                                If(IsBlank(gblParentLC.ExpiryDate), fromShip, Min(fromShip, gblParentLC.ExpiryDate))
                            ),
                            ExaminationDueDate: If(
                                IsBlank(gblDraft.BankReceiptDate),
                                Blank(),
                                DateAdd(gblDraft.BankReceiptDate, CfgN("DefaultBankExaminationDays", 5), Days)
                            ),
                            IsClosed: Coalesce(
                                LookUp(colStatus, EntityName = "Presentation" && StatusCode = gblDraft.PresentationStatus).IsTerminal,
                                false
                            )
                        }
                        )
                    );

                    ForAll(
                        Filter(
                            Table(
                                    { F: "AmountPresented", O: Text(gblOriginal.AmountPresented), N: Text(gblDraft.AmountPresented) },
                                    { F: "AmountAccepted", O: Text(gblOriginal.AmountAccepted), N: Text(gblDraft.AmountAccepted) },
                                    { F: "PresentationDate", O: DateShort(gblOriginal.PresentationDate), N: DateShort(gblDraft.PresentationDate) },
                                    { F: "ExaminationStatus", O: Coalesce(gblOriginal.ExaminationStatus, ""), N: Coalesce(gblDraft.ExaminationStatus, "") },
                                    { F: "PresentationStatus", O: Coalesce(gblOriginal.PresentationStatus, ""), N: Coalesce(gblDraft.PresentationStatus, "") }
                            ),
                            O <> N
                        ) As chg,
                        Patch(
                            '10_AuditLog', Defaults('10_AuditLog'),
                            {
                                Title: "Presentation:" & gblSaved.Title & ":" & chg.F,
                                EntityName: "Presentation",
                                RecordItemId: gblSaved.ID,
                                RecordReference: gblSaved.Title,
                                InternalLCID: gblChildContext.InternalLCID,
                                LCNumber: gblChildContext.LCNumber,
                                ActionType: If(gblFormMode = "New", "Create", "Update"),
                                FieldName: chg.F,
                                OldValue: chg.O,
                                NewValue: chg.N,
                                IsCriticalField: chg.F in Split(CfgT("CriticalAuditFields", ""), ";").Value,
                                ActionByEmail: User().Email,
                                ActionByName: User().FullName,
                                ActionTimestamp: Now(),
                                ActionSource: "Power App",
                                CorrelationId: gblCorrelation,
                                PartitionKey: Text(Today0, "yyyy-mm")
                            }
                        )
                    );


                    Set(gblCurrentLC, LookUp('01_ExportLCs', ID = gblChildContext.LCItemId));
                    Notify("Saved.", NotificationType.Success, 2500);
                    Back()
                )
            )
