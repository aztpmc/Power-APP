# =============================================================================
# scrInvoiceForm - invoice form
# =============================================================================
# Create or edit a commercial invoice drawn under an LC. Outstanding amount is derived from invoice amount less paid amount, never typed.
#
# Shared mechanics with every other record form in the portal:
#   * A working copy (gblDraft) is edited, never the datasource directly, so validation
#     can see the whole prospective record before anything is written.
#   * Validation is one expression producing a list of messages; Save is disabled while
#     that list is non-empty.
#   * A status change is checked against 16_StatusMaster before it is allowed.
#   * Derived values are computed on save, not typed.
#   * One audit row per changed critical field, sharing one correlation id.
# =============================================================================

scrInvoiceForm As screen:
    Fill: =ThemeCanvas
    OnVisible: |
        =Set(gblCorrelation, GUID());
        // The parent LC is needed for validation (tolerance, expiry, utilisation) and for
        // the denormalised keys written on save.
        Set(
            gblParentLC,
            Coalesce(
                LookUp('01_ExportLCs', ID = Coalesce(gblChildContext.LCItemId, gblEditChild.LCItemId, -1)),
                gblCurrentLC
            )
        );
        Set(gblOriginal, gblEditChild);
        Set(
            gblDraft,
            If(
                gblFormMode = "New",
                {
                    Title: "",
                    InvoiceDate: Blank(),
                    CurrencyCode: "",
                    InvoiceAmount: Blank(),
                    PaidAmount: Blank(),
                    BankChargesAmount: Blank(),
                    PresentationDate: Blank(),
                    PresentationNumber: "",
                    ShipmentNumber: "",
                    CollectionDate: Blank(),
                    DueDate: Blank(),
                    TrackingNumber: "",
                    InvoiceStatus: "Draft",
                    NextAction: "",
                    GoodsDescription: "",
                    InvoiceNotes: ""
                },
                gblEditChild
            )
        );
        Set(gblShowErrors, false)

    lblValidationSource As label:
        X: =-1000
        Y: =-1000
        Width: =1
        Height: =1
        Visible: =false
        Text: |
            =Concat(
                Filter(
                    Table(
                        { M: "Invoice number is required.",
                          F: Len(Trim(Coalesce(gblDraft.Title, ""))) = 0 },
                        { M: "Invoice amount is required.",
                          F: IsBlank(gblDraft.InvoiceAmount) },
                        { M: "Invoice amount cannot be negative.",
                          F: Coalesce(gblDraft.InvoiceAmount, 0) < 0 },
                        { M: "Paid amount cannot exceed the invoice amount.",
                          F: Coalesce(gblDraft.PaidAmount, 0) > Coalesce(gblDraft.InvoiceAmount, 0) },
                        { M: "Due date cannot be before the invoice date.",
                          F: !IsBlank(gblDraft.DueDate) && !IsBlank(gblDraft.InvoiceDate) && gblDraft.DueDate < gblDraft.InvoiceDate },
                        { M: "Presentation date cannot be before the invoice date.",
                          F: !IsBlank(gblDraft.PresentationDate) && !IsBlank(gblDraft.InvoiceDate) && gblDraft.PresentationDate < gblDraft.InvoiceDate },
                        { M: "An invoice with this number already exists under this LC.",
                          F: Len(Trim(Coalesce(gblDraft.Title, ""))) > 0 && !IsBlank(LookUp('03_Invoices', LCItemId = gblChildContext.LCItemId && Title = gblDraft.Title && ID <> Coalesce(gblOriginal.ID, -1))) },
                        { M: "Presenting this invoice would draw more than the LC allows. Check for a missing amendment.",
                          F: gblDraft.InvoiceStatus <> "Draft" && !IsBlank(gblParentLC.MaximumAmount) && (Coalesce(gblParentLC.UtilizedAmount, 0) - Coalesce(gblOriginal.InvoiceAmount, 0) + Coalesce(gblDraft.InvoiceAmount, 0)) > gblParentLC.MaximumAmount + 0.01 && !CfgB("AllowNegativeOutstanding", false) },
                        { M: TransitionBlockReason("Invoice", Coalesce(gblOriginal.InvoiceStatus, "Draft"), gblDraft.InvoiceStatus),
                          F: gblFormMode = "Edit" && !CanTransition("Invoice", Coalesce(gblOriginal.InvoiceStatus, "Draft"), gblDraft.InvoiceStatus) }
                    ),
                    F
                ),
                M,
                Char(10)
            )

    topBar As cmpTopBar:
        X: =ThemeSpace5
        Y: =0
        Width: =Parent.Width - (ThemeSpace5 * 2)
        Height: =ThemeTopBarHeight
        TitleText: |
            =If(gblFormMode = "New", "New invoice", "Edit " & Coalesce(gblDraft.Title, "invoice"))
        Breadcrumb: |
            =Coalesce(gblParentLC.LCNumber, "No LC selected") & "  /  invoice"
        ShowSearch: =false
        ShowBack: =true
        OnBack: =Back()
        ShowPrimary: =false

    # Creating from a module register rather than from an LC workspace: pick the parent
    # first. Without it the record cannot be linked, and an unlinked child record is the
    # one thing this data model must never contain.
    cboParentLC As combobox:
        X: =ThemeSpace5
        Y: =ThemeTopBarHeight + ThemeSpace2
        Width: =400
        Height: =34
        Visible: =IsBlank(gblChildContext) || IsBlank(gblChildContext.LCItemId)
        Items: =SortByColumns(Filter('01_ExportLCs', IsClosed = false), "LCNumber", SortOrder.Ascending)
        DisplayFields: =["LCNumber"]
        SearchFields: =["LCNumber", "CustomerName", "OurReference"]
        IsSearchable: =true
        SelectMultiple: =false
        InputTextPlaceholder: ="Select the LC this invoice belongs to"
        Font: =ThemeFont
        Size: =ThemeSizeBody
        OnChange: |
            =Set(gblParentLC, Self.Selected);
            Set(
                gblChildContext,
                {
                    LCItemId: Self.Selected.ID,
                    LCNumber: Self.Selected.LCNumber,
                    InternalLCID: Self.Selected.Title,
                    CustomerName: Self.Selected.CustomerName,
                    CurrencyCode: Self.Selected.CurrencyCode
                }
            )

    recErrors As rectangle:
        X: =ThemeSpace5
        Y: =If(cboParentLC.Visible, cboParentLC.Y + 42, ThemeTopBarHeight + ThemeSpace3)
        Width: =Parent.Width - (ThemeSpace5 * 2)
        Height: =lblErrors.Height + ThemeSpace4
        Fill: =ThemeDangerSoft
        BorderColor: =ThemeDanger
        BorderThickness: =1
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        Visible: =gblShowErrors && Len(lblValidationSource.Text) > 0

    lblErrors As label:
        X: =recErrors.X + ThemeSpace4
        Y: =recErrors.Y + ThemeSpace2
        Width: =recErrors.Width - (ThemeSpace4 * 2)
        Height: |
            =(CountRows(Split(lblValidationSource.Text, Char(10))) * 20) + 8
        Text: =lblValidationSource.Text
        Font: =ThemeFont
        Size: =ThemeSizeBody
        Color: =ThemeDanger
        Visible: =recErrors.Visible
        PaddingLeft: =0

    galForm As gallery:
        X: =ThemeSpace5
        Y: |
            =If(recErrors.Visible, recErrors.Y + recErrors.Height + ThemeSpace3,
                If(cboParentLC.Visible, cboParentLC.Y + 42, ThemeTopBarHeight + ThemeSpace3))
        Width: =Parent.Width - (ThemeSpace5 * 2)
        Height: =Parent.Height - Self.Y - 72
        TemplateSize: =64
        TemplatePadding: =0
        ShowScrollbar: =true
        DelayItemLoading: =false
        WrapCount: =If(IsCompact, 1, 3)
        Items: |
            =Table(
                { K: "Title", L: "Invoice number *", T: "text", O: "" },
                { K: "InvoiceDate", L: "Invoice date", T: "date", O: "" },
                { K: "CurrencyCode", L: "Currency", T: "lookup", O: "currency" },
                { K: "InvoiceAmount", L: "Invoice amount *", T: "number", O: "" },
                { K: "PaidAmount", L: "Paid amount", T: "number", O: "" },
                { K: "BankChargesAmount", L: "Bank charges", T: "number", O: "" },
                { K: "PresentationDate", L: "Presentation date", T: "date", O: "" },
                { K: "PresentationNumber", L: "Presentation number", T: "text", O: "" },
                { K: "ShipmentNumber", L: "Shipment number", T: "text", O: "" },
                { K: "CollectionDate", L: "Collection date", T: "date", O: "" },
                { K: "DueDate", L: "Due date", T: "date", O: "" },
                { K: "TrackingNumber", L: "Courier tracking", T: "text", O: "" },
                { K: "InvoiceStatus", L: "Status", T: "status", O: "" },
                { K: "NextAction", L: "Next action", T: "text", O: "" },
                { K: "GoodsDescription", L: "Goods description", T: "text", O: "" },
                { K: "InvoiceNotes", L: "Notes", T: "text", O: "" }
            )

        lblFieldLabel As label:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =18
            Text: =ThisItem.L
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            Color: =ThemeTextSecondary
            PaddingLeft: =0

        txtField As text:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T in ["text", "number"]
            Format: =If(ThisItem.T = "number", TextFormat.Number, TextFormat.Text)
            Font: =ThemeFont
            Size: =ThemeSizeBody
            BorderColor: =ThemeBorderStrong
            FocusedBorderColor: =ThemeAccent
            BorderThickness: =1
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            Default: |
                =Switch(
                    ThisItem.K,
                    "Title", Coalesce(gblDraft.Title, ""),
                    "PresentationNumber", Coalesce(gblDraft.PresentationNumber, ""),
                    "ShipmentNumber", Coalesce(gblDraft.ShipmentNumber, ""),
                    "TrackingNumber", Coalesce(gblDraft.TrackingNumber, ""),
                    "NextAction", Coalesce(gblDraft.NextAction, ""),
                    "GoodsDescription", Coalesce(gblDraft.GoodsDescription, ""),
                    "InvoiceNotes", Coalesce(gblDraft.InvoiceNotes, ""),
                    "InvoiceAmount", Text(gblDraft.InvoiceAmount),
                    "PaidAmount", Text(gblDraft.PaidAmount),
                    "BankChargesAmount", Text(gblDraft.BankChargesAmount),
                    ""
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "Title", Patch(gblDraft, { Title: Trim(Self.Value) }),
                        "PresentationNumber", Patch(gblDraft, { PresentationNumber: Trim(Self.Value) }),
                        "ShipmentNumber", Patch(gblDraft, { ShipmentNumber: Trim(Self.Value) }),
                        "TrackingNumber", Patch(gblDraft, { TrackingNumber: Trim(Self.Value) }),
                        "NextAction", Patch(gblDraft, { NextAction: Trim(Self.Value) }),
                        "GoodsDescription", Patch(gblDraft, { GoodsDescription: Trim(Self.Value) }),
                        "InvoiceNotes", Patch(gblDraft, { InvoiceNotes: Trim(Self.Value) }),
                        "InvoiceAmount", Patch(gblDraft, { InvoiceAmount: Value(Self.Value) }),
                        "PaidAmount", Patch(gblDraft, { PaidAmount: Value(Self.Value) }),
                        "BankChargesAmount", Patch(gblDraft, { BankChargesAmount: Value(Self.Value) }),
                        gblDraft
                    )
                )

        dpField As datepicker:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "date"
            Font: =ThemeFont
            Size: =ThemeSizeBody
            DefaultDate: |
                =Switch(
                    ThisItem.K,
                    "InvoiceDate", gblDraft.InvoiceDate,
                    "PresentationDate", gblDraft.PresentationDate,
                    "CollectionDate", gblDraft.CollectionDate,
                    "DueDate", gblDraft.DueDate,
                    Blank()
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "InvoiceDate", Patch(gblDraft, { InvoiceDate: Self.SelectedDate }),
                        "PresentationDate", Patch(gblDraft, { PresentationDate: Self.SelectedDate }),
                        "CollectionDate", Patch(gblDraft, { CollectionDate: Self.SelectedDate }),
                        "DueDate", Patch(gblDraft, { DueDate: Self.SelectedDate }),
                        gblDraft
                    )
                )

        tglField As toggle:
            X: =0
            Y: =20
            Width: =80
            Height: =28
            Visible: =ThisItem.T = "boolean"
            Default: =false

        drpChoice As dropdown:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "choice"
            Font: =ThemeFont
            Size: =ThemeSizeBody
            Items: =Split(ThisItem.O, ",")
            Default: =""

        # The status picker offers only the transitions 16_StatusMaster permits from the
        # current status, so an illegal move is not presented in the first place - the
        # validation rule behind it is the backstop, not the only control.
        drpStatus As dropdown:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "status"
            Font: =ThemeFont
            Size: =ThemeSizeBody
            Items: |
                =If(
                    gblFormMode = "New",
                    SortByColumns(Filter(colStatus, EntityName = "Invoice"), "SortOrder", SortOrder.Ascending),
                    Filter(
                        SortByColumns(Filter(colStatus, EntityName = "Invoice"), "SortOrder", SortOrder.Ascending),
                        CanTransition("Invoice", Coalesce(gblOriginal.InvoiceStatus, "Draft"), StatusCode)
                    )
                )
            Default: =gblDraft.InvoiceStatus
            OnChange: |
                =Set(gblDraft, Patch(gblDraft, { InvoiceStatus: Self.Selected.StatusCode }))

        cboLookup As combobox:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "lookup"
            IsSearchable: =true
            SelectMultiple: =false
            Font: =ThemeFont
            Size: =ThemeSizeBody
            DisplayFields: =["Title"]
            SearchFields: =["Title"]
            Items: |
                =Switch(
                    ThisItem.O,
                    "currency",     colCurrencies,
                    "incoterm",     colIncoterms,
                    "doctype",      colDocTypes,
                    "disccategory", colDiscCategories,
                    "bank",         SortByColumns(Filter('12_Banks', IsActive = true), "Title", SortOrder.Ascending),
                    "advisingbank", SortByColumns(Filter('12_Banks', IsActive = true, CanAdvise = true), "Title", SortOrder.Ascending),
                    "port",         SortByColumns(Filter('22_Ports', IsActive = true), "Title", SortOrder.Ascending),
                    "user",         SortByColumns(Filter('17_Users', IsActive = true), "Title", SortOrder.Ascending),
                    Blank()
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "CurrencyCode", Patch(gblDraft, { CurrencyCode: Coalesce(Self.Selected.Title, Self.Selected.UserEmail, "") }),
                        gblDraft
                    )
                )

    recActionBar As rectangle:
        X: =0
        Y: =Parent.Height - 64
        Width: =Parent.Width
        Height: =64
        Fill: =ThemeSurface
        BorderColor: =ThemeBorder
        BorderThickness: =1

    lblSaveHint As label:
        X: =ThemeSpace5
        Y: =Parent.Height - 64
        Width: =Parent.Width - 400
        Height: =64
        Text: |
            =If(
                IsBlank(gblChildContext) || IsBlank(gblChildContext.LCItemId),
                "Select the LC this invoice belongs to before saving.",
                If(
                    Len(lblValidationSource.Text) > 0,
                    CountRows(Split(lblValidationSource.Text, Char(10))) & " issue(s) to resolve before saving.",
                    "Ready to save."
                )
            )
        Font: =ThemeFont
        Size: =ThemeSizeSmall
        Color: =If(Len(lblValidationSource.Text) > 0, ThemeDanger, ThemeTextMuted)
        VerticalAlign: =VerticalAlign.Middle
        PaddingLeft: =0

    btnCancel As button:
        X: =Parent.Width - 280
        Y: =Parent.Height - 48
        Width: =120
        Height: =34
        Text: ="Cancel"
        Fill: =ThemeSurface
        HoverFill: =ThemeSurfaceHover
        Color: =ThemeTextSecondary
        BorderColor: =ThemeBorderStrong
        BorderThickness: =1
        Font: =ThemeFont
        Size: =ThemeSizeBody
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        OnSelect: =Back()

    btnSave As button:
        X: =Parent.Width - 150
        Y: =Parent.Height - 48
        Width: =150 - ThemeSpace5
        Height: =34
        Text: ="Save"
        Fill: =ThemeAccent
        HoverFill: =ThemeAccentHover
        DisabledFill: =ThemeMutedSoft
        Color: =ThemeTextInverse
        DisabledColor: =ThemeTextMuted
        BorderThickness: =0
        Font: =ThemeFont
        Size: =ThemeSizeBody
        FontWeight: =FontWeight.Semibold
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        DisplayMode: |
            =If(
                Len(lblValidationSource.Text) > 0 || !IsOfficer ||
                IsBlank(gblChildContext) || IsBlank(gblChildContext.LCItemId),
                DisplayMode.Disabled,
                DisplayMode.Edit
            )
        OnSelect: |
            =Set(gblShowErrors, true);
            If(
                Len(lblValidationSource.Text) > 0,
                Notify("Resolve the listed issues before saving.", NotificationType.Error, 4000),
                (
                    Set(gblCorrelation, GUID());
                    Set(
                        gblSaved,
                        Patch(
                            '03_Invoices',
                            If(gblFormMode = "New", Defaults('03_Invoices'), gblOriginal),
                            gblDraft,
                            // Denormalised parent keys. Written on every save so a child row can
                            // never drift away from its LC, and so every child query stays a
                            // single indexed server-side filter.
                            {
                                LCItemId: gblChildContext.LCItemId,
                                LCNumber: gblChildContext.LCNumber,
                                InternalLCID: gblChildContext.InternalLCID
                            },
                            {
                            OutstandingAmount: Coalesce(gblDraft.InvoiceAmount, 0) - Coalesce(gblDraft.PaidAmount, 0),
                            IsSettled: Coalesce(gblDraft.PaidAmount, 0) >= Coalesce(gblDraft.InvoiceAmount, 0) &&
                                       Coalesce(gblDraft.InvoiceAmount, 0) > 0
                        }
                        )
                    );

                    ForAll(
                        Filter(
                            Table(
                                    { F: "Title", O: Coalesce(gblOriginal.Title, ""), N: Coalesce(gblDraft.Title, "") },
                                    { F: "InvoiceAmount", O: Text(gblOriginal.InvoiceAmount), N: Text(gblDraft.InvoiceAmount) },
                                    { F: "PaidAmount", O: Text(gblOriginal.PaidAmount), N: Text(gblDraft.PaidAmount) },
                                    { F: "DueDate", O: DateShort(gblOriginal.DueDate), N: DateShort(gblDraft.DueDate) },
                                    { F: "InvoiceStatus", O: Coalesce(gblOriginal.InvoiceStatus, ""), N: Coalesce(gblDraft.InvoiceStatus, "") }
                            ),
                            O <> N
                        ) As chg,
                        Patch(
                            '10_AuditLog', Defaults('10_AuditLog'),
                            {
                                Title: "Invoice:" & gblSaved.Title & ":" & chg.F,
                                EntityName: "Invoice",
                                RecordItemId: gblSaved.ID,
                                RecordReference: gblSaved.Title,
                                InternalLCID: gblChildContext.InternalLCID,
                                LCNumber: gblChildContext.LCNumber,
                                ActionType: If(gblFormMode = "New", "Create", "Update"),
                                FieldName: chg.F,
                                OldValue: chg.O,
                                NewValue: chg.N,
                                IsCriticalField: chg.F in Split(CfgT("CriticalAuditFields", ""), ";").Value,
                                ActionByEmail: User().Email,
                                ActionByName: User().FullName,
                                ActionTimestamp: Now(),
                                ActionSource: "Power App",
                                CorrelationId: gblCorrelation,
                                PartitionKey: Text(Today0, "yyyy-mm")
                            }
                        )
                    );

                    // Roll the LC's utilisation forward from its invoices. Stored on the LC so the
                    // register and dashboard can filter and sort on it without a per-row query.
                    With(
                        { drawn: Sum(Filter('03_Invoices', LCItemId = gblChildContext.LCItemId, InvoiceStatus <> "Cancelled"), InvoiceAmount) },
                        Patch(
                            '01_ExportLCs',
                            LookUp('01_ExportLCs', ID = gblChildContext.LCItemId),
                            {
                                UtilizedAmount: drawn,
                                OutstandingAmount: Coalesce(gblParentLC.MaximumAmount, gblParentLC.LCAmount) - drawn,
                                AvailableAmount: Coalesce(gblParentLC.MaximumAmount, gblParentLC.LCAmount) - drawn,
                                InvoiceCount: CountRows(Filter('03_Invoices', LCItemId = gblChildContext.LCItemId)),
                                LastActivityDate: Now()
                            }
                        )
                    );
                    Set(gblCurrentLC, LookUp('01_ExportLCs', ID = gblChildContext.LCItemId));
                    Notify("Saved.", NotificationType.Success, 2500);
                    Back()
                )
            )
