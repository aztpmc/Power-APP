        btnApplyAmd As button:
            X: =Parent.TemplateWidth - 130 - ThemeSpace4
            Y: =Parent.TemplateHeight - 42
            Width: =130
            Height: =28
            Text: ="Apply to LC"
            # Only an accepted, unapplied amendment can be applied, and only by someone who
            # may edit the LC. Everything else about the amendment stays visible.
            Visible: |
                =CanEditLC && !ThisItem.AppliedToLC && ThisItem.AmendmentStatus = "Accepted"
            Fill: =ThemeAccent
            HoverFill: =ThemeAccentHover
            Color: =ThemeTextInverse
            BorderThickness: =0
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            # Applying an amendment writes the new values forward onto the LC, stamps the
            # amendment as applied, and records one audit row per changed field under a single
            # correlation id so the change reads as one transaction.
            OnSelect: |
                =Set(gblCorrelation, GUID());
                With(
                    { amd: ThisItem, lc: gblCurrentLC },
                    Patch(
                        '01_ExportLCs',
                        lc,
                        {
                            LCAmount: Coalesce(amd.AmountAfter, lc.LCAmount),
                            MaximumAmount: Coalesce(amd.AmountAfter, lc.LCAmount) * (1 + Coalesce(lc.TolerancePlus, 0) / 100),
                            ExpiryDate: Coalesce(amd.ExpiryAfter, lc.ExpiryDate),
                            LatestShipmentDate: Coalesce(amd.ShipmentDateAfter, lc.LatestShipmentDate),
                            OutstandingAmount: Coalesce(amd.AmountAfter, lc.LCAmount) * (1 + Coalesce(lc.TolerancePlus, 0) / 100) - Coalesce(lc.UtilizedAmount, 0),
                            LastActivityDate: Now()
                        }
                    );
                    Patch(
                        '02_LCAmendments',
                        amd,
                        { AppliedToLC: true, AmendmentStatus: "Applied", AppliedDate: Now(), AppliedBy: User() }
                    );
                    ForAll(
                        Filter(
                            Table(
                                { F: "LCAmount",           O: Text(lc.LCAmount),           N: Text(amd.AmountAfter),        S: !IsBlank(amd.AmountAfter) },
                                { F: "ExpiryDate",         O: DateShort(lc.ExpiryDate),    N: DateShort(amd.ExpiryAfter),   S: !IsBlank(amd.ExpiryAfter) },
                                { F: "LatestShipmentDate", O: DateShort(lc.LatestShipmentDate), N: DateShort(amd.ShipmentDateAfter), S: !IsBlank(amd.ShipmentDateAfter) }
                            ),
                            S
                        ) As chg,
                        Patch(
                            '10_AuditLog',
                            Defaults('10_AuditLog'),
                            {
                                Title: "ExportLC:" & lc.Title & ":" & chg.F,
                                EntityName: "ExportLC",
                                RecordItemId: lc.ID,
                                RecordReference: lc.LCNumber,
                                InternalLCID: lc.Title,
                                LCNumber: lc.LCNumber,
                                ActionType: "Amendment Applied",
                                FieldName: chg.F,
                                OldValue: chg.O,
                                NewValue: chg.N,
                                IsCriticalField: true,
                                ActionByEmail: User().Email,
                                ActionByName: User().FullName,
                                ActionTimestamp: Now(),
                                ActionSource: "Power App",
                                ActionComment: "Applied amendment " & amd.AmendmentNumber,
                                CorrelationId: gblCorrelation,
                                PartitionKey: Text(Today0, "yyyy-mm")
                            }
                        )
                    )
                );
                Set(gblCurrentLC, LookUp('01_ExportLCs', ID = gblLCId));
                Notify("Amendment applied and the LC updated.", NotificationType.Success, 3000)

    emptyAmendments As cmpEmptyState:
        X: =ContentX
