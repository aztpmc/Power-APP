# =============================================================================
# scrLCWorkspace - the LC workspace
# =============================================================================
# Opening an LC lands here, not in an edit form. The workspace is where a treasury
# officer does a day's work on one credit:
#
#   * A header that never scrolls away: LC number, customer, issuing bank, amount,
#     outstanding, status, expiry and latest shipment date.
#   * A lifecycle rail showing exactly where the credit is between Received and Closed.
#   * Dynamically generated warnings - expiry, shipment deadline, missing documents,
#     open discrepancies, outstanding proceeds - computed from the record, never hard-coded.
#   * Twelve tabs covering the whole lifecycle, each one a delegable query on LCItemId.
#
# The record arrives in gblCurrentLC. It is re-read on entry (RefreshLC) so a workspace
# opened from a stale register row still shows current figures.
# =============================================================================

scrLCWorkspace As screen:
    Fill: =ThemeCanvas
    OnVisible: |
        =Set(gblNavSection, "LCS");
        // Re-read from the source. The register row may be minutes old.
        Set(gblCurrentLC, LookUp('01_ExportLCs', ID = gblCurrentLC.ID));
        Set(gblLCId, gblCurrentLC.ID);
        Set(gblLCInternalId, gblCurrentLC.Title);
        // Checklist drives the missing-document warning and the Documents tab; it is small
        // (a few dozen rows per LC) so one read per visit is the cheaper option.
        ClearCollect(colChecklist, ChecklistFor(gblLCId));
        Set(gblEditingLC, false)

    navRail As cmpNavRail:
        X: =0
        Y: =0
        Width: =RailWidth
        Height: =Parent.Height
        ActiveKey: ="LCS"
        UserName: =gblUserName
        RoleLabel: |
            =Switch(gblRole, "ADMIN", "Administrator", "MANAGER", "Treasury Manager",
                "OFFICER", "Treasury Officer", "REVIEWER", "Reviewer", "Read only")
        OnNavigate: |
            =Switch(
                gblNavSection,
                "HOME",      Navigate(scrDashboard, ScreenTransition.None),
                "LCS",       Navigate(scrLCRegister, ScreenTransition.None),
                "INVOICES",  Navigate(scrInvoices, ScreenTransition.None),
                "SHIPMENTS", Navigate(scrShipments, ScreenTransition.None),
                "PRESENT",   Navigate(scrPresentations, ScreenTransition.None),
                "DOCS",      Navigate(scrDocuments, ScreenTransition.None),
                "DISCREP",   Navigate(scrDiscrepancies, ScreenTransition.None),
                "PROCEEDS",  Navigate(scrProceeds, ScreenTransition.None),
                "CORRESP",   Navigate(scrCorrespondence, ScreenTransition.None),
                "TASKS",     Navigate(scrTasks, ScreenTransition.None),
                "REPORTS",   Navigate(scrReports, ScreenTransition.None),
                "ADMIN",     Navigate(scrAdmin, ScreenTransition.None)
            )

    topBar As cmpTopBar:
        X: =ContentX
        Y: =0
        Width: =ContentWidth
        Height: =ThemeTopBarHeight
        TitleText: =gblCurrentLC.LCNumber
        Breadcrumb: |
            ="Export LCs  /  " & gblCurrentLC.Title & "  /  " & gblWorkspaceTab
        ShowSearch: =false
        ShowBack: =true
        OnBack: =Back()
        ShowPrimary: =CanEditLC && !gblEditingLC
        PrimaryLabel: ="Edit LC"
        OnPrimary: |
            =Set(gblEditLC, gblCurrentLC);
            Set(gblFormMode, "Edit");
            Navigate(scrLCForm, ScreenTransition.CoverRight)

    # =========================================================================
    # HEADER - the facts an officer needs before doing anything else.
    # =========================================================================
    recHeaderCard As rectangle:
        X: =ContentX
        Y: =ThemeTopBarHeight + ThemeSpace3
        Width: =ContentWidth
        Height: =188
        Fill: =ThemeSurface
        BorderColor: =ThemeBorder
        BorderThickness: =1
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius

    lblHdrCustomer As label:
        X: =recHeaderCard.X + ThemeSpace5
        Y: =recHeaderCard.Y + ThemeSpace4
        Width: =360
        Height: =26
        Text: =gblCurrentLC.CustomerName
        Font: =ThemeFont
        Size: =ThemeSizeTitle
        FontWeight: =FontWeight.Semibold
        Color: =ThemeText
        PaddingLeft: =0

    lblHdrRefs As label:
        X: =lblHdrCustomer.X
        Y: =lblHdrCustomer.Y + 26
        Width: =420
        Height: =18
        Text: |
            =gblCurrentLC.Title & "  ·  our ref " & Coalesce(gblCurrentLC.OurReference, "-") &
             "  ·  " & Coalesce(gblCurrentLC.CountryName, "-")
        Font: =ThemeFont
        Size: =ThemeSizeSmall
        Color: =ThemeTextMuted
        PaddingLeft: =0

    lblHdrBank As label:
        X: =lblHdrCustomer.X
        Y: =lblHdrRefs.Y + 20
        Width: =420
        Height: =18
        Text: |
            ="Issued by " & Coalesce(gblCurrentLC.IssuingBankName, "-") &
             "  ·  advised through " & Coalesce(gblCurrentLC.AdvisingBankName, "-")
        Font: =ThemeFont
        Size: =ThemeSizeSmall
        Color: =ThemeTextSecondary
        PaddingLeft: =0

    badgeHeader As cmpStatusBadge:
        X: =recHeaderCard.X + recHeaderCard.Width - 140 - ThemeSpace5
        Y: =recHeaderCard.Y + ThemeSpace4 + 2
        Width: =140
        Height: =26
        Entity: ="ExportLC"
        StatusCode: =gblCurrentLC.LCStatus
        BadgeWidth: =140

    lblHdrOfficer As label:
        X: =recHeaderCard.X + recHeaderCard.Width - 300 - ThemeSpace5
        Y: =lblHdrRefs.Y
        Width: =300
        Height: =18
        Text: |
            ="Responsible: " & Coalesce(gblCurrentLC.ResponsibleOfficer.DisplayName, "unassigned")
        Align: =Align.Right
        Font: =ThemeFont
        Size: =ThemeSizeSmall
        Color: =ThemeTextSecondary
        PaddingRight: =0

    # --- the five numbers that matter, in a fixed order -----------------------
    galHeaderFacts As gallery:
        X: =recHeaderCard.X + ThemeSpace5
        Y: =lblHdrBank.Y + 30
        Width: =recHeaderCard.Width - (ThemeSpace5 * 2)
        Height: =56
        Layout: =Layout.Horizontal
        TemplateSize: =(recHeaderCard.Width - (ThemeSpace5 * 2)) / 5
        TemplatePadding: =0
        ShowScrollbar: =false
        DelayItemLoading: =false
        Items: |
            =Table(
                {
                    Cap: "LC Amount",
                    Val: Money(gblCurrentLC.LCAmount, gblCurrentLC.CurrencyCode),
                    Sub: If(gblCurrentLC.TolerancePlus > 0, "+" & gblCurrentLC.TolerancePlus & "% tolerance", gblCurrentLC.CurrencyCode),
                    Col: ThemeText
                },
                {
                    Cap: "Utilised",
                    Val: Money(gblCurrentLC.UtilizedAmount, gblCurrentLC.CurrencyCode),
                    Sub: If(
                        Coalesce(gblCurrentLC.LCAmount, 0) > 0,
                        Text(gblCurrentLC.UtilizedAmount / gblCurrentLC.LCAmount, "0%") & " drawn",
                        ""
                    ),
                    Col: ThemeText
                },
                {
                    Cap: "Outstanding",
                    Val: Money(gblCurrentLC.OutstandingAmount, gblCurrentLC.CurrencyCode),
                    Sub: If(gblCurrentLC.OutstandingAmount <= 0, "fully drawn", "available to draw"),
                    Col: If(gblCurrentLC.OutstandingAmount <= 0, ThemeTextMuted, ThemeSuccess)
                },
                {
                    Cap: "Latest Shipment",
                    Val: DateShort(gblCurrentLC.LatestShipmentDate),
                    Sub: DaysPhrase(gblCurrentLC.LatestShipmentDate),
                    Col: UrgencyColor(gblCurrentLC.LatestShipmentDate)
                },
                {
                    Cap: "Expiry",
                    Val: DateShort(gblCurrentLC.ExpiryDate),
                    Sub: DaysPhrase(gblCurrentLC.ExpiryDate) & If(Len(Coalesce(gblCurrentLC.ExpiryPlace, "")) > 0, " · " & gblCurrentLC.ExpiryPlace, ""),
                    Col: UrgencyColor(gblCurrentLC.ExpiryDate)
                }
            )

        lblFactCap As label:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth - ThemeSpace3
            Height: =16
            Text: =Upper(ThisItem.Cap)
            Font: =ThemeFont
            Size: =ThemeSizeMicro
            FontWeight: =FontWeight.Semibold
            Color: =ThemeTextMuted
            PaddingLeft: =0

        lblFactVal As label:
            X: =0
            Y: =16
            Width: =Parent.TemplateWidth - ThemeSpace3
            Height: =24
            Text: =ThisItem.Val
            Font: =ThemeFont
            Size: =ThemeSizeHeading
            FontWeight: =FontWeight.Semibold
            Color: =ThisItem.Col
            PaddingLeft: =0

        lblFactSub As label:
            X: =0
            Y: =39
            Width: =Parent.TemplateWidth - ThemeSpace3
            Height: =16
            Text: =ThisItem.Sub
            Font: =ThemeFont
            Size: =ThemeSizeMicro
            Color: =ThemeTextMuted
            PaddingLeft: =0

    stageTracker As cmpStageTracker:
        X: =recHeaderCard.X + ThemeSpace5
        Y: =recHeaderCard.Y + recHeaderCard.Height + ThemeSpace3
        Width: =recHeaderCard.Width - (ThemeSpace5 * 2)
        Height: =64
        CurrentStage: |
            =Coalesce(
                LookUp(colStatus, EntityName = "ExportLC" && StatusCode = gblCurrentLC.LCStatus).LifecycleStage,
                "Received"
            )
        IsCancelled: =gblCurrentLC.LCStatus in ["Cancelled", "Expired"]

    # =========================================================================
    # TABS
    # =========================================================================
    galTabs As gallery:
        X: =ContentX
        Y: =stageTracker.Y + stageTracker.Height + ThemeSpace3
        Width: =ContentWidth
        Height: =40
        Layout: =Layout.Horizontal
        TemplateSize: =ContentWidth / 12
        TemplatePadding: =0
        ShowScrollbar: =false
        DelayItemLoading: =false
        # Counts on the tabs come from the record's stored counters, not from counting
        # child rows here - a tab strip that fires eleven queries on every visit is how a
        # workspace ends up taking four seconds to open.
        Items: |
            =Table(
                { Key: "Overview",       Label: "Overview",       Count: 0 },
                { Key: "Details",        Label: "LC Details",     Count: 0 },
                { Key: "Amendments",     Label: "Amendments",     Count: gblCurrentLC.AmendmentCount },
                { Key: "Invoices",       Label: "Invoices",       Count: gblCurrentLC.InvoiceCount },
                { Key: "Shipments",      Label: "Shipments",      Count: 0 },
                { Key: "Documents",      Label: "Documents",      Count: gblCurrentLC.MissingDocumentCount },
                { Key: "Presentations",  Label: "Presentations",  Count: 0 },
                { Key: "Discrepancies",  Label: "Discrepancies",  Count: gblCurrentLC.OpenDiscrepancyCount },
                { Key: "Proceeds",       Label: "Proceeds",       Count: 0 },
                { Key: "Correspondence", Label: "Correspondence", Count: 0 },
                { Key: "Tasks",          Label: "Tasks",          Count: gblCurrentLC.OpenTaskCount },
                { Key: "Audit",          Label: "Audit",          Count: 0 }
            )

        btnTab As button:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth
            Height: =Parent.TemplateHeight
            Text: =""
            Fill: =RGBA(0, 0, 0, 0)
            HoverFill: =ThemeSurfaceHover
            BorderThickness: =0
            OnSelect: =Set(gblWorkspaceTab, ThisItem.Key)
            AccessibleLabel: =ThisItem.Label

        lblTab As label:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth
            Height: =Parent.TemplateHeight - 3
            Text: |
                =ThisItem.Label & If(ThisItem.Count > 0, "  " & ThisItem.Count, "")
            Align: =Align.Center
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            FontWeight: |
                =If(gblWorkspaceTab = ThisItem.Key, FontWeight.Semibold, FontWeight.Normal)
            Color: |
                =If(gblWorkspaceTab = ThisItem.Key, ThemeAccent, ThemeTextSecondary)
            VerticalAlign: =VerticalAlign.Middle
            PaddingLeft: =0
            DisplayMode: =DisplayMode.View

        recTabUnderline As rectangle:
            X: =0
            Y: =Parent.TemplateHeight - 3
            Width: =Parent.TemplateWidth
            Height: =3
            Fill: =ThemeAccent
            Visible: =gblWorkspaceTab = ThisItem.Key

    recTabRule As rectangle:
        X: =ContentX
        Y: =galTabs.Y + galTabs.Height - 1
        Width: =ContentWidth
        Height: =1
        Fill: =ThemeBorder

    # =========================================================================
    # TAB: OVERVIEW
    # Dynamic warnings, then a two-column operational summary.
    # =========================================================================
    galWarnings As gallery:
        X: =ContentX
        Y: =galTabs.Y + galTabs.Height + ThemeSpace3
        Width: =ContentWidth
        Height: |
            =Min(CountRows(Self.AllItems), 6) * 46
        Visible: =gblWorkspaceTab = "Overview"
        TemplateSize: =46
        TemplatePadding: =0
        ShowScrollbar: =false
        DelayItemLoading: =false
        # Every warning in section 8 of the brief, generated from the record rather than
        # written as static text. A rule that finds nothing produces no banner.
        Items: |
            =Filter(
                Table(
                    {
                        Sev: If(DaysUntil(gblCurrentLC.ExpiryDate) < 0, "Danger", "Warning"),
                        Msg: If(
                            DaysUntil(gblCurrentLC.ExpiryDate) < 0,
                            "LC expired " & Abs(DaysUntil(gblCurrentLC.ExpiryDate)) & " days ago on " & DateShort(gblCurrentLC.ExpiryDate),
                            "LC expires " & DaysPhrase(gblCurrentLC.ExpiryDate) & " on " & DateShort(gblCurrentLC.ExpiryDate)
                        ),
                        Act: "",
                        Show: !gblCurrentLC.IsClosed && DaysUntil(gblCurrentLC.ExpiryDate) <= WinExpiringSoon
                    },
                    {
                        Sev: If(DaysUntil(gblCurrentLC.LatestShipmentDate) < 0, "Danger", "Warning"),
                        Msg: If(
                            DaysUntil(gblCurrentLC.LatestShipmentDate) < 0,
                            "Latest shipment date passed " & Abs(DaysUntil(gblCurrentLC.LatestShipmentDate)) & " days ago",
                            "Shipment deadline " & DaysPhrase(gblCurrentLC.LatestShipmentDate)
                        ),
                        Act: "Open shipments",
                        Show: !gblCurrentLC.IsClosed && DaysUntil(gblCurrentLC.LatestShipmentDate) <= WinShipmentSoon
                    },
                    {
                        Sev: "Warning",
                        Msg: gblCurrentLC.MissingDocumentCount & " required document" &
                             If(gblCurrentLC.MissingDocumentCount = 1, " is", "s are") & " missing",
                        Act: "Open checklist",
                        Show: gblCurrentLC.MissingDocumentCount > 0
                    },
                    {
                        Sev: "Danger",
                        Msg: gblCurrentLC.OpenDiscrepancyCount & " discrepanc" &
                             If(gblCurrentLC.OpenDiscrepancyCount = 1, "y is", "ies are") & " open",
                        Act: "Open discrepancies",
                        Show: gblCurrentLC.OpenDiscrepancyCount > 0
                    },
                    {
                        Sev: "Info",
                        Msg: "Proceeds outstanding: " &
                             Money(gblCurrentLC.OutstandingAmount - Coalesce(gblCurrentLC.AmountPaidToDate, 0), gblCurrentLC.CurrencyCode),
                        Act: "Open proceeds",
                        Show: Coalesce(gblCurrentLC.AmountPaidToDate, 0) < Coalesce(gblCurrentLC.UtilizedAmount, 0)
                    },
                    {
                        Sev: "Warning",
                        Msg: "An amendment is awaiting action and has not been applied to this LC",
                        Act: "Open amendments",
                        Show: gblCurrentLC.AmendmentCount > 0 && !IsEmpty(Filter('02_LCAmendments', LCItemId = gblLCId, AppliedToLC = false))
                    }
                ),
                Show
            )

        alertRow As cmpAlertBanner:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth
            Height: =40
            Severity: =ThisItem.Sev
            Message: =ThisItem.Msg
            ActionLabel: =ThisItem.Act
            OnAction: |
                =Set(
                    gblWorkspaceTab,
                    Switch(
                        ThisItem.Act,
                        "Open shipments", "Shipments",
                        "Open checklist", "Documents",
                        "Open discrepancies", "Discrepancies",
                        "Open proceeds", "Proceeds",
                        "Open amendments", "Amendments",
                        gblWorkspaceTab
                    )
                )

    cardOvFinancial As cmpSectionCard:
        X: =ContentX
        Y: =galWarnings.Y + galWarnings.Height + ThemeSpace3
        Width: =(ContentWidth / 2) - ThemeSpace2
        Height: =230
        Visible: =gblWorkspaceTab = "Overview"
        HeaderText: ="Financial position"
        SubText: ="All figures in " & gblCurrentLC.CurrencyCode
        ActionLabel: ="Proceeds"
        OnAction: =Set(gblWorkspaceTab, "Proceeds")

    galOvFinancial As gallery:
        X: =cardOvFinancial.X + ThemeSpace4
        Y: =cardOvFinancial.Y + 62
        Width: =cardOvFinancial.Width - (ThemeSpace4 * 2)
        Height: =160
        Visible: =cardOvFinancial.Visible
        TemplateSize: =32
        TemplatePadding: =0
        ShowScrollbar: =false
        DelayItemLoading: =false
        Items: |
            =Table(
                { L: "LC amount",        V: Money(gblCurrentLC.LCAmount, gblCurrentLC.CurrencyCode),        E: false },
                { L: "Maximum amount",   V: Money(gblCurrentLC.MaximumAmount, gblCurrentLC.CurrencyCode),   E: false },
                { L: "Utilised",         V: Money(gblCurrentLC.UtilizedAmount, gblCurrentLC.CurrencyCode),  E: false },
                { L: "Outstanding",      V: Money(gblCurrentLC.OutstandingAmount, gblCurrentLC.CurrencyCode), E: true },
                { L: "Paid to date",     V: Money(gblCurrentLC.AmountPaidToDate, gblCurrentLC.CurrencyCode), E: false }
            )
        fieldRow As cmpFieldRow:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth
            Height: =31
            FieldLabel: =ThisItem.L
            FieldValue: =ThisItem.V
            Emphasis: =ThisItem.E
            LabelWidth: =150

    cardOvDates As cmpSectionCard:
        X: =ContentX + (ContentWidth / 2) + ThemeSpace2
        Y: =cardOvFinancial.Y
        Width: =(ContentWidth / 2) - ThemeSpace2
        Height: =230
        Visible: =gblWorkspaceTab = "Overview"
        HeaderText: ="Key dates"
        SubText: ="Deadlines driving the credit"
        ActionLabel: ="LC details"
        OnAction: =Set(gblWorkspaceTab, "Details")

    galOvDates As gallery:
        X: =cardOvDates.X + ThemeSpace4
        Y: =cardOvDates.Y + 62
        Width: =cardOvDates.Width - (ThemeSpace4 * 2)
        Height: =160
        Visible: =cardOvDates.Visible
        TemplateSize: =32
        TemplatePadding: =0
        ShowScrollbar: =false
        DelayItemLoading: =false
        Items: |
            =Table(
                { L: "Received",        V: DateShort(gblCurrentLC.ReceivedDate),      E: false },
                { L: "Issued",          V: DateShort(gblCurrentLC.IssuanceDate),      E: false },
                { L: "Latest shipment", V: DateShort(gblCurrentLC.LatestShipmentDate) & "  ·  " & DaysPhrase(gblCurrentLC.LatestShipmentDate), E: true },
                { L: "Expiry",          V: DateShort(gblCurrentLC.ExpiryDate) & "  ·  " & DaysPhrase(gblCurrentLC.ExpiryDate), E: true },
                { L: "Presentation period", V: Coalesce(Text(gblCurrentLC.PresentationPeriodDays), Text(CfgN("DefaultPresentationPeriodDays", 21))) & " days from shipment", E: false }
            )
        fieldRowD As cmpFieldRow:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth
            Height: =31
            FieldLabel: =ThisItem.L
            FieldValue: =ThisItem.V
            Emphasis: =ThisItem.E
            LabelWidth: =150

    cardOvOutstanding As cmpSectionCard:
        X: =ContentX
        Y: =cardOvFinancial.Y + cardOvFinancial.Height + ThemeSpace3
        Width: =ContentWidth
        Height: =Max(180, Parent.Height - Self.Y - ThemeSpace4)
        Visible: =gblWorkspaceTab = "Overview"
        HeaderText: ="Outstanding actions"
        SubText: ="Open tasks and correspondence awaiting a response on this LC"
        ActionLabel: ="New task"
        ShowAction: =IsOfficer
        OnAction: |
            =Set(gblTaskContext, { Entity: "LC", Id: gblLCId, Ref: gblCurrentLC.LCNumber });
            Set(gblWorkspaceTab, "Tasks")

    galOvActions As gallery:
        X: =cardOvOutstanding.X + 1
        Y: =cardOvOutstanding.Y + 64
        Width: =cardOvOutstanding.Width - 2
        Height: =cardOvOutstanding.Height - 70
        Visible: =cardOvOutstanding.Visible
        TemplateSize: =44
        TemplatePadding: =0
        DelayItemLoading: =true
        Items: =SortByColumns(Filter('09_Tasks', LCItemId = gblLCId, IsOpen = true), "DueDate", SortOrder.Ascending)

        lblTaskTitle As label:
            X: =ThemeSpace4
            Y: =4
            Width: =Parent.TemplateWidth * 0.45
            Height: =20
            Text: =ThisItem.Title
            Font: =ThemeFont
            Size: =ThemeSizeBody
            FontWeight: =FontWeight.Semibold
            Color: =ThemeText
            PaddingLeft: =0

        lblTaskMeta As label:
            X: =ThemeSpace4
            Y: =22
            Width: =Parent.TemplateWidth * 0.45
            Height: =16
            Text: =ThisItem.TaskCategory & " · " & Coalesce(ThisItem.AssignedTo.DisplayName, "unassigned")
            Font: =ThemeFont
            Size: =ThemeSizeMicro
            Color: =ThemeTextMuted
            PaddingLeft: =0

        lblTaskDue As label:
            X: =Parent.TemplateWidth * 0.5
            Y: =12
            Width: =200
            Height: =20
            Text: ="Due " & DateShort(ThisItem.DueDate) & " · " & DaysPhrase(ThisItem.DueDate)
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            FontWeight: =FontWeight.Semibold
            Color: =UrgencyColor(ThisItem.DueDate)
            PaddingLeft: =0

        badgeTask As cmpStatusBadge:
            X: =Parent.TemplateWidth - 130 - ThemeSpace4
            Y: =10
            Width: =130
            Height: =24
            Entity: ="Task"
            StatusCode: =ThisItem.TaskStatus
            BadgeWidth: =130

        recTaskRule As rectangle:
            X: =ThemeSpace4
            Y: =Parent.TemplateHeight - 1
            Width: =Parent.TemplateWidth - (ThemeSpace4 * 2)
            Height: =1
            Fill: =ThemeBorder

    emptyOvActions As cmpEmptyState:
        X: =cardOvOutstanding.X
        Y: =cardOvOutstanding.Y + 80
        Width: =cardOvOutstanding.Width
        Height: =120
        Visible: =cardOvOutstanding.Visible && IsEmpty(galOvActions.AllItems)
        Title: ="Nothing outstanding"
        Body: ="No open tasks on this LC."
        ActionLabel: =""

    # =========================================================================
    # TAB: LC DETAILS
    # The full record from section 9 of the brief, grouped into five blocks and
    # rendered from data. Sixty fields as sixty hand-placed labels would be
    # unmaintainable; as five galleries over cmpFieldRow it is one screen of YAML.
    # =========================================================================
    galDetailBlocks As gallery:
        X: =ContentX
        Y: =galTabs.Y + galTabs.Height + ThemeSpace3
        Width: =ContentWidth
        Height: =Parent.Height - Self.Y - ThemeSpace4
        Visible: =gblWorkspaceTab = "Details"
        Layout: =Layout.Vertical
        WrapCount: =If(IsMedium, 1, 2)
        TemplateSize: =300
        TemplatePadding: =0
        ShowScrollbar: =true
        DelayItemLoading: =false
        Items: |
            =Table(
                {
                    Block: "Identification",
                    Rows: Table(
                        { L: "Internal LC ID",      V: gblCurrentLC.Title },
                        { L: "LC number",           V: gblCurrentLC.LCNumber },
                        { L: "Our reference",       V: Coalesce(gblCurrentLC.OurReference, "") },
                        { L: "Customer",            V: gblCurrentLC.CustomerName },
                        { L: "Customer code",       V: Coalesce(gblCurrentLC.CustomerCode, "") },
                        { L: "Applicant",           V: Coalesce(gblCurrentLC.ApplicantName, "") },
                        { L: "Beneficiary",         V: Coalesce(gblCurrentLC.BeneficiaryName, "") },
                        { L: "Issuing bank",        V: Coalesce(gblCurrentLC.IssuingBankName, "") },
                        { L: "Advising bank",       V: Coalesce(gblCurrentLC.AdvisingBankName, "") },
                        { L: "Confirming bank",     V: Coalesce(gblCurrentLC.ConfirmingBankName, "") },
                        { L: "Reimbursing bank",    V: Coalesce(gblCurrentLC.ReimbursingBankName, "") },
                        { L: "Responsible officer", V: Coalesce(gblCurrentLC.ResponsibleOfficer.DisplayName, "") }
                    )
                },
                {
                    Block: "LC terms",
                    Rows: Table(
                        { L: "LC type",             V: Coalesce(gblCurrentLC.LCTypeCode, "") },
                        { L: "Irrevocable",         V: If(gblCurrentLC.IsIrrevocable, "Yes", "No") },
                        { L: "Transferable",        V: If(gblCurrentLC.IsTransferable, "Yes", "No") },
                        { L: "Revolving",           V: If(gblCurrentLC.IsRevolving, "Yes", "No") },
                        { L: "Confirmed",           V: If(gblCurrentLC.IsConfirmed, "Yes", "No") },
                        { L: "Available with",      V: Coalesce(gblCurrentLC.AvailableWith, "") },
                        { L: "Available by",        V: Coalesce(gblCurrentLC.AvailableBy, "") },
                        { L: "Drafts at",           V: Coalesce(gblCurrentLC.DraftsAt, "") },
                        { L: "Sight / deferred",    V: Coalesce(gblCurrentLC.SightOrDeferred, "") },
                        { L: "Tenor",               V: If(IsBlank(gblCurrentLC.TenorDays), "", gblCurrentLC.TenorDays & " days") },
                        { L: "Payment terms",       V: Coalesce(gblCurrentLC.PaymentTermText, "") },
                        { L: "Negotiation terms",   V: Coalesce(gblCurrentLC.NegotiationTerms, "") },
                        { L: "Partial shipments",   V: Coalesce(gblCurrentLC.PartialShipments, "") },
                        { L: "Transshipment",       V: Coalesce(gblCurrentLC.Transshipment, "") },
