        Title: ="No amendments"
        Body: ="This credit is still on its original terms."
        ActionLabel: =If(CanEditLC, "Record amendment", "")
        OnAction: |
            =Set(gblEditAmendment, Blank());
            Set(gblFormMode, "New");
            Navigate(scrAmendmentForm, ScreenTransition.CoverRight)

    # =========================================================================
    # TABS: INVOICES / SHIPMENTS / PRESENTATIONS / DISCREPANCIES / PROCEEDS /
    #       CORRESPONDENCE / TASKS
    #
    # These seven tabs share one grid. Rather than seven near-identical galleries,
    # a single definition table describes each tab's query, its columns and its
    # "add" action, and one gallery renders whichever is active. Adding a column to
    # the invoice grid is a one-line change here, not a re-layout.
    #
    # Each Items expression is a delegable Filter on LCItemId, which is indexed on
    # every child list.
    # =========================================================================
    btnAddChild As button:
        X: =ContentX + ContentWidth - 170
        Y: =galTabs.Y + galTabs.Height + ThemeSpace3
        Width: =170
        Height: =32
        Text: |
            =Switch(
                gblWorkspaceTab,
                "Invoices", "Add invoice", "Shipments", "Add shipment",
                "Presentations", "New presentation", "Discrepancies", "Record discrepancy",
                "Proceeds", "Record proceeds", "Correspondence", "Log correspondence",
                "Tasks", "New task", ""
            )
        Visible: |
            =IsOfficer && gblWorkspaceTab in
                ["Invoices", "Shipments", "Presentations", "Discrepancies", "Proceeds", "Correspondence", "Tasks"]
        Fill: =ThemeAccent
        HoverFill: =ThemeAccentHover
        Color: =ThemeTextInverse
        BorderThickness: =0
        Font: =ThemeFont
        Size: =ThemeSizeBody
        FontWeight: =FontWeight.Semibold
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        OnSelect: |
            =Set(gblChildContext, { LCItemId: gblLCId, LCNumber: gblCurrentLC.LCNumber, InternalLCID: gblCurrentLC.Title, CustomerName: gblCurrentLC.CustomerName, CurrencyCode: gblCurrentLC.CurrencyCode });
            Set(gblFormMode, "New");
            Set(gblEditChild, Blank());
            Switch(
                gblWorkspaceTab,
                "Invoices",       Navigate(scrInvoiceForm, ScreenTransition.CoverRight),
                "Shipments",      Navigate(scrShipmentForm, ScreenTransition.CoverRight),
                "Presentations",  Navigate(scrPresentationForm, ScreenTransition.CoverRight),
                "Discrepancies",  Navigate(scrDiscrepancyForm, ScreenTransition.CoverRight),
                "Proceeds",       Navigate(scrProceedsForm, ScreenTransition.CoverRight),
                "Correspondence", Navigate(scrCorrespondenceForm, ScreenTransition.CoverRight),
                "Tasks",          Navigate(scrTaskForm, ScreenTransition.CoverRight)
            )

    galChildRecords As gallery:
        X: =ContentX
        Y: =btnAddChild.Y + 40
        Width: =ContentWidth
        Height: =Parent.Height - Self.Y - ThemeSpace4
        Visible: |
            =gblWorkspaceTab in
                ["Invoices", "Shipments", "Presentations", "Discrepancies", "Proceeds", "Correspondence", "Tasks"]
        TemplateSize: =52
        TemplatePadding: =0
        ShowScrollbar: =true
        DelayItemLoading: =true
        LoadingSpinner: =LoadingSpinner.Data
        # Each branch is its own delegable query. They are shaped into a common
        # {C1..C5, Status, Entity, Flag} record so one row template renders them all.
        Items: |
            =Switch(
                gblWorkspaceTab,
                "Invoices",
                    AddColumns(
                        SortByColumns(Filter('03_Invoices', LCItemId = gblLCId), "InvoiceDate", SortOrder.Descending),
                        "C1", Title,
                        "C2", DateShort(InvoiceDate),
                        "C3", Money(InvoiceAmount, CurrencyCode),
                        "C4", Money(OutstandingAmount, CurrencyCode),
                        "C5", "Due " & DateShort(DueDate),
                        "St", InvoiceStatus,
                        "En", "Invoice",
                        "Fl", !IsBlank(DueDate) && DateDiff(Today0, DueDate, Days) < 0 && !IsSettled
                    ),
                "Shipments",
                    AddColumns(
                        SortByColumns(Filter('04_Shipments', LCItemId = gblLCId), "LatestShipmentDate", SortOrder.Ascending),
                        "C1", Title,
                        "C2", Coalesce(TransportDocNumber, "-"),
                        "C3", Money(ShipmentValue, CurrencyCode),
                        "C4", "Latest " & DateShort(LatestShipmentDate),
                        "C5", If(IsBlank(ActualShipmentDate), DaysPhrase(LatestShipmentDate), "Shipped " & DateShort(ActualShipmentDate)),
                        "St", ShipmentStatus,
                        "En", "Shipment",
                        "Fl", !IsShipped && !IsBlank(LatestShipmentDate) && DateDiff(Today0, LatestShipmentDate, Days) < 7
                    ),
                "Presentations",
                    AddColumns(
                        SortByColumns(Filter('05_Presentations', LCItemId = gblLCId), "PresentationDate", SortOrder.Descending),
                        "C1", Title,
                        "C2", DateShort(PresentationDate),
                        "C3", Money(AmountPresented, CurrencyCode),
                        "C4", ExaminationStatus,
                        "C5", If(OpenDiscrepancyCount > 0, OpenDiscrepancyCount & " open discrepancies", "Maturity " & DateShort(MaturityDate)),
                        "St", PresentationStatus,
                        "En", "Presentation",
                        "Fl", OpenDiscrepancyCount > 0
                    ),
                "Discrepancies",
                    AddColumns(
                        SortByColumns(Filter('06_Discrepancies', LCItemId = gblLCId), "DetectedDate", SortOrder.Descending),
                        "C1", Title,
                        "C2", Coalesce(CategoryName, CategoryCode),
                        "C3", Severity,
                        "C4", "Detected " & DateShort(DetectedDate),
                        "C5", If(WaiverRequired && !WaiverReceived, "Waiver outstanding", Coalesce(ResolutionType, "")),
                        "St", DiscrepancyStatus,
                        "En", "Discrepancy",
                        "Fl", IsOpen
                    ),
                "Proceeds",
                    AddColumns(
                        SortByColumns(Filter('07_Proceeds', LCItemId = gblLCId), "MaturityDate", SortOrder.Ascending),
                        "C1", Title,
                        "C2", Money(AmountAccepted, CurrencyCode),
                        "C3", Money(AmountPaid, CurrencyCode),
                        "C4", Money(OutstandingProceeds, CurrencyCode),
                        "C5", "Matures " & DateShort(MaturityDate),
                        "St", ProceedsStatus,
                        "En", "Proceeds",
                        "Fl", !IsSettled && !IsBlank(MaturityDate) && DateDiff(Today0, MaturityDate, Days) < 0
                    ),
                "Correspondence",
                    AddColumns(
                        SortByColumns(Filter('08_Correspondence', LCItemId = gblLCId), "CorrespondenceDate", SortOrder.Descending),
                        "C1", Title,
                        "C2", Direction & " · " & Coalesce(BankName, "-"),
                        "C3", CorrespondenceType,
                        "C4", DateShort(CorrespondenceDate),
                        "C5", If(ActionRequired, "Action due " & DateShort(DueDate), ""),
                        "St", CorrespondenceStatus,
                        "En", "Correspondence",
                        "Fl", ActionRequired && IsOpen
                    ),
                "Tasks",
                    AddColumns(
                        SortByColumns(Filter('09_Tasks', LCItemId = gblLCId), "DueDate", SortOrder.Ascending),
                        "C1", Title,
                        "C2", TaskCategory,
                        "C3", Coalesce(AssignedTo.DisplayName, "unassigned"),
                        "C4", Priority,
                        "C5", "Due " & DateShort(DueDate) & " · " & DaysPhrase(DueDate),
                        "St", TaskStatus,
                        "En", "Task",
                        "Fl", IsOpen && !IsBlank(DueDate) && DateDiff(Today0, DueDate, Days) < 0
                    ),
                Blank()
            )
        OnSelect: |
            =Set(gblEditChild, ThisItem);
            Set(gblFormMode, "Edit");
            Set(gblChildContext, { LCItemId: gblLCId, LCNumber: gblCurrentLC.LCNumber, InternalLCID: gblCurrentLC.Title, CustomerName: gblCurrentLC.CustomerName, CurrencyCode: gblCurrentLC.CurrencyCode });
            Switch(
                gblWorkspaceTab,
                "Invoices",       Navigate(scrInvoiceForm, ScreenTransition.CoverRight),
                "Shipments",      Navigate(scrShipmentForm, ScreenTransition.CoverRight),
                "Presentations",  Navigate(scrPresentationForm, ScreenTransition.CoverRight),
                "Discrepancies",  Navigate(scrDiscrepancyForm, ScreenTransition.CoverRight),
                "Proceeds",       Navigate(scrProceedsForm, ScreenTransition.CoverRight),
                "Correspondence", Navigate(scrCorrespondenceForm, ScreenTransition.CoverRight),
                "Tasks",          Navigate(scrTaskForm, ScreenTransition.CoverRight)
            )

