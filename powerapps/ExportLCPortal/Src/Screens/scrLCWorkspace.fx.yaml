            Size: =ThemeSizeBody
            Color: =ThemeText
            VerticalAlign: =VerticalAlign.Middle
            PaddingLeft: =0

        lblC4 As label:
            X: =Parent.TemplateWidth * 0.53
            Y: =0
            Width: =Parent.TemplateWidth * 0.14
            Height: =Parent.TemplateHeight
            Text: =ThisItem.C4
            Font: =ThemeFont
            Size: =ThemeSizeBody
            FontWeight: =FontWeight.Semibold
            Color: =ThemeText
            VerticalAlign: =VerticalAlign.Middle
            PaddingLeft: =0

        lblC5 As label:
            X: =Parent.TemplateWidth * 0.67
            Y: =0
            Width: =Parent.TemplateWidth * 0.18
            Height: =Parent.TemplateHeight
            Text: =ThisItem.C5
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            Color: =If(ThisItem.Fl, ThemeDanger, ThemeTextSecondary)
            VerticalAlign: =VerticalAlign.Middle
            PaddingLeft: =0

        badgeChild As cmpStatusBadge:
            X: =Parent.TemplateWidth - 150 - ThemeSpace4
            Y: =14
            Width: =150
            Height: =24
            Entity: =ThisItem.En
            StatusCode: =ThisItem.St
            BadgeWidth: =150

    emptyChild As cmpEmptyState:
        X: =ContentX
        Y: =galChildRecords.Y + 30
        Width: =ContentWidth
        Height: =160
        Visible: =galChildRecords.Visible && IsEmpty(galChildRecords.AllItems)
        Title: ="No " & Lower(gblWorkspaceTab) & " yet"
        Body: ="Nothing has been recorded against this LC on this tab."
        ActionLabel: =If(IsOfficer, btnAddChild.Text, "")
        OnAction: =Select(btnAddChild)

    # =========================================================================
    # TAB: DOCUMENTS
    # The configurable checklist from 20_LCDocumentChecklist (materialised from
    # 19_DocChecklistTemplates when the LC was registered), plus the files held
    # against this LC. Nothing about which documents are required is coded here.
    # =========================================================================
    lblChecklistHeader As label:
        X: =ContentX
        Y: =galTabs.Y + galTabs.Height + ThemeSpace3
        Width: =ContentWidth - 360
        Height: =32
        Text: |
            ="Document checklist  ·  " &
             CountRows(Filter(colChecklist, ChecklistStatus = "Complete")) & " of " &
             CountRows(Filter(colChecklist, IsRequired)) & " required documents complete"
        Visible: =gblWorkspaceTab = "Documents"
        Font: =ThemeFont
        Size: =ThemeSizeHeading
        FontWeight: =FontWeight.Semibold
        Color: =ThemeText
        VerticalAlign: =VerticalAlign.Middle
        PaddingLeft: =0

    btnUploadDoc As button:
        X: =ContentX + ContentWidth - 170
        Y: =lblChecklistHeader.Y
        Width: =170
        Height: =32
        Text: ="Upload document"
        Visible: =gblWorkspaceTab = "Documents" && IsOfficer
        Fill: =ThemeAccent
        HoverFill: =ThemeAccentHover
        Color: =ThemeTextInverse
        BorderThickness: =0
        Font: =ThemeFont
        Size: =ThemeSizeBody
        FontWeight: =FontWeight.Semibold
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        OnSelect: |
            =Set(gblUploadContext, { LCItemId: gblLCId, LCNumber: gblCurrentLC.LCNumber, InternalLCID: gblCurrentLC.Title });
            Navigate(scrDocumentUpload, ScreenTransition.CoverRight)

    galChecklist As gallery:
        X: =ContentX
        Y: =lblChecklistHeader.Y + 40
        Width: =ContentWidth
        Height: =Parent.Height - Self.Y - ThemeSpace4
        Visible: =gblWorkspaceTab = "Documents"
        TemplateSize: =46
        TemplatePadding: =0
        DelayItemLoading: =false
        # Required-and-missing first: the checklist should open on the problem.
        Items: |
            =SortByColumns(
                AddColumns(
                    colChecklist,
                    "Rank",
                    If(ChecklistStatus = "Missing" && IsRequired, 1,
                       ChecklistStatus = "Pending Review", 2,
                       ChecklistStatus = "Missing", 3, 4)
                ),
                "Rank", SortOrder.Ascending,
                "SortOrder", SortOrder.Ascending
            )

        recClBg As rectangle:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth
            Height: =Parent.TemplateHeight - 1
            Fill: =ThemeSurface

        recClRule As rectangle:
            X: =0
            Y: =Parent.TemplateHeight - 1
            Width: =Parent.TemplateWidth
            Height: =1
            Fill: =ThemeBorder

        icoClState As icon:
            Icon: |
                =Switch(
                    ThisItem.ChecklistStatus,
                    "Complete", Icon.CheckBadge,
                    "Pending Review", Icon.Clock,
                    "Waived", Icon.Hide,
                    "Not Applicable", Icon.Remove,
                    Icon.CancelBadge
                )
            X: =ThemeSpace4
            Y: =14
            Width: =18
            Height: =18
            Color: |
                =Switch(
                    ThisItem.ChecklistStatus,
                    "Complete", ThemeSuccess,
                    "Pending Review", ThemeWarning,
                    "Waived", ThemeMuted,
                    "Not Applicable", ThemeMuted,
                    If(ThisItem.IsRequired, ThemeDanger, ThemeTextMuted)
                )

        lblClName As label:
            X: =ThemeSpace4 + 28
            Y: =0
            Width: =Parent.TemplateWidth * 0.30
            Height: =Parent.TemplateHeight
            Text: =ThisItem.DocumentTypeName
            Font: =ThemeFont
            Size: =ThemeSizeBody
            FontWeight: |
                =If(ThisItem.IsRequired, FontWeight.Semibold, FontWeight.Normal)
            Color: =ThemeText
            VerticalAlign: =VerticalAlign.Middle
            PaddingLeft: =0

        lblClRequired As label:
            X: =Parent.TemplateWidth * 0.36
            Y: =0
            Width: =90
            Height: =Parent.TemplateHeight
            Text: =If(ThisItem.IsRequired, "Required", "Optional")
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            Color: =If(ThisItem.IsRequired, ThemeText, ThemeTextMuted)
            VerticalAlign: =VerticalAlign.Middle
            PaddingLeft: =0

        lblClCopies As label:
            X: =Parent.TemplateWidth * 0.44
            Y: =0
            Width: =160
            Height: =Parent.TemplateHeight
            Text: |
                =ThisItem.OriginalsReceived & "/" & ThisItem.OriginalsRequired & " originals · " &
                 ThisItem.CopiesReceived & "/" & ThisItem.CopiesRequired & " copies"
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            Color: =ThemeTextSecondary
            VerticalAlign: =VerticalAlign.Middle
            PaddingLeft: =0

        chkReceived As checkbox:
            X: =Parent.TemplateWidth * 0.60
            Y: =13
            Width: =110
            Height: =20
            Text: ="Received"
            Default: =ThisItem.IsReceived
            DisplayMode: =If(IsOfficer, DisplayMode.Edit, DisplayMode.View)
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            Color: =ThemeTextSecondary
            # Status is derived from the two checkboxes rather than set by hand, so the
            # checklist cannot end up saying "Complete" with nothing received.
            OnCheck: |
                =Patch(
                    '20_LCDocumentChecklist',
                    LookUp('20_LCDocumentChecklist', ID = ThisItem.ID),
                    {
                        IsReceived: true,
                        ReceivedDate: Today0,
                        ChecklistStatus: If(ThisItem.IsReviewed, "Complete", "Pending Review")
                    }
                );
                ClearCollect(colChecklist, ChecklistFor(gblLCId));
                Select(btnRecountDocs)
            OnUncheck: |
                =Patch(
                    '20_LCDocumentChecklist',
                    LookUp('20_LCDocumentChecklist', ID = ThisItem.ID),
                    { IsReceived: false, ReceivedDate: Blank(), ChecklistStatus: "Missing" }
                );
                ClearCollect(colChecklist, ChecklistFor(gblLCId));
                Select(btnRecountDocs)

        chkReviewed As checkbox:
            X: =Parent.TemplateWidth * 0.70
            Y: =13
            Width: =110
            Height: =20
            Text: ="Reviewed"
            Default: =ThisItem.IsReviewed
            DisplayMode: =If(CanReviewDocuments && ThisItem.IsReceived, DisplayMode.Edit, DisplayMode.Disabled)
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            Color: =ThemeTextSecondary
            OnCheck: |
                =Patch(
                    '20_LCDocumentChecklist',
                    LookUp('20_LCDocumentChecklist', ID = ThisItem.ID),
                    { IsReviewed: true, ReviewedBy: User(), ReviewedDate: Today0, ChecklistStatus: "Complete" }
                );
                ClearCollect(colChecklist, ChecklistFor(gblLCId));
                Select(btnRecountDocs)
            OnUncheck: |
                =Patch(
                    '20_LCDocumentChecklist',
                    LookUp('20_LCDocumentChecklist', ID = ThisItem.ID),
                    { IsReviewed: false, ReviewedBy: Blank(), ReviewedDate: Blank(), ChecklistStatus: "Pending Review" }
                );
                ClearCollect(colChecklist, ChecklistFor(gblLCId));
                Select(btnRecountDocs)

        badgeCl As cmpStatusBadge:
            X: =Parent.TemplateWidth - 150 - ThemeSpace4
            Y: =11
            Width: =150
            Height: =24
            Entity: ="Document"
            StatusCode: |
                =Switch(
                    ThisItem.ChecklistStatus,
                    "Complete", "Accepted", "Pending Review", "Under Review",
                    "Waived", "Superseded", "Not Applicable", "Superseded", "Received"
                )
            BadgeWidth: =150

    # Recomputes the LC's stored missing-document counter after any checklist change.
    # Hidden control rather than repeated inline: one definition, called from three places.
    btnRecountDocs As button:
        X: =-100
        Y: =-100
        Width: =1
        Height: =1
        Visible: =false
        Text: =""
        OnSelect: |
            =With(
                { missing: CountRows(Filter(colChecklist, IsRequired = true, IsReceived = false)) },
                Patch(
                    '01_ExportLCs',
                    LookUp('01_ExportLCs', ID = gblLCId),
                    {
                        MissingDocumentCount: missing,
                        RequiresAction: missing > 0 || gblCurrentLC.OpenDiscrepancyCount > 0 ||
                                        gblCurrentLC.LCStatus in ["Received", "Under Review", "Discrepancy"],
                        LastActivityDate: Now()
                    }
                )
            );
            Set(gblCurrentLC, LookUp('01_ExportLCs', ID = gblLCId))

    # =========================================================================
    # TAB: AUDIT
    # Partition-filtered so it stays an indexed query as history grows. Critical-field
    # changes are highlighted, because that is what an auditor actually asks for.
    # =========================================================================
    galAudit As gallery:
        X: =ContentX
        Y: =galTabs.Y + galTabs.Height + ThemeSpace3
        Width: =ContentWidth
        Height: =Parent.Height - Self.Y - ThemeSpace4
        Visible: =gblWorkspaceTab = "Audit"
        TemplateSize: =52
        TemplatePadding: =0
        DelayItemLoading: =true
        Items: |
            =SortByColumns(
                Filter(
                    '10_AuditLog',
                    InternalLCID = gblLCInternalId,
                    PartitionKey >= Text(DateAdd(Today0, -12, Months), "yyyy-mm")
                ),
                "ActionTimestamp", SortOrder.Descending
            )

        recAudBg As rectangle:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth
            Height: =Parent.TemplateHeight - 1
            Fill: =If(ThisItem.IsCriticalField, ThemeWarningSoft, ThemeSurface)

        recAudRule As rectangle:
            X: =0
            Y: =Parent.TemplateHeight - 1
            Width: =Parent.TemplateWidth
            Height: =1
            Fill: =ThemeBorder

        lblAudWhen As label:
            X: =ThemeSpace4
            Y: =0
            Width: =140
            Height: =Parent.TemplateHeight
            Text: =Text(ThisItem.ActionTimestamp, "dd mmm yyyy HH:mm")
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            Color: =ThemeTextSecondary
            VerticalAlign: =VerticalAlign.Middle
            PaddingLeft: =0

        lblAudWho As label:
            X: =160
            Y: =0
            Width: =180
            Height: =Parent.TemplateHeight
            Text: =ThisItem.ActionByName
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            Color: =ThemeText
            VerticalAlign: =VerticalAlign.Middle
            PaddingLeft: =0

        lblAudAction As label:
            X: =350
            Y: =0
            Width: =160
            Height: =Parent.TemplateHeight
            Text: =ThisItem.ActionType
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            FontWeight: =FontWeight.Semibold
            Color: =ThemeText
            VerticalAlign: =VerticalAlign.Middle
            PaddingLeft: =0

        lblAudField As label:
            X: =520
            Y: =0
            Width: =180
            Height: =Parent.TemplateHeight
            Text: =Coalesce(ThisItem.FieldName, "-")
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            Color: =ThemeTextSecondary
            VerticalAlign: =VerticalAlign.Middle
            PaddingLeft: =0

        lblAudChange As label:
            X: =710
            Y: =0
            Width: =Parent.TemplateWidth - 710 - ThemeSpace4
            Height: =Parent.TemplateHeight
            Text: |
                =If(
                    Len(Coalesce(ThisItem.OldValue, "")) + Len(Coalesce(ThisItem.NewValue, "")) = 0,
                    Coalesce(ThisItem.ActionComment, ""),
                    Coalesce(ThisItem.OldValue, "(blank)") & "   to   " & Coalesce(ThisItem.NewValue, "(blank)")
                )
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            Color: =ThemeText
            VerticalAlign: =VerticalAlign.Middle
            PaddingLeft: =0

    emptyAudit As cmpEmptyState:
        X: =ContentX
        Y: =galAudit.Y + 30
        Width: =ContentWidth
        Height: =160
        Visible: =gblWorkspaceTab = "Audit" && IsEmpty(galAudit.AllItems)
        Title: ="No audit entries in the last 12 months"
        Body: ="Older history is available in 10_AuditLog by partition, or from the admin archive."
        ActionLabel: =""
