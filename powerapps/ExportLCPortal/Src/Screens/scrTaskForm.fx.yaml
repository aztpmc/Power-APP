# =============================================================================
# scrTaskForm - task form
# =============================================================================
# Create or update a task against any record in the portal.
#
# Shared mechanics with every other record form in the portal:
#   * A working copy (gblDraft) is edited, never the datasource directly, so validation
#     can see the whole prospective record before anything is written.
#   * Validation is one expression producing a list of messages; Save is disabled while
#     that list is non-empty.
#   * A status change is checked against 16_StatusMaster before it is allowed.
#   * Derived values are computed on save, not typed.
#   * One audit row per changed critical field, sharing one correlation id.
# =============================================================================

scrTaskForm As screen:
    Fill: =ThemeCanvas
    OnVisible: |
        =Set(gblCorrelation, GUID());
        // The parent LC is needed for validation (tolerance, expiry, utilisation) and for
        // the denormalised keys written on save.
        Set(
            gblParentLC,
            Coalesce(
                LookUp('01_ExportLCs', ID = Coalesce(gblChildContext.LCItemId, gblEditChild.LCItemId, -1)),
                gblCurrentLC
            )
        );
        Set(gblOriginal, gblEditChild);
        Set(
            gblDraft,
            If(
                gblFormMode = "New",
                {
                    Title: "",
                    TaskDescription: "",
                    TaskCategory: "Document Collection",
                    RelatedEntity: "LC",
                    RelatedEntityRef: "",
                    AssignedToEmail: "",
                    Priority: "Low",
                    StartDate: Blank(),
                    DueDate: Blank(),
                    TaskStatus: "Not Started",
                    TaskNotes: ""
                },
                gblEditChild
            )
        );
        Set(gblShowErrors, false)

    lblValidationSource As label:
        X: =-1000
        Y: =-1000
        Width: =1
        Height: =1
        Visible: =false
        Text: |
            =Concat(
                Filter(
                    Table(
                        { M: "Task description is required.",
                          F: Len(Trim(Coalesce(gblDraft.Title, ""))) = 0 },
                        { M: "Due date is required - a task with no due date will never appear in an overdue list.",
                          F: IsBlank(gblDraft.DueDate) },
                        { M: "Assign the task to someone.",
                          F: Len(Trim(Coalesce(gblDraft.AssignedToEmail, ""))) = 0 },
                        { M: "Due date cannot be before the start date.",
                          F: !IsBlank(gblDraft.StartDate) && !IsBlank(gblDraft.DueDate) && gblDraft.DueDate < gblDraft.StartDate },
                        { M: "A completed task must record who completed it and when.",
                          F: gblDraft.TaskStatus = "Completed" && IsBlank(gblOriginal.CompletedDate) && gblFormMode = "Edit" && gblOriginal.TaskStatus = "Completed" },
                        { M: TransitionBlockReason("Task", Coalesce(gblOriginal.TaskStatus, "Not Started"), gblDraft.TaskStatus),
                          F: gblFormMode = "Edit" && !CanTransition("Task", Coalesce(gblOriginal.TaskStatus, "Not Started"), gblDraft.TaskStatus) }
                    ),
                    F
                ),
                M,
                Char(10)
            )

    topBar As cmpTopBar:
        X: =ThemeSpace5
        Y: =0
        Width: =Parent.Width - (ThemeSpace5 * 2)
        Height: =ThemeTopBarHeight
        TitleText: |
            =If(gblFormMode = "New", "New task", "Edit " & Coalesce(gblDraft.Title, "task"))
        Breadcrumb: |
            =Coalesce(gblParentLC.LCNumber, "No LC selected") & "  /  task"
        ShowSearch: =false
        ShowBack: =true
        OnBack: =Back()
        ShowPrimary: =false

    # Creating from a module register rather than from an LC workspace: pick the parent
    # first. Without it the record cannot be linked, and an unlinked child record is the
    # one thing this data model must never contain.
    cboParentLC As combobox:
        X: =ThemeSpace5
        Y: =ThemeTopBarHeight + ThemeSpace2
        Width: =400
        Height: =34
        Visible: =IsBlank(gblChildContext) || IsBlank(gblChildContext.LCItemId)
        Items: =SortByColumns(Filter('01_ExportLCs', IsClosed = false), "LCNumber", SortOrder.Ascending)
        DisplayFields: =["LCNumber"]
        SearchFields: =["LCNumber", "CustomerName", "OurReference"]
        IsSearchable: =true
        SelectMultiple: =false
        InputTextPlaceholder: ="Select the LC this task belongs to"
        Font: =ThemeFont
        Size: =ThemeSizeBody
        OnChange: |
            =Set(gblParentLC, Self.Selected);
            Set(
                gblChildContext,
                {
                    LCItemId: Self.Selected.ID,
                    LCNumber: Self.Selected.LCNumber,
                    InternalLCID: Self.Selected.Title,
                    CustomerName: Self.Selected.CustomerName,
                    CurrencyCode: Self.Selected.CurrencyCode
                }
            )

    recErrors As rectangle:
        X: =ThemeSpace5
        Y: =If(cboParentLC.Visible, cboParentLC.Y + 42, ThemeTopBarHeight + ThemeSpace3)
        Width: =Parent.Width - (ThemeSpace5 * 2)
        Height: =lblErrors.Height + ThemeSpace4
        Fill: =ThemeDangerSoft
        BorderColor: =ThemeDanger
        BorderThickness: =1
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        Visible: =gblShowErrors && Len(lblValidationSource.Text) > 0

    lblErrors As label:
        X: =recErrors.X + ThemeSpace4
        Y: =recErrors.Y + ThemeSpace2
        Width: =recErrors.Width - (ThemeSpace4 * 2)
        Height: |
            =(CountRows(Split(lblValidationSource.Text, Char(10))) * 20) + 8
        Text: =lblValidationSource.Text
        Font: =ThemeFont
        Size: =ThemeSizeBody
        Color: =ThemeDanger
        Visible: =recErrors.Visible
        PaddingLeft: =0

    galForm As gallery:
        X: =ThemeSpace5
        Y: |
            =If(recErrors.Visible, recErrors.Y + recErrors.Height + ThemeSpace3,
                If(cboParentLC.Visible, cboParentLC.Y + 42, ThemeTopBarHeight + ThemeSpace3))
        Width: =Parent.Width - (ThemeSpace5 * 2)
        Height: =Parent.Height - Self.Y - 72
        TemplateSize: =64
        TemplatePadding: =0
        ShowScrollbar: =true
        DelayItemLoading: =false
        WrapCount: =If(IsCompact, 1, 3)
        Items: |
            =Table(
                { K: "Title", L: "Task *", T: "text", O: "" },
                { K: "TaskDescription", L: "Description", T: "text", O: "" },
                { K: "TaskCategory", L: "Category", T: "choice", O: "Document Collection,Document Review,Presentation,Bank Follow-up,Customer Follow-up,Amendment,Discrepancy Resolution,Collection,Approval,Data Correction,Other" },
                { K: "RelatedEntity", L: "Related to", T: "choice", O: "LC,Amendment,Invoice,Shipment,Presentation,Discrepancy,Proceeds,Correspondence,Document" },
                { K: "RelatedEntityRef", L: "Related reference", T: "text", O: "" },
                { K: "AssignedToEmail", L: "Assign to *", T: "lookup", O: "user" },
                { K: "Priority", L: "Priority", T: "choice", O: "Low,Normal,High,Critical" },
                { K: "StartDate", L: "Start date", T: "date", O: "" },
                { K: "DueDate", L: "Due date *", T: "date", O: "" },
                { K: "TaskStatus", L: "Status", T: "status", O: "" },
                { K: "TaskNotes", L: "Notes", T: "text", O: "" }
            )

        lblFieldLabel As label:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =18
            Text: =ThisItem.L
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            Color: =ThemeTextSecondary
            PaddingLeft: =0

        txtField As text:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T in ["text", "number"]
            Format: =If(ThisItem.T = "number", TextFormat.Number, TextFormat.Text)
            Font: =ThemeFont
            Size: =ThemeSizeBody
            BorderColor: =ThemeBorderStrong
            FocusedBorderColor: =ThemeAccent
            BorderThickness: =1
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            Default: |
                =Switch(
                    ThisItem.K,
                    "Title", Coalesce(gblDraft.Title, ""),
                    "TaskDescription", Coalesce(gblDraft.TaskDescription, ""),
                    "RelatedEntityRef", Coalesce(gblDraft.RelatedEntityRef, ""),
                    "TaskNotes", Coalesce(gblDraft.TaskNotes, ""),
                    ""
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "Title", Patch(gblDraft, { Title: Trim(Self.Value) }),
                        "TaskDescription", Patch(gblDraft, { TaskDescription: Trim(Self.Value) }),
                        "RelatedEntityRef", Patch(gblDraft, { RelatedEntityRef: Trim(Self.Value) }),
                        "TaskNotes", Patch(gblDraft, { TaskNotes: Trim(Self.Value) }),
                        gblDraft
                    )
                )

        dpField As datepicker:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "date"
            Font: =ThemeFont
            Size: =ThemeSizeBody
            DefaultDate: |
                =Switch(
                    ThisItem.K,
                    "StartDate", gblDraft.StartDate,
                    "DueDate", gblDraft.DueDate,
                    Blank()
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "StartDate", Patch(gblDraft, { StartDate: Self.SelectedDate }),
                        "DueDate", Patch(gblDraft, { DueDate: Self.SelectedDate }),
                        gblDraft
                    )
                )

        tglField As toggle:
            X: =0
            Y: =20
            Width: =80
            Height: =28
            Visible: =ThisItem.T = "boolean"
            Default: =false

        drpChoice As dropdown:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "choice"
            Font: =ThemeFont
            Size: =ThemeSizeBody
            Items: =Split(ThisItem.O, ",")
            Default: |
                =Switch(
                    ThisItem.K,
                    "TaskCategory", Coalesce(gblDraft.TaskCategory, ""),
                    "RelatedEntity", Coalesce(gblDraft.RelatedEntity, ""),
                    "Priority", Coalesce(gblDraft.Priority, ""),
                    ""
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "TaskCategory", Patch(gblDraft, { TaskCategory: Self.Selected.Value }),
                        "RelatedEntity", Patch(gblDraft, { RelatedEntity: Self.Selected.Value }),
                        "Priority", Patch(gblDraft, { Priority: Self.Selected.Value }),
                        gblDraft
                    )
                )

        # The status picker offers only the transitions 16_StatusMaster permits from the
        # current status, so an illegal move is not presented in the first place - the
        # validation rule behind it is the backstop, not the only control.
        drpStatus As dropdown:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "status"
            Font: =ThemeFont
            Size: =ThemeSizeBody
            Items: |
                =If(
                    gblFormMode = "New",
                    SortByColumns(Filter(colStatus, EntityName = "Task"), "SortOrder", SortOrder.Ascending),
                    Filter(
                        SortByColumns(Filter(colStatus, EntityName = "Task"), "SortOrder", SortOrder.Ascending),
                        CanTransition("Task", Coalesce(gblOriginal.TaskStatus, "Not Started"), StatusCode)
                    )
                )
            Default: =gblDraft.TaskStatus
            OnChange: |
                =Set(gblDraft, Patch(gblDraft, { TaskStatus: Self.Selected.StatusCode }))

        cboLookup As combobox:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "lookup"
            IsSearchable: =true
            SelectMultiple: =false
            Font: =ThemeFont
            Size: =ThemeSizeBody
            DisplayFields: =["Title"]
            SearchFields: =["Title"]
            Items: |
                =Switch(
                    ThisItem.O,
                    "currency",     colCurrencies,
                    "incoterm",     colIncoterms,
                    "doctype",      colDocTypes,
                    "disccategory", colDiscCategories,
                    "bank",         SortByColumns(Filter('12_Banks', IsActive = true), "Title", SortOrder.Ascending),
                    "advisingbank", SortByColumns(Filter('12_Banks', IsActive = true, CanAdvise = true), "Title", SortOrder.Ascending),
                    "port",         SortByColumns(Filter('22_Ports', IsActive = true), "Title", SortOrder.Ascending),
                    "user",         SortByColumns(Filter('17_Users', IsActive = true), "Title", SortOrder.Ascending),
                    Blank()
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "AssignedToEmail", Patch(gblDraft, { AssignedToEmail: Coalesce(Self.Selected.Title, Self.Selected.UserEmail, "") }),
                        gblDraft
                    )
                )

    recActionBar As rectangle:
        X: =0
        Y: =Parent.Height - 64
        Width: =Parent.Width
        Height: =64
        Fill: =ThemeSurface
        BorderColor: =ThemeBorder
        BorderThickness: =1

    lblSaveHint As label:
        X: =ThemeSpace5
        Y: =Parent.Height - 64
        Width: =Parent.Width - 400
        Height: =64
        Text: |
            =If(
                IsBlank(gblChildContext) || IsBlank(gblChildContext.LCItemId),
                "Select the LC this task belongs to before saving.",
                If(
                    Len(lblValidationSource.Text) > 0,
                    CountRows(Split(lblValidationSource.Text, Char(10))) & " issue(s) to resolve before saving.",
                    "Ready to save."
                )
            )
        Font: =ThemeFont
        Size: =ThemeSizeSmall
        Color: =If(Len(lblValidationSource.Text) > 0, ThemeDanger, ThemeTextMuted)
        VerticalAlign: =VerticalAlign.Middle
        PaddingLeft: =0

    btnCancel As button:
        X: =Parent.Width - 280
        Y: =Parent.Height - 48
        Width: =120
        Height: =34
        Text: ="Cancel"
        Fill: =ThemeSurface
        HoverFill: =ThemeSurfaceHover
        Color: =ThemeTextSecondary
        BorderColor: =ThemeBorderStrong
        BorderThickness: =1
        Font: =ThemeFont
        Size: =ThemeSizeBody
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        OnSelect: =Back()

    btnSave As button:
        X: =Parent.Width - 150
        Y: =Parent.Height - 48
        Width: =150 - ThemeSpace5
        Height: =34
        Text: ="Save"
        Fill: =ThemeAccent
        HoverFill: =ThemeAccentHover
        DisabledFill: =ThemeMutedSoft
        Color: =ThemeTextInverse
        DisabledColor: =ThemeTextMuted
        BorderThickness: =0
        Font: =ThemeFont
        Size: =ThemeSizeBody
        FontWeight: =FontWeight.Semibold
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        DisplayMode: |
            =If(
                Len(lblValidationSource.Text) > 0 || !IsOfficer ||
                IsBlank(gblChildContext) || IsBlank(gblChildContext.LCItemId),
                DisplayMode.Disabled,
                DisplayMode.Edit
            )
        OnSelect: |
            =Set(gblShowErrors, true);
            If(
                Len(lblValidationSource.Text) > 0,
                Notify("Resolve the listed issues before saving.", NotificationType.Error, 4000),
                (
                    Set(gblCorrelation, GUID());
                    Set(
                        gblSaved,
                        Patch(
                            '09_Tasks',
                            If(gblFormMode = "New", Defaults('09_Tasks'), gblOriginal),
                            gblDraft,
                            // Denormalised parent keys. Written on every save so a child row can
                            // never drift away from its LC, and so every child query stays a
                            // single indexed server-side filter.
                            {
                                LCItemId: gblChildContext.LCItemId,
                                LCNumber: gblChildContext.LCNumber,
                                InternalLCID: gblChildContext.InternalLCID
                            },
                            {
                            IsOpen: !Coalesce(
                                LookUp(colStatus, EntityName = "Task" && StatusCode = gblDraft.TaskStatus).IsTerminal,
                                false
                            ),
                            CompletedDate: If(gblDraft.TaskStatus = "Completed", Coalesce(gblOriginal.CompletedDate, Now()), Blank()),
                            CompletedBy: If(gblDraft.TaskStatus = "Completed", Coalesce(gblOriginal.CompletedBy, User()), Blank()),
                            IsSystemGenerated: Coalesce(gblOriginal.IsSystemGenerated, false)
                        }
                        )
                    );

                    ForAll(
                        Filter(
                            Table(
                                    { F: "TaskStatus", O: Coalesce(gblOriginal.TaskStatus, ""), N: Coalesce(gblDraft.TaskStatus, "") },
                                    { F: "AssignedToEmail", O: Coalesce(gblOriginal.AssignedToEmail, ""), N: Coalesce(gblDraft.AssignedToEmail, "") },
                                    { F: "DueDate", O: DateShort(gblOriginal.DueDate), N: DateShort(gblDraft.DueDate) }
                            ),
                            O <> N
                        ) As chg,
                        Patch(
                            '10_AuditLog', Defaults('10_AuditLog'),
                            {
                                Title: "Task:" & gblSaved.Title & ":" & chg.F,
                                EntityName: "Task",
                                RecordItemId: gblSaved.ID,
                                RecordReference: gblSaved.Title,
                                InternalLCID: gblChildContext.InternalLCID,
                                LCNumber: gblChildContext.LCNumber,
                                ActionType: If(gblFormMode = "New", "Create", "Update"),
                                FieldName: chg.F,
                                OldValue: chg.O,
                                NewValue: chg.N,
                                IsCriticalField: chg.F in Split(CfgT("CriticalAuditFields", ""), ";").Value,
                                ActionByEmail: User().Email,
                                ActionByName: User().FullName,
                                ActionTimestamp: Now(),
                                ActionSource: "Power App",
                                CorrelationId: gblCorrelation,
                                PartitionKey: Text(Today0, "yyyy-mm")
                            }
                        )
                    );


                    Set(gblCurrentLC, LookUp('01_ExportLCs', ID = gblChildContext.LCItemId));
                    Notify("Saved.", NotificationType.Success, 2500);
                    Back()
                )
            )
