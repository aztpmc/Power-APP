# =============================================================================
# scrProceedsForm - proceeds record form
# =============================================================================
# Record settlement against a presentation. Outstanding proceeds and net proceeds are both calculated on save - accepted less paid, and gross less every charge.
#
# Shared mechanics with every other record form in the portal:
#   * A working copy (gblDraft) is edited, never the datasource directly, so validation
#     can see the whole prospective record before anything is written.
#   * Validation is one expression producing a list of messages; Save is disabled while
#     that list is non-empty.
#   * A status change is checked against 16_StatusMaster before it is allowed.
#   * Derived values are computed on save, not typed.
#   * One audit row per changed critical field, sharing one correlation id.
# =============================================================================

scrProceedsForm As screen:
    Fill: =ThemeCanvas
    OnVisible: |
        =Set(gblCorrelation, GUID());
        // The parent LC is needed for validation (tolerance, expiry, utilisation) and for
        // the denormalised keys written on save.
        Set(
            gblParentLC,
            Coalesce(
                LookUp('01_ExportLCs', ID = Coalesce(gblChildContext.LCItemId, gblEditChild.LCItemId, -1)),
                gblCurrentLC
            )
        );
        Set(gblOriginal, gblEditChild);
        Set(
            gblDraft,
            If(
                gblFormMode = "New",
                {
                    Title: "",
                    PresentationRef: "",
                    InvoiceNumber: "",
                    PayingBank: "",
                    AmountPresented: Blank(),
                    AmountAccepted: Blank(),
                    AmountPaid: Blank(),
                    BankCharges: Blank(),
                    CorrespondentCharges: Blank(),
                    DiscountCharges: Blank(),
                    OtherCharges: Blank(),
                    ChargesBorneBy: "Beneficiary",
                    ValueDate: Blank(),
                    MaturityDate: Blank(),
                    PaymentDate: Blank(),
                    BankReference: "",
                    CreditedAccount: "",
                    ProceedsStatus: "Expected",
                    ProceedsNotes: ""
                },
                gblEditChild
            )
        );
        Set(gblShowErrors, false)

    lblValidationSource As label:
        X: =-1000
        Y: =-1000
        Width: =1
        Height: =1
        Visible: =false
        Text: |
            =Concat(
                Filter(
                    Table(
                        { M: "Proceeds reference is required.",
                          F: Len(Trim(Coalesce(gblDraft.Title, ""))) = 0 },
                        { M: "Amount accepted is required.",
                          F: IsBlank(gblDraft.AmountAccepted) },
                        { M: "Amounts and charges cannot be negative.",
                          F: Coalesce(gblDraft.AmountAccepted, 0) < 0 || Coalesce(gblDraft.AmountPaid, 0) < 0 || Coalesce(gblDraft.BankCharges, 0) < 0 || Coalesce(gblDraft.OtherCharges, 0) < 0 },
                        { M: "Amount paid cannot exceed the amount accepted.",
                          F: Coalesce(gblDraft.AmountPaid, 0) > Coalesce(gblDraft.AmountAccepted, 0) + 0.01 },
                        { M: "Charges exceed the gross proceeds, which would give a negative net settlement.",
                          F: (Coalesce(gblDraft.BankCharges, 0) + Coalesce(gblDraft.CorrespondentCharges, 0) + Coalesce(gblDraft.DiscountCharges, 0) + Coalesce(gblDraft.OtherCharges, 0)) > Coalesce(gblDraft.AmountPaid, gblDraft.AmountAccepted, 0) },
                        { M: "A record marked as received needs a payment date.",
                          F: gblDraft.ProceedsStatus = "Received" && IsBlank(gblDraft.PaymentDate) },
                        { M: "Writing off outstanding proceeds above the configured threshold requires a treasury manager.",
                          F: gblDraft.ProceedsStatus = "Written Off" && (Coalesce(gblDraft.AmountAccepted, 0) - Coalesce(gblDraft.AmountPaid, 0)) > CfgN("DiscrepancyWriteOffThreshold", 10000) && !CanApprove },
                        { M: TransitionBlockReason("Proceeds", Coalesce(gblOriginal.ProceedsStatus, "Expected"), gblDraft.ProceedsStatus),
                          F: gblFormMode = "Edit" && !CanTransition("Proceeds", Coalesce(gblOriginal.ProceedsStatus, "Expected"), gblDraft.ProceedsStatus) }
                    ),
                    F
                ),
                M,
                Char(10)
            )

    topBar As cmpTopBar:
        X: =ThemeSpace5
        Y: =0
        Width: =Parent.Width - (ThemeSpace5 * 2)
        Height: =ThemeTopBarHeight
        TitleText: |
            =If(gblFormMode = "New", "New proceeds record", "Edit " & Coalesce(gblDraft.Title, "proceeds record"))
        Breadcrumb: |
            =Coalesce(gblParentLC.LCNumber, "No LC selected") & "  /  proceeds record"
        ShowSearch: =false
        ShowBack: =true
        OnBack: =Back()
        ShowPrimary: =false

    # Creating from a module register rather than from an LC workspace: pick the parent
    # first. Without it the record cannot be linked, and an unlinked child record is the
    # one thing this data model must never contain.
    cboParentLC As combobox:
        X: =ThemeSpace5
        Y: =ThemeTopBarHeight + ThemeSpace2
        Width: =400
        Height: =34
        Visible: =IsBlank(gblChildContext) || IsBlank(gblChildContext.LCItemId)
        Items: =SortByColumns(Filter('01_ExportLCs', IsClosed = false), "LCNumber", SortOrder.Ascending)
        DisplayFields: =["LCNumber"]
        SearchFields: =["LCNumber", "CustomerName", "OurReference"]
        IsSearchable: =true
        SelectMultiple: =false
        InputTextPlaceholder: ="Select the LC this proceeds record belongs to"
        Font: =ThemeFont
        Size: =ThemeSizeBody
        OnChange: |
            =Set(gblParentLC, Self.Selected);
            Set(
                gblChildContext,
                {
                    LCItemId: Self.Selected.ID,
                    LCNumber: Self.Selected.LCNumber,
                    InternalLCID: Self.Selected.Title,
                    CustomerName: Self.Selected.CustomerName,
                    CurrencyCode: Self.Selected.CurrencyCode
                }
            )

    recErrors As rectangle:
        X: =ThemeSpace5
        Y: =If(cboParentLC.Visible, cboParentLC.Y + 42, ThemeTopBarHeight + ThemeSpace3)
        Width: =Parent.Width - (ThemeSpace5 * 2)
        Height: =lblErrors.Height + ThemeSpace4
        Fill: =ThemeDangerSoft
        BorderColor: =ThemeDanger
        BorderThickness: =1
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        Visible: =gblShowErrors && Len(lblValidationSource.Text) > 0

    lblErrors As label:
        X: =recErrors.X + ThemeSpace4
        Y: =recErrors.Y + ThemeSpace2
        Width: =recErrors.Width - (ThemeSpace4 * 2)
        Height: |
            =(CountRows(Split(lblValidationSource.Text, Char(10))) * 20) + 8
        Text: =lblValidationSource.Text
        Font: =ThemeFont
        Size: =ThemeSizeBody
        Color: =ThemeDanger
        Visible: =recErrors.Visible
        PaddingLeft: =0

    galForm As gallery:
        X: =ThemeSpace5
        Y: |
            =If(recErrors.Visible, recErrors.Y + recErrors.Height + ThemeSpace3,
                If(cboParentLC.Visible, cboParentLC.Y + 42, ThemeTopBarHeight + ThemeSpace3))
        Width: =Parent.Width - (ThemeSpace5 * 2)
        Height: =Parent.Height - Self.Y - 72
        TemplateSize: =64
        TemplatePadding: =0
        ShowScrollbar: =true
        DelayItemLoading: =false
        WrapCount: =If(IsCompact, 1, 3)
        Items: |
            =Table(
                { K: "Title", L: "Proceeds reference *", T: "text", O: "" },
                { K: "PresentationRef", L: "Presentation", T: "text", O: "" },
                { K: "InvoiceNumber", L: "Invoice number", T: "text", O: "" },
                { K: "PayingBank", L: "Paying or reimbursing bank", T: "lookup", O: "bank" },
                { K: "AmountPresented", L: "Amount presented", T: "number", O: "" },
                { K: "AmountAccepted", L: "Amount accepted *", T: "number", O: "" },
                { K: "AmountPaid", L: "Amount paid", T: "number", O: "" },
                { K: "BankCharges", L: "Bank charges", T: "number", O: "" },
                { K: "CorrespondentCharges", L: "Correspondent charges", T: "number", O: "" },
                { K: "DiscountCharges", L: "Discount or interest charges", T: "number", O: "" },
                { K: "OtherCharges", L: "Other charges", T: "number", O: "" },
                { K: "ChargesBorneBy", L: "Charges borne by", T: "choice", O: "Beneficiary,Applicant,Shared" },
                { K: "ValueDate", L: "Value date", T: "date", O: "" },
                { K: "MaturityDate", L: "Maturity date", T: "date", O: "" },
                { K: "PaymentDate", L: "Payment date", T: "date", O: "" },
                { K: "BankReference", L: "Bank reference", T: "text", O: "" },
                { K: "CreditedAccount", L: "Credited account", T: "text", O: "" },
                { K: "ProceedsStatus", L: "Status", T: "status", O: "" },
                { K: "ProceedsNotes", L: "Notes", T: "text", O: "" }
            )

        lblFieldLabel As label:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =18
            Text: =ThisItem.L
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            Color: =ThemeTextSecondary
            PaddingLeft: =0

        txtField As text:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T in ["text", "number"]
            Format: =If(ThisItem.T = "number", TextFormat.Number, TextFormat.Text)
            Font: =ThemeFont
            Size: =ThemeSizeBody
            BorderColor: =ThemeBorderStrong
            FocusedBorderColor: =ThemeAccent
            BorderThickness: =1
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            Default: |
                =Switch(
                    ThisItem.K,
                    "Title", Coalesce(gblDraft.Title, ""),
                    "PresentationRef", Coalesce(gblDraft.PresentationRef, ""),
                    "InvoiceNumber", Coalesce(gblDraft.InvoiceNumber, ""),
                    "BankReference", Coalesce(gblDraft.BankReference, ""),
                    "CreditedAccount", Coalesce(gblDraft.CreditedAccount, ""),
                    "ProceedsNotes", Coalesce(gblDraft.ProceedsNotes, ""),
                    "AmountPresented", Text(gblDraft.AmountPresented),
                    "AmountAccepted", Text(gblDraft.AmountAccepted),
                    "AmountPaid", Text(gblDraft.AmountPaid),
                    "BankCharges", Text(gblDraft.BankCharges),
                    "CorrespondentCharges", Text(gblDraft.CorrespondentCharges),
                    "DiscountCharges", Text(gblDraft.DiscountCharges),
                    "OtherCharges", Text(gblDraft.OtherCharges),
                    ""
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "Title", Patch(gblDraft, { Title: Trim(Self.Value) }),
                        "PresentationRef", Patch(gblDraft, { PresentationRef: Trim(Self.Value) }),
                        "InvoiceNumber", Patch(gblDraft, { InvoiceNumber: Trim(Self.Value) }),
                        "BankReference", Patch(gblDraft, { BankReference: Trim(Self.Value) }),
                        "CreditedAccount", Patch(gblDraft, { CreditedAccount: Trim(Self.Value) }),
                        "ProceedsNotes", Patch(gblDraft, { ProceedsNotes: Trim(Self.Value) }),
                        "AmountPresented", Patch(gblDraft, { AmountPresented: Value(Self.Value) }),
                        "AmountAccepted", Patch(gblDraft, { AmountAccepted: Value(Self.Value) }),
                        "AmountPaid", Patch(gblDraft, { AmountPaid: Value(Self.Value) }),
                        "BankCharges", Patch(gblDraft, { BankCharges: Value(Self.Value) }),
                        "CorrespondentCharges", Patch(gblDraft, { CorrespondentCharges: Value(Self.Value) }),
                        "DiscountCharges", Patch(gblDraft, { DiscountCharges: Value(Self.Value) }),
                        "OtherCharges", Patch(gblDraft, { OtherCharges: Value(Self.Value) }),
                        gblDraft
                    )
                )

        dpField As datepicker:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "date"
            Font: =ThemeFont
            Size: =ThemeSizeBody
            DefaultDate: |
                =Switch(
                    ThisItem.K,
                    "ValueDate", gblDraft.ValueDate,
                    "MaturityDate", gblDraft.MaturityDate,
                    "PaymentDate", gblDraft.PaymentDate,
                    Blank()
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "ValueDate", Patch(gblDraft, { ValueDate: Self.SelectedDate }),
                        "MaturityDate", Patch(gblDraft, { MaturityDate: Self.SelectedDate }),
                        "PaymentDate", Patch(gblDraft, { PaymentDate: Self.SelectedDate }),
                        gblDraft
                    )
                )

        tglField As toggle:
            X: =0
            Y: =20
            Width: =80
            Height: =28
            Visible: =ThisItem.T = "boolean"
            Default: =false

        drpChoice As dropdown:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "choice"
            Font: =ThemeFont
            Size: =ThemeSizeBody
            Items: =Split(ThisItem.O, ",")
            Default: |
                =Switch(
                    ThisItem.K,
                    "ChargesBorneBy", Coalesce(gblDraft.ChargesBorneBy, ""),
                    ""
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "ChargesBorneBy", Patch(gblDraft, { ChargesBorneBy: Self.Selected.Value }),
                        gblDraft
                    )
                )

        # The status picker offers only the transitions 16_StatusMaster permits from the
        # current status, so an illegal move is not presented in the first place - the
        # validation rule behind it is the backstop, not the only control.
        drpStatus As dropdown:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "status"
            Font: =ThemeFont
            Size: =ThemeSizeBody
            Items: |
                =If(
                    gblFormMode = "New",
                    SortByColumns(Filter(colStatus, EntityName = "Proceeds"), "SortOrder", SortOrder.Ascending),
                    Filter(
                        SortByColumns(Filter(colStatus, EntityName = "Proceeds"), "SortOrder", SortOrder.Ascending),
                        CanTransition("Proceeds", Coalesce(gblOriginal.ProceedsStatus, "Expected"), StatusCode)
                    )
                )
            Default: =gblDraft.ProceedsStatus
            OnChange: |
                =Set(gblDraft, Patch(gblDraft, { ProceedsStatus: Self.Selected.StatusCode }))

        cboLookup As combobox:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "lookup"
            IsSearchable: =true
            SelectMultiple: =false
            Font: =ThemeFont
            Size: =ThemeSizeBody
            DisplayFields: =["Title"]
            SearchFields: =["Title"]
            Items: |
                =Switch(
                    ThisItem.O,
                    "currency",     colCurrencies,
                    "incoterm",     colIncoterms,
                    "doctype",      colDocTypes,
                    "disccategory", colDiscCategories,
                    "bank",         SortByColumns(Filter('12_Banks', IsActive = true), "Title", SortOrder.Ascending),
                    "advisingbank", SortByColumns(Filter('12_Banks', IsActive = true, CanAdvise = true), "Title", SortOrder.Ascending),
                    "port",         SortByColumns(Filter('22_Ports', IsActive = true), "Title", SortOrder.Ascending),
                    "user",         SortByColumns(Filter('17_Users', IsActive = true), "Title", SortOrder.Ascending),
                    Blank()
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "PayingBank", Patch(gblDraft, { PayingBank: Coalesce(Self.Selected.Title, Self.Selected.UserEmail, "") }),
                        gblDraft
                    )
                )

    recActionBar As rectangle:
        X: =0
        Y: =Parent.Height - 64
        Width: =Parent.Width
        Height: =64
        Fill: =ThemeSurface
        BorderColor: =ThemeBorder
        BorderThickness: =1

    lblSaveHint As label:
        X: =ThemeSpace5
        Y: =Parent.Height - 64
        Width: =Parent.Width - 400
        Height: =64
        Text: |
            =If(
                IsBlank(gblChildContext) || IsBlank(gblChildContext.LCItemId),
                "Select the LC this proceeds record belongs to before saving.",
                If(
                    Len(lblValidationSource.Text) > 0,
                    CountRows(Split(lblValidationSource.Text, Char(10))) & " issue(s) to resolve before saving.",
                    "Ready to save."
                )
            )
        Font: =ThemeFont
        Size: =ThemeSizeSmall
        Color: =If(Len(lblValidationSource.Text) > 0, ThemeDanger, ThemeTextMuted)
        VerticalAlign: =VerticalAlign.Middle
        PaddingLeft: =0

    btnCancel As button:
        X: =Parent.Width - 280
        Y: =Parent.Height - 48
        Width: =120
        Height: =34
        Text: ="Cancel"
        Fill: =ThemeSurface
        HoverFill: =ThemeSurfaceHover
        Color: =ThemeTextSecondary
        BorderColor: =ThemeBorderStrong
        BorderThickness: =1
        Font: =ThemeFont
        Size: =ThemeSizeBody
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        OnSelect: =Back()

    btnSave As button:
        X: =Parent.Width - 150
        Y: =Parent.Height - 48
        Width: =150 - ThemeSpace5
        Height: =34
        Text: ="Save"
        Fill: =ThemeAccent
        HoverFill: =ThemeAccentHover
        DisabledFill: =ThemeMutedSoft
        Color: =ThemeTextInverse
        DisabledColor: =ThemeTextMuted
        BorderThickness: =0
        Font: =ThemeFont
        Size: =ThemeSizeBody
        FontWeight: =FontWeight.Semibold
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        DisplayMode: |
            =If(
                Len(lblValidationSource.Text) > 0 || !IsOfficer ||
                IsBlank(gblChildContext) || IsBlank(gblChildContext.LCItemId),
                DisplayMode.Disabled,
                DisplayMode.Edit
            )
        OnSelect: |
            =Set(gblShowErrors, true);
            If(
                Len(lblValidationSource.Text) > 0,
                Notify("Resolve the listed issues before saving.", NotificationType.Error, 4000),
                (
                    Set(gblCorrelation, GUID());
                    Set(
                        gblSaved,
                        Patch(
                            '07_Proceeds',
                            If(gblFormMode = "New", Defaults('07_Proceeds'), gblOriginal),
                            gblDraft,
                            // Denormalised parent keys. Written on every save so a child row can
                            // never drift away from its LC, and so every child query stays a
                            // single indexed server-side filter.
                            {
                                LCItemId: gblChildContext.LCItemId,
                                LCNumber: gblChildContext.LCNumber,
                                InternalLCID: gblChildContext.InternalLCID
                            },
                            {
                            CurrencyCode: gblParentLC.CurrencyCode,
                            GrossProceeds: Coalesce(gblDraft.AmountPaid, gblDraft.AmountAccepted, 0),
                            NetProceeds: Coalesce(gblDraft.AmountPaid, gblDraft.AmountAccepted, 0) -
                                (Coalesce(gblDraft.BankCharges, 0) + Coalesce(gblDraft.CorrespondentCharges, 0) +
                                 Coalesce(gblDraft.DiscountCharges, 0) + Coalesce(gblDraft.OtherCharges, 0)),
                            OutstandingProceeds: Coalesce(gblDraft.AmountAccepted, 0) - Coalesce(gblDraft.AmountPaid, 0),
                            IsSettled: Coalesce(gblDraft.AmountPaid, 0) >= Coalesce(gblDraft.AmountAccepted, 0) &&
                                       Coalesce(gblDraft.AmountAccepted, 0) > 0
                        }
                        )
                    );

                    ForAll(
                        Filter(
                            Table(
                                    { F: "AmountAccepted", O: Text(gblOriginal.AmountAccepted), N: Text(gblDraft.AmountAccepted) },
                                    { F: "AmountPaid", O: Text(gblOriginal.AmountPaid), N: Text(gblDraft.AmountPaid) },
                                    { F: "PaymentDate", O: DateShort(gblOriginal.PaymentDate), N: DateShort(gblDraft.PaymentDate) },
                                    { F: "ProceedsStatus", O: Coalesce(gblOriginal.ProceedsStatus, ""), N: Coalesce(gblDraft.ProceedsStatus, "") }
                            ),
                            O <> N
                        ) As chg,
                        Patch(
                            '10_AuditLog', Defaults('10_AuditLog'),
                            {
                                Title: "Proceeds:" & gblSaved.Title & ":" & chg.F,
                                EntityName: "Proceeds",
                                RecordItemId: gblSaved.ID,
                                RecordReference: gblSaved.Title,
                                InternalLCID: gblChildContext.InternalLCID,
                                LCNumber: gblChildContext.LCNumber,
                                ActionType: If(gblFormMode = "New", "Create", "Update"),
                                FieldName: chg.F,
                                OldValue: chg.O,
                                NewValue: chg.N,
                                IsCriticalField: chg.F in Split(CfgT("CriticalAuditFields", ""), ";").Value,
                                ActionByEmail: User().Email,
                                ActionByName: User().FullName,
                                ActionTimestamp: Now(),
                                ActionSource: "Power App",
                                CorrelationId: gblCorrelation,
                                PartitionKey: Text(Today0, "yyyy-mm")
                            }
                        )
                    );

                    With(
                        { paid: Sum(Filter('07_Proceeds', LCItemId = gblChildContext.LCItemId), AmountPaid) },
                        Patch(
                            '01_ExportLCs',
                            LookUp('01_ExportLCs', ID = gblChildContext.LCItemId),
                            { AmountPaidToDate: paid, LastActivityDate: Now() }
                        )
                    );
                    Set(gblCurrentLC, LookUp('01_ExportLCs', ID = gblChildContext.LCItemId));
                    Notify("Saved.", NotificationType.Success, 2500);
                    Back()
                )
            )
