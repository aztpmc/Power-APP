# =============================================================================
# scrShipmentForm - shipment form
# =============================================================================
# Create or edit a shipment. The latest shipment date is copied from the LC so it cannot drift, and a shipment dated after it is blocked - that is an incurable discrepancy, not a warning.
#
# Shared mechanics with every other record form in the portal:
#   * A working copy (gblDraft) is edited, never the datasource directly, so validation
#     can see the whole prospective record before anything is written.
#   * Validation is one expression producing a list of messages; Save is disabled while
#     that list is non-empty.
#   * A status change is checked against 16_StatusMaster before it is allowed.
#   * Derived values are computed on save, not typed.
#   * One audit row per changed critical field, sharing one correlation id.
# =============================================================================

scrShipmentForm As screen:
    Fill: =ThemeCanvas
    OnVisible: |
        =Set(gblCorrelation, GUID());
        // The parent LC is needed for validation (tolerance, expiry, utilisation) and for
        // the denormalised keys written on save.
        Set(
            gblParentLC,
            Coalesce(
                LookUp('01_ExportLCs', ID = Coalesce(gblChildContext.LCItemId, gblEditChild.LCItemId, -1)),
                gblCurrentLC
            )
        );
        Set(gblOriginal, gblEditChild);
        Set(
            gblDraft,
            If(
                gblFormMode = "New",
                {
                    Title: "",
                    InvoiceNumber: "",
                    PlannedShipmentDate: Blank(),
                    ActualShipmentDate: Blank(),
                    TransportDocType: "Bill of Lading",
                    TransportDocNumber: "",
                    TransportDocDate: Blank(),
                    VesselOrFlight: "",
                    CarrierName: "",
                    PortOfLoading: "",
                    PortOfDischarge: "",
                    FinalDestination: "",
                    IncotermCode: "",
                    ShipmentValue: Blank(),
                    GrossWeightKg: Blank(),
                    NumberOfPackages: Blank(),
                    ShipmentStatus: "Planned",
                    ShipmentNotes: ""
                },
                gblEditChild
            )
        );
        Set(gblShowErrors, false)

    lblValidationSource As label:
        X: =-1000
        Y: =-1000
        Width: =1
        Height: =1
        Visible: =false
        Text: |
            =Concat(
                Filter(
                    Table(
                        { M: "Shipment number is required.",
                          F: Len(Trim(Coalesce(gblDraft.Title, ""))) = 0 },
                        { M: "Shipment value cannot be negative.",
                          F: Coalesce(gblDraft.ShipmentValue, 0) < 0 },
                        { M: "Actual shipment date is after the LC latest shipment date. This is a discrepancy the bank cannot waive without the applicant - record it before presenting.",
                          F: !IsBlank(gblDraft.ActualShipmentDate) && !IsBlank(gblParentLC.LatestShipmentDate) && gblDraft.ActualShipmentDate > gblParentLC.LatestShipmentDate },
                        { M: "Transport document date cannot be before the actual shipment date.",
                          F: !IsBlank(gblDraft.TransportDocDate) && !IsBlank(gblDraft.ActualShipmentDate) && gblDraft.TransportDocDate < gblDraft.ActualShipmentDate },
                        { M: "A shipment marked as shipped needs an actual shipment date.",
                          F: gblDraft.ShipmentStatus in ["Shipped", "In Transit", "Delivered", "Documents Presented"] && IsBlank(gblDraft.ActualShipmentDate) },
                        { M: "Partial shipment is not allowed under this LC and a shipment already exists.",
                          F: gblFormMode = "New" && gblParentLC.PartialShipments = "Not Allowed" && !IsEmpty(Filter('04_Shipments', LCItemId = gblChildContext.LCItemId)) },
                        { M: TransitionBlockReason("Shipment", Coalesce(gblOriginal.ShipmentStatus, "Planned"), gblDraft.ShipmentStatus),
                          F: gblFormMode = "Edit" && !CanTransition("Shipment", Coalesce(gblOriginal.ShipmentStatus, "Planned"), gblDraft.ShipmentStatus) }
                    ),
                    F
                ),
                M,
                Char(10)
            )

    topBar As cmpTopBar:
        X: =ThemeSpace5
        Y: =0
        Width: =Parent.Width - (ThemeSpace5 * 2)
        Height: =ThemeTopBarHeight
        TitleText: |
            =If(gblFormMode = "New", "New shipment", "Edit " & Coalesce(gblDraft.Title, "shipment"))
        Breadcrumb: |
            =Coalesce(gblParentLC.LCNumber, "No LC selected") & "  /  shipment"
        ShowSearch: =false
        ShowBack: =true
        OnBack: =Back()
        ShowPrimary: =false

    # Creating from a module register rather than from an LC workspace: pick the parent
    # first. Without it the record cannot be linked, and an unlinked child record is the
    # one thing this data model must never contain.
    cboParentLC As combobox:
        X: =ThemeSpace5
        Y: =ThemeTopBarHeight + ThemeSpace2
        Width: =400
        Height: =34
        Visible: =IsBlank(gblChildContext) || IsBlank(gblChildContext.LCItemId)
        Items: =SortByColumns(Filter('01_ExportLCs', IsClosed = false), "LCNumber", SortOrder.Ascending)
        DisplayFields: =["LCNumber"]
        SearchFields: =["LCNumber", "CustomerName", "OurReference"]
        IsSearchable: =true
        SelectMultiple: =false
        InputTextPlaceholder: ="Select the LC this shipment belongs to"
        Font: =ThemeFont
        Size: =ThemeSizeBody
        OnChange: |
            =Set(gblParentLC, Self.Selected);
            Set(
                gblChildContext,
                {
                    LCItemId: Self.Selected.ID,
                    LCNumber: Self.Selected.LCNumber,
                    InternalLCID: Self.Selected.Title,
                    CustomerName: Self.Selected.CustomerName,
                    CurrencyCode: Self.Selected.CurrencyCode
                }
            )

    recErrors As rectangle:
        X: =ThemeSpace5
        Y: =If(cboParentLC.Visible, cboParentLC.Y + 42, ThemeTopBarHeight + ThemeSpace3)
        Width: =Parent.Width - (ThemeSpace5 * 2)
        Height: =lblErrors.Height + ThemeSpace4
        Fill: =ThemeDangerSoft
        BorderColor: =ThemeDanger
        BorderThickness: =1
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        Visible: =gblShowErrors && Len(lblValidationSource.Text) > 0

    lblErrors As label:
        X: =recErrors.X + ThemeSpace4
        Y: =recErrors.Y + ThemeSpace2
        Width: =recErrors.Width - (ThemeSpace4 * 2)
        Height: |
            =(CountRows(Split(lblValidationSource.Text, Char(10))) * 20) + 8
        Text: =lblValidationSource.Text
        Font: =ThemeFont
        Size: =ThemeSizeBody
        Color: =ThemeDanger
        Visible: =recErrors.Visible
        PaddingLeft: =0

    galForm As gallery:
        X: =ThemeSpace5
        Y: |
            =If(recErrors.Visible, recErrors.Y + recErrors.Height + ThemeSpace3,
                If(cboParentLC.Visible, cboParentLC.Y + 42, ThemeTopBarHeight + ThemeSpace3))
        Width: =Parent.Width - (ThemeSpace5 * 2)
        Height: =Parent.Height - Self.Y - 72
        TemplateSize: =64
        TemplatePadding: =0
        ShowScrollbar: =true
        DelayItemLoading: =false
        WrapCount: =If(IsCompact, 1, 3)
        Items: |
            =Table(
                { K: "Title", L: "Shipment number *", T: "text", O: "" },
                { K: "InvoiceNumber", L: "Invoice number", T: "text", O: "" },
                { K: "PlannedShipmentDate", L: "Planned shipment date", T: "date", O: "" },
                { K: "ActualShipmentDate", L: "Actual shipment date", T: "date", O: "" },
                { K: "TransportDocType", L: "Transport document", T: "choice", O: "Bill of Lading,Air Waybill,Truck Consignment Note,Rail Consignment Note,Courier Receipt,Multimodal Transport Document" },
                { K: "TransportDocNumber", L: "B/L or AWB number", T: "text", O: "" },
                { K: "TransportDocDate", L: "Transport document date", T: "date", O: "" },
                { K: "VesselOrFlight", L: "Vessel or flight", T: "text", O: "" },
                { K: "CarrierName", L: "Carrier", T: "text", O: "" },
                { K: "PortOfLoading", L: "Port of loading", T: "lookup", O: "port" },
                { K: "PortOfDischarge", L: "Port of discharge", T: "lookup", O: "port" },
                { K: "FinalDestination", L: "Destination", T: "text", O: "" },
                { K: "IncotermCode", L: "Incoterm", T: "lookup", O: "incoterm" },
                { K: "ShipmentValue", L: "Shipment value", T: "number", O: "" },
                { K: "GrossWeightKg", L: "Gross weight (kg)", T: "number", O: "" },
                { K: "NumberOfPackages", L: "Packages", T: "number", O: "" },
                { K: "ShipmentStatus", L: "Status", T: "status", O: "" },
                { K: "ShipmentNotes", L: "Notes", T: "text", O: "" }
            )

        lblFieldLabel As label:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =18
            Text: =ThisItem.L
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            Color: =ThemeTextSecondary
            PaddingLeft: =0

        txtField As text:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T in ["text", "number"]
            Format: =If(ThisItem.T = "number", TextFormat.Number, TextFormat.Text)
            Font: =ThemeFont
            Size: =ThemeSizeBody
            BorderColor: =ThemeBorderStrong
            FocusedBorderColor: =ThemeAccent
            BorderThickness: =1
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            Default: |
                =Switch(
                    ThisItem.K,
                    "Title", Coalesce(gblDraft.Title, ""),
                    "InvoiceNumber", Coalesce(gblDraft.InvoiceNumber, ""),
                    "TransportDocNumber", Coalesce(gblDraft.TransportDocNumber, ""),
                    "VesselOrFlight", Coalesce(gblDraft.VesselOrFlight, ""),
                    "CarrierName", Coalesce(gblDraft.CarrierName, ""),
                    "FinalDestination", Coalesce(gblDraft.FinalDestination, ""),
                    "ShipmentNotes", Coalesce(gblDraft.ShipmentNotes, ""),
                    "ShipmentValue", Text(gblDraft.ShipmentValue),
                    "GrossWeightKg", Text(gblDraft.GrossWeightKg),
                    "NumberOfPackages", Text(gblDraft.NumberOfPackages),
                    ""
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "Title", Patch(gblDraft, { Title: Trim(Self.Value) }),
                        "InvoiceNumber", Patch(gblDraft, { InvoiceNumber: Trim(Self.Value) }),
                        "TransportDocNumber", Patch(gblDraft, { TransportDocNumber: Trim(Self.Value) }),
                        "VesselOrFlight", Patch(gblDraft, { VesselOrFlight: Trim(Self.Value) }),
                        "CarrierName", Patch(gblDraft, { CarrierName: Trim(Self.Value) }),
                        "FinalDestination", Patch(gblDraft, { FinalDestination: Trim(Self.Value) }),
                        "ShipmentNotes", Patch(gblDraft, { ShipmentNotes: Trim(Self.Value) }),
                        "ShipmentValue", Patch(gblDraft, { ShipmentValue: Value(Self.Value) }),
                        "GrossWeightKg", Patch(gblDraft, { GrossWeightKg: Value(Self.Value) }),
                        "NumberOfPackages", Patch(gblDraft, { NumberOfPackages: Value(Self.Value) }),
                        gblDraft
                    )
                )

        dpField As datepicker:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "date"
            Font: =ThemeFont
            Size: =ThemeSizeBody
            DefaultDate: |
                =Switch(
                    ThisItem.K,
                    "PlannedShipmentDate", gblDraft.PlannedShipmentDate,
                    "ActualShipmentDate", gblDraft.ActualShipmentDate,
                    "TransportDocDate", gblDraft.TransportDocDate,
                    Blank()
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "PlannedShipmentDate", Patch(gblDraft, { PlannedShipmentDate: Self.SelectedDate }),
                        "ActualShipmentDate", Patch(gblDraft, { ActualShipmentDate: Self.SelectedDate }),
                        "TransportDocDate", Patch(gblDraft, { TransportDocDate: Self.SelectedDate }),
                        gblDraft
                    )
                )

        tglField As toggle:
            X: =0
            Y: =20
            Width: =80
            Height: =28
            Visible: =ThisItem.T = "boolean"
            Default: =false

        drpChoice As dropdown:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "choice"
            Font: =ThemeFont
            Size: =ThemeSizeBody
            Items: =Split(ThisItem.O, ",")
            Default: |
                =Switch(
                    ThisItem.K,
                    "TransportDocType", Coalesce(gblDraft.TransportDocType, ""),
                    ""
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "TransportDocType", Patch(gblDraft, { TransportDocType: Self.Selected.Value }),
                        gblDraft
                    )
                )

        # The status picker offers only the transitions 16_StatusMaster permits from the
        # current status, so an illegal move is not presented in the first place - the
        # validation rule behind it is the backstop, not the only control.
        drpStatus As dropdown:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "status"
            Font: =ThemeFont
            Size: =ThemeSizeBody
            Items: |
                =If(
                    gblFormMode = "New",
                    SortByColumns(Filter(colStatus, EntityName = "Shipment"), "SortOrder", SortOrder.Ascending),
                    Filter(
                        SortByColumns(Filter(colStatus, EntityName = "Shipment"), "SortOrder", SortOrder.Ascending),
                        CanTransition("Shipment", Coalesce(gblOriginal.ShipmentStatus, "Planned"), StatusCode)
                    )
                )
            Default: =gblDraft.ShipmentStatus
            OnChange: |
                =Set(gblDraft, Patch(gblDraft, { ShipmentStatus: Self.Selected.StatusCode }))

        cboLookup As combobox:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "lookup"
            IsSearchable: =true
            SelectMultiple: =false
            Font: =ThemeFont
            Size: =ThemeSizeBody
            DisplayFields: =["Title"]
            SearchFields: =["Title"]
            Items: |
                =Switch(
                    ThisItem.O,
                    "currency",     colCurrencies,
                    "incoterm",     colIncoterms,
                    "doctype",      colDocTypes,
                    "disccategory", colDiscCategories,
                    "bank",         SortByColumns(Filter('12_Banks', IsActive = true), "Title", SortOrder.Ascending),
                    "advisingbank", SortByColumns(Filter('12_Banks', IsActive = true, CanAdvise = true), "Title", SortOrder.Ascending),
                    "port",         SortByColumns(Filter('22_Ports', IsActive = true), "Title", SortOrder.Ascending),
                    "user",         SortByColumns(Filter('17_Users', IsActive = true), "Title", SortOrder.Ascending),
                    Blank()
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "PortOfLoading", Patch(gblDraft, { PortOfLoading: Coalesce(Self.Selected.Title, Self.Selected.UserEmail, "") }),
                        "PortOfDischarge", Patch(gblDraft, { PortOfDischarge: Coalesce(Self.Selected.Title, Self.Selected.UserEmail, "") }),
                        "IncotermCode", Patch(gblDraft, { IncotermCode: Coalesce(Self.Selected.Title, Self.Selected.UserEmail, "") }),
                        gblDraft
                    )
                )

    recActionBar As rectangle:
        X: =0
        Y: =Parent.Height - 64
        Width: =Parent.Width
        Height: =64
        Fill: =ThemeSurface
        BorderColor: =ThemeBorder
        BorderThickness: =1

    lblSaveHint As label:
        X: =ThemeSpace5
        Y: =Parent.Height - 64
        Width: =Parent.Width - 400
        Height: =64
        Text: |
            =If(
                IsBlank(gblChildContext) || IsBlank(gblChildContext.LCItemId),
                "Select the LC this shipment belongs to before saving.",
                If(
                    Len(lblValidationSource.Text) > 0,
                    CountRows(Split(lblValidationSource.Text, Char(10))) & " issue(s) to resolve before saving.",
                    "Ready to save."
                )
            )
        Font: =ThemeFont
        Size: =ThemeSizeSmall
        Color: =If(Len(lblValidationSource.Text) > 0, ThemeDanger, ThemeTextMuted)
        VerticalAlign: =VerticalAlign.Middle
        PaddingLeft: =0

    btnCancel As button:
        X: =Parent.Width - 280
        Y: =Parent.Height - 48
        Width: =120
        Height: =34
        Text: ="Cancel"
        Fill: =ThemeSurface
        HoverFill: =ThemeSurfaceHover
        Color: =ThemeTextSecondary
        BorderColor: =ThemeBorderStrong
        BorderThickness: =1
        Font: =ThemeFont
        Size: =ThemeSizeBody
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        OnSelect: =Back()

    btnSave As button:
        X: =Parent.Width - 150
        Y: =Parent.Height - 48
        Width: =150 - ThemeSpace5
        Height: =34
        Text: ="Save"
        Fill: =ThemeAccent
        HoverFill: =ThemeAccentHover
        DisabledFill: =ThemeMutedSoft
        Color: =ThemeTextInverse
        DisabledColor: =ThemeTextMuted
        BorderThickness: =0
        Font: =ThemeFont
        Size: =ThemeSizeBody
        FontWeight: =FontWeight.Semibold
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        DisplayMode: |
            =If(
                Len(lblValidationSource.Text) > 0 || !IsOfficer ||
                IsBlank(gblChildContext) || IsBlank(gblChildContext.LCItemId),
                DisplayMode.Disabled,
                DisplayMode.Edit
            )
        OnSelect: |
            =Set(gblShowErrors, true);
            If(
                Len(lblValidationSource.Text) > 0,
                Notify("Resolve the listed issues before saving.", NotificationType.Error, 4000),
                (
                    Set(gblCorrelation, GUID());
                    Set(
                        gblSaved,
                        Patch(
                            '04_Shipments',
                            If(gblFormMode = "New", Defaults('04_Shipments'), gblOriginal),
                            gblDraft,
                            // Denormalised parent keys. Written on every save so a child row can
                            // never drift away from its LC, and so every child query stays a
                            // single indexed server-side filter.
                            {
                                LCItemId: gblChildContext.LCItemId,
                                LCNumber: gblChildContext.LCNumber,
                                InternalLCID: gblChildContext.InternalLCID
                            },
                            {
                            LatestShipmentDate: gblParentLC.LatestShipmentDate,
                            IsShipped: !IsBlank(gblDraft.ActualShipmentDate),
                            CurrencyCode: gblParentLC.CurrencyCode
                        }
                        )
                    );

                    ForAll(
                        Filter(
                            Table(
                                    { F: "ActualShipmentDate", O: DateShort(gblOriginal.ActualShipmentDate), N: DateShort(gblDraft.ActualShipmentDate) },
                                    { F: "TransportDocNumber", O: Coalesce(gblOriginal.TransportDocNumber, ""), N: Coalesce(gblDraft.TransportDocNumber, "") },
                                    { F: "ShipmentValue", O: Text(gblOriginal.ShipmentValue), N: Text(gblDraft.ShipmentValue) },
                                    { F: "ShipmentStatus", O: Coalesce(gblOriginal.ShipmentStatus, ""), N: Coalesce(gblDraft.ShipmentStatus, "") }
                            ),
                            O <> N
                        ) As chg,
                        Patch(
                            '10_AuditLog', Defaults('10_AuditLog'),
                            {
                                Title: "Shipment:" & gblSaved.Title & ":" & chg.F,
                                EntityName: "Shipment",
                                RecordItemId: gblSaved.ID,
                                RecordReference: gblSaved.Title,
                                InternalLCID: gblChildContext.InternalLCID,
                                LCNumber: gblChildContext.LCNumber,
                                ActionType: If(gblFormMode = "New", "Create", "Update"),
                                FieldName: chg.F,
                                OldValue: chg.O,
                                NewValue: chg.N,
                                IsCriticalField: chg.F in Split(CfgT("CriticalAuditFields", ""), ";").Value,
                                ActionByEmail: User().Email,
                                ActionByName: User().FullName,
                                ActionTimestamp: Now(),
                                ActionSource: "Power App",
                                CorrelationId: gblCorrelation,
                                PartitionKey: Text(Today0, "yyyy-mm")
                            }
                        )
                    );


                    Set(gblCurrentLC, LookUp('01_ExportLCs', ID = gblChildContext.LCItemId));
                    Notify("Saved.", NotificationType.Success, 2500);
                    Back()
                )
            )
