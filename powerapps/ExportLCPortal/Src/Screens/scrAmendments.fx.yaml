# =============================================================================
# scrAmendments - Amendments
# =============================================================================
# Amendments across the whole book. An amendment that has been accepted but not yet applied to its LC is the dangerous state - the register is showing terms the bank has already changed - so that is the default view.
#
# Delegation: one Filter() per preset, each written so every predicate folds into the
# OData query. The free-text box uses StartsWith across 4 indexed columns -
# StartsWith(col, "") matches everything, so an empty box costs nothing and the whole
# expression still runs server-side. Results are capped at RegisterPageSize per page.
# =============================================================================

scrAmendments As screen:
    Fill: =ThemeCanvas
    OnVisible: |
        =Set(gblNavSection, "LCS");
        If(IsBlank(gblAmendmentPreset), Set(gblAmendmentPreset, "PENDING"));
        Set(gblModSearch, "");
        Set(gblModPage, 1)

    navRail As cmpNavRail:
        X: =0
        Y: =0
        Width: =RailWidth
        Height: =Parent.Height
        ActiveKey: ="LCS"
        UserName: =gblUserName
        RoleLabel: |
            =Switch(gblRole, "ADMIN", "Administrator", "MANAGER", "Treasury Manager",
                "OFFICER", "Treasury Officer", "REVIEWER", "Reviewer", "Read only")
        OnNavigate: |
            =Switch(
                gblNavSection,
                "HOME",      Navigate(scrDashboard, ScreenTransition.None),
                "LCS",       Navigate(scrLCRegister, ScreenTransition.None),
                "INVOICES",  Navigate(scrInvoices, ScreenTransition.None),
                "SHIPMENTS", Navigate(scrShipments, ScreenTransition.None),
                "PRESENT",   Navigate(scrPresentations, ScreenTransition.None),
                "DOCS",      Navigate(scrDocuments, ScreenTransition.None),
                "DISCREP",   Navigate(scrDiscrepancies, ScreenTransition.None),
                "PROCEEDS",  Navigate(scrProceeds, ScreenTransition.None),
                "CORRESP",   Navigate(scrCorrespondence, ScreenTransition.None),
                "TASKS",     Navigate(scrTasks, ScreenTransition.None),
                "REPORTS",   Navigate(scrReports, ScreenTransition.None),
                "ADMIN",     Navigate(scrAdmin, ScreenTransition.None)
            )

    topBar As cmpTopBar:
        X: =ContentX
        Y: =0
        Width: =ContentWidth
        Height: =ThemeTopBarHeight
        TitleText: ="Amendments"
        Breadcrumb: ="Amendments  ·  " & Proper(Substitute(gblAmendmentPreset, "_", " "))
        ShowSearch: =false
        ShowPrimary: =false

    galPresets As gallery:
        X: =ContentX
        Y: =ThemeTopBarHeight + ThemeSpace3
        Width: =ContentWidth - 320
        Height: =32
        Layout: =Layout.Horizontal
        TemplateSize: =150
        TemplatePadding: =0
        ShowScrollbar: =false
        DelayItemLoading: =false
        Items: |
            =Table(
                { Key: "PENDING", Label: "Not yet applied" },
                { Key: "ACCEPTED", Label: "Accepted, awaiting application" },
                { Key: "AWAITINGCUST", Label: "Awaiting customer" },
                { Key: "AWAITINGBANK", Label: "Awaiting bank" },
                { Key: "APPLIED", Label: "Applied" },
                { Key: "ALL", Label: "All amendments" }
            )

        btnPreset As button:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth - ThemeSpace2
            Height: =30
            Text: =ThisItem.Label
            Fill: =If(gblAmendmentPreset = ThisItem.Key, ThemeAccentSoft, ThemeSurface)
            HoverFill: =ThemeSurfaceHover
            Color: =If(gblAmendmentPreset = ThisItem.Key, ThemeAccent, ThemeTextSecondary)
            BorderColor: =If(gblAmendmentPreset = ThisItem.Key, ThemeAccent, ThemeBorderStrong)
            BorderThickness: =1
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            FontWeight: |
                =If(gblAmendmentPreset = ThisItem.Key, FontWeight.Semibold, FontWeight.Normal)
            RadiusTopLeft: =15
            RadiusTopRight: =15
            RadiusBottomLeft: =15
            RadiusBottomRight: =15
            OnSelect: |
                =Set(gblAmendmentPreset, ThisItem.Key);
                Set(gblModPage, 1)

    txtModSearch As text:
        X: =ContentX + ContentWidth - 310
        Y: =ThemeTopBarHeight + ThemeSpace3
        Width: =180
        Height: =30
        HintText: ="Search"
        DelayOutput: =true
        Font: =ThemeFont
        Size: =ThemeSizeBody
        BorderColor: =ThemeBorderStrong
        FocusedBorderColor: =ThemeAccent
        BorderThickness: =1
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        OnChange: |
            =Set(gblModSearch, Self.Value);
            Set(gblModPage, 1)

    btnAdd As button:
        X: =ContentX + ContentWidth - 120
        Y: =ThemeTopBarHeight + ThemeSpace3
        Width: =120
        Height: =30
        Text: ="Record amendment"
        Visible: =IsOfficer
        Fill: =ThemeAccent
        HoverFill: =ThemeAccentHover
        Color: =ThemeTextInverse
        BorderThickness: =0
        Font: =ThemeFont
        Size: =ThemeSizeSmall
        FontWeight: =FontWeight.Semibold
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        # Creating from the module register rather than from inside an LC needs the LC
        # chosen first, so the record can never be saved without a parent.
        OnSelect: |
            =Set(gblEditChild, Blank());
            Set(gblChildContext, Blank());
            Set(gblFormMode, "New");
            Navigate(scrAmendmentForm, ScreenTransition.CoverRight)

    lblSummary As label:
        X: =ContentX
        Y: =galPresets.Y + galPresets.Height + ThemeSpace2
        Width: =ContentWidth - 220
        Height: =24
        Text: =CountRows(galModule.AllItems) & " amendment(s) on this page"
        Font: =ThemeFont
        Size: =ThemeSizeSmall
        Color: =ThemeTextMuted
        VerticalAlign: =VerticalAlign.Middle
        PaddingLeft: =0

    btnPrev As button:
        X: =ContentX + ContentWidth - 200
        Y: =lblSummary.Y
        Width: =90
        Height: =26
        Text: ="Previous"
        DisplayMode: =If(gblModPage <= 1, DisplayMode.Disabled, DisplayMode.Edit)
        Fill: =ThemeSurface
        HoverFill: =ThemeSurfaceHover
        Color: =ThemeAccent
        BorderColor: =ThemeBorderStrong
        BorderThickness: =1
        Font: =ThemeFont
        Size: =ThemeSizeSmall
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        OnSelect: =Set(gblModPage, Max(1, gblModPage - 1))

    btnNext As button:
        X: =ContentX + ContentWidth - 100
        Y: =lblSummary.Y
        Width: =90
        Height: =26
        Text: ="Next"
        DisplayMode: |
            =If(CountRows(galModule.AllItems) < RegisterPageSize, DisplayMode.Disabled, DisplayMode.Edit)
        Fill: =ThemeSurface
        HoverFill: =ThemeSurfaceHover
        Color: =ThemeAccent
        BorderColor: =ThemeBorderStrong
        BorderThickness: =1
        Font: =ThemeFont
        Size: =ThemeSizeSmall
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        OnSelect: =Set(gblModPage, gblModPage + 1)

    recHeader As rectangle:
        X: =ContentX
        Y: =lblSummary.Y + 30
        Width: =ContentWidth
        Height: =34
        Fill: =ThemeSurfaceAlt
        BorderColor: =ThemeBorder
        BorderThickness: =1
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius

    galHeader As gallery:
        X: =recHeader.X + ThemeSpace4
        Y: =recHeader.Y
        Width: =recHeader.Width - ThemeSpace4
        Height: =recHeader.Height
        Layout: =Layout.Horizontal
        TemplateSize: =120
        TemplatePadding: =0
        ShowScrollbar: =false
        DelayItemLoading: =false
        Items: |
            =Table(
                { Label: "Reference", W: 0.16, A: "L" },
                { Label: "LC Number", W: 0.14, A: "L" },
                { Label: "No.", W: 0.05, A: "L" },
                { Label: "Date", W: 0.10, A: "L" },
                { Label: "Type", W: 0.20, A: "L" },
                { Label: "New amount", W: 0.11, A: "R" },
                { Label: "Acceptance", W: 0.14, A: "L" }
            )

        lblHead As label:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth
            Height: =Parent.TemplateHeight
            Text: =ThisItem.Label
            Align: =If(ThisItem.A = "R", Align.Right, Align.Left)
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            FontWeight: =FontWeight.Semibold
            Color: =ThemeTextSecondary
            VerticalAlign: =VerticalAlign.Middle
            PaddingLeft: =0
            PaddingRight: =0

    galModule As gallery:
        X: =ContentX
        Y: =recHeader.Y + recHeader.Height
        Width: =ContentWidth
        Height: =Parent.Height - Self.Y - ThemeSpace4
        TemplateSize: =ThemeRowHeight
        TemplatePadding: =0
        ShowScrollbar: =true
        DelayItemLoading: =true
        LoadingSpinner: =LoadingSpinner.Data
        Items: |
            =LastN(
                FirstN(
                    SortByColumns(
                        Switch(
                            gblAmendmentPreset,
                    "PENDING",
                        Filter(
                            '02_LCAmendments',
                            AppliedToLC = false,
                            StartsWith(Title, gblModSearch) || StartsWith(LCNumber, gblModSearch) || StartsWith(BankAmendmentRef, gblModSearch) || StartsWith(InternalLCID, gblModSearch)
                        ),
                    "ACCEPTED",
                        Filter(
                            '02_LCAmendments',
                            AppliedToLC = false, AmendmentStatus = "Accepted",
                            StartsWith(Title, gblModSearch) || StartsWith(LCNumber, gblModSearch) || StartsWith(BankAmendmentRef, gblModSearch) || StartsWith(InternalLCID, gblModSearch)
                        ),
                    "AWAITINGCUST",
                        Filter(
                            '02_LCAmendments',
                            CustomerAcceptance = "Pending",
                            StartsWith(Title, gblModSearch) || StartsWith(LCNumber, gblModSearch) || StartsWith(BankAmendmentRef, gblModSearch) || StartsWith(InternalLCID, gblModSearch)
                        ),
                    "AWAITINGBANK",
                        Filter(
                            '02_LCAmendments',
                            BankConfirmation = "Pending",
                            StartsWith(Title, gblModSearch) || StartsWith(LCNumber, gblModSearch) || StartsWith(BankAmendmentRef, gblModSearch) || StartsWith(InternalLCID, gblModSearch)
                        ),
                    "APPLIED",
                        Filter(
                            '02_LCAmendments',
                            AppliedToLC = true,
                            StartsWith(Title, gblModSearch) || StartsWith(LCNumber, gblModSearch) || StartsWith(BankAmendmentRef, gblModSearch) || StartsWith(InternalLCID, gblModSearch)
                        ),
                    "ALL",
                        Filter(
                            '02_LCAmendments',
                            StartsWith(Title, gblModSearch) || StartsWith(LCNumber, gblModSearch) || StartsWith(BankAmendmentRef, gblModSearch) || StartsWith(InternalLCID, gblModSearch)
                        ),
                            Filter('02_LCAmendments', StartsWith(Title, gblModSearch) || StartsWith(LCNumber, gblModSearch) || StartsWith(BankAmendmentRef, gblModSearch) || StartsWith(InternalLCID, gblModSearch))
                        ),
                        "AmendmentDate", SortOrder.Ascending
                    ),
                    ((gblModPage - 1) * RegisterPageSize) + RegisterPageSize
                ),
                RegisterPageSize
            )
        OnSelect: |
            =Set(gblEditChild, ThisItem);
            Set(gblFormMode, "Edit");
            Set(gblChildContext, { LCItemId: ThisItem.LCItemId, LCNumber: ThisItem.LCNumber, InternalLCID: ThisItem.InternalLCID });
            Navigate(scrAmendmentForm, ScreenTransition.CoverRight)

        recRowBg As rectangle:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth
            Height: =Parent.TemplateHeight - 1
            Fill: =ThemeSurface

        recRowFlag As rectangle:
            X: =0
            Y: =0
            Width: =3
            Height: =Parent.TemplateHeight - 1
            Fill: =If(!ThisItem.AppliedToLC && ThisItem.AmendmentStatus = "Accepted", ThemeDanger, RGBA(0, 0, 0, 0))

        recRowRule As rectangle:
            X: =0
            Y: =Parent.TemplateHeight - 1
            Width: =Parent.TemplateWidth
            Height: =1
            Fill: =ThemeBorder

        lblCol0 As label:
            X: =ThemeSpace4
            Y: =0
            Width: =Parent.TemplateWidth * 0.16
            Height: =Parent.TemplateHeight
            Text: =ThisItem.Title
            Align: =Align.Left
            Font: =ThemeFont
            Size: =ThemeSizeBody
            FontWeight: =FontWeight.Normal
            Color: =ThemeText
            VerticalAlign: =VerticalAlign.Middle
            PaddingLeft: =0
            PaddingRight: =0
        lblCol1 As label:
            X: =lblCol0.X + lblCol0.Width
            Y: =0
            Width: =Parent.TemplateWidth * 0.14
            Height: =Parent.TemplateHeight
            Text: =ThisItem.LCNumber
            Align: =Align.Left
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            FontWeight: =FontWeight.Normal
            Color: =ThemeTextSecondary
            VerticalAlign: =VerticalAlign.Middle
            PaddingLeft: =0
            PaddingRight: =0
        lblCol2 As label:
            X: =lblCol1.X + lblCol1.Width
            Y: =0
            Width: =Parent.TemplateWidth * 0.05
            Height: =Parent.TemplateHeight
            Text: =ThisItem.AmendmentNumber
            Align: =Align.Left
            Font: =ThemeFont
            Size: =ThemeSizeBody
            FontWeight: =FontWeight.Normal
            Color: =ThemeText
            VerticalAlign: =VerticalAlign.Middle
            PaddingLeft: =0
            PaddingRight: =0
        lblCol3 As label:
            X: =lblCol2.X + lblCol2.Width
            Y: =0
            Width: =Parent.TemplateWidth * 0.10
            Height: =Parent.TemplateHeight
            Text: =DateShort(ThisItem.AmendmentDate)
            Align: =Align.Left
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            FontWeight: =FontWeight.Normal
            Color: =ThemeTextSecondary
            VerticalAlign: =VerticalAlign.Middle
            PaddingLeft: =0
            PaddingRight: =0
        lblCol4 As label:
            X: =lblCol3.X + lblCol3.Width
            Y: =0
            Width: =Parent.TemplateWidth * 0.20
            Height: =Parent.TemplateHeight
            Text: =Concat(ThisItem.AmendmentTypes, Value, ", ")
            Align: =Align.Left
            Font: =ThemeFont
            Size: =ThemeSizeBody
            FontWeight: =FontWeight.Normal
            Color: =ThemeText
            VerticalAlign: =VerticalAlign.Middle
            PaddingLeft: =0
            PaddingRight: =0
        lblCol5 As label:
            X: =lblCol4.X + lblCol4.Width
            Y: =0
            Width: =Parent.TemplateWidth * 0.11
            Height: =Parent.TemplateHeight
            Text: =If(IsBlank(ThisItem.AmountAfter), "-", Text(ThisItem.AmountAfter, "#,##0.00"))
            Align: =Align.Right
            Font: =ThemeFont
            Size: =ThemeSizeBody
            FontWeight: =FontWeight.Semibold
            Color: =ThemeText
            VerticalAlign: =VerticalAlign.Middle
            PaddingLeft: =0
            PaddingRight: =0
        lblCol6 As label:
            X: =lblCol5.X + lblCol5.Width
            Y: =0
            Width: =Parent.TemplateWidth * 0.14
            Height: =Parent.TemplateHeight
            Text: =ThisItem.CustomerAcceptance & " / " & ThisItem.BankConfirmation
            Align: =Align.Left
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            FontWeight: =FontWeight.Normal
            Color: =If(!ThisItem.AppliedToLC && ThisItem.AmendmentStatus = "Accepted", ThemeDanger, ThemeTextSecondary)
            VerticalAlign: =VerticalAlign.Middle
            PaddingLeft: =0
            PaddingRight: =0

        badgeRow As cmpStatusBadge:
            X: =Parent.TemplateWidth - 150 - ThemeSpace4
            Y: =10
            Width: =150
            Height: =24
            Entity: ="Amendment"
            StatusCode: =ThisItem.AmendmentStatus
            BadgeWidth: =150

        btnOpenLC As button:
            X: =Parent.TemplateWidth - 24
            Y: =12
            Width: =20
            Height: =20
            Text: =""
            Fill: =RGBA(0, 0, 0, 0)
            HoverFill: =ThemeSurfaceHover
            BorderThickness: =0
            AccessibleLabel: ="Open the LC workspace for " & ThisItem.LCNumber
            # Jumping straight to the parent LC from any module row: the single most-used
            # shortcut in a trade finance system, and the reason LCItemId is denormalised
            # onto every child list.
            OnSelect: |
                =Set(gblCurrentLC, LookUp('01_ExportLCs', ID = ThisItem.LCItemId));
                Set(gblWorkspaceTab, "Overview");
                Navigate(scrLCWorkspace, ScreenTransition.CoverRight)

    emptyModule As cmpEmptyState:
        X: =ContentX
        Y: =galModule.Y + 30
        Width: =ContentWidth
        Height: =180
        Visible: =IsEmpty(galModule.AllItems)
        Title: ="Nothing here"
        Body: ="No records match this view" & If(Len(gblModSearch) > 0, " and the search term '" & gblModSearch & "'.", ".")
        ActionLabel: ="Show all"
        OnAction: |
            =Set(gblAmendmentPreset, "ALL");
            Set(gblModSearch, "");
            Reset(txtModSearch);
            Set(gblModPage, 1)
