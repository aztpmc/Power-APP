# =============================================================================
# scrDiscrepancyForm - discrepancy form
# =============================================================================
# Record or resolve a discrepancy. Selecting a category pulls its default severity, resolution window and handling guidance from 24_DiscrepancyCategories - none of it is coded here.
#
# Shared mechanics with every other record form in the portal:
#   * A working copy (gblDraft) is edited, never the datasource directly, so validation
#     can see the whole prospective record before anything is written.
#   * Validation is one expression producing a list of messages; Save is disabled while
#     that list is non-empty.
#   * A status change is checked against 16_StatusMaster before it is allowed.
#   * Derived values are computed on save, not typed.
#   * One audit row per changed critical field, sharing one correlation id.
# =============================================================================

scrDiscrepancyForm As screen:
    Fill: =ThemeCanvas
    OnVisible: |
        =Set(gblCorrelation, GUID());
        // The parent LC is needed for validation (tolerance, expiry, utilisation) and for
        // the denormalised keys written on save.
        Set(
            gblParentLC,
            Coalesce(
                LookUp('01_ExportLCs', ID = Coalesce(gblChildContext.LCItemId, gblEditChild.LCItemId, -1)),
                gblCurrentLC
            )
        );
        Set(gblOriginal, gblEditChild);
        Set(
            gblDraft,
            If(
                gblFormMode = "New",
                {
                    Title: "",
                    PresentationRef: "",
                    CategoryName: "",
                    Severity: "Minor",
                    DiscrepancyDescription: "",
                    RelatedDocumentType: "",
                    DetectedDate: Blank(),
                    DetectedBy: "Issuing Bank",
                    BankNoticeRef: "",
                    BankNoticeDate: Blank(),
                    CustomerActionRequired: "",
                    BankActionRequired: "",
                    WaiverRequired: false,
                    WaiverRequestedDate: Blank(),
                    WaiverReceived: false,
                    WaiverReceivedDate: Blank(),
                    ResolutionType: "Not Resolved",
                    ResolutionNotes: "",
                    ResolutionDate: Blank(),
                    DueDate: Blank(),
                    DiscrepancyStatus: "Open"
                },
                gblEditChild
            )
        );
        Set(gblShowErrors, false)

    lblValidationSource As label:
        X: =-1000
        Y: =-1000
        Width: =1
        Height: =1
        Visible: =false
        Text: |
            =Concat(
                Filter(
                    Table(
                        { M: "Discrepancy reference is required.",
                          F: Len(Trim(Coalesce(gblDraft.Title, ""))) = 0 },
                        { M: "Category is required.",
                          F: Len(Trim(Coalesce(gblDraft.CategoryName, ""))) = 0 },
                        { M: "Description is required - a discrepancy with no description cannot be actioned by anyone else.",
                          F: Len(Trim(Coalesce(gblDraft.DiscrepancyDescription, ""))) = 0 },
                        { M: "A resolved discrepancy needs a resolution type and a resolution date.",
                          F: gblDraft.DiscrepancyStatus in ["Resolved", "Closed"] && (gblDraft.ResolutionType = "Not Resolved" || IsBlank(gblDraft.ResolutionDate)) },
                        { M: "Waiver received cannot be set without a waiver request date.",
                          F: gblDraft.WaiverReceived && IsBlank(gblDraft.WaiverRequestedDate) },
                        { M: "Marking this waived requires the waiver to have been received.",
                          F: gblDraft.DiscrepancyStatus = "Waived" && !gblDraft.WaiverReceived },
                        { M: "Resolution date cannot be before the detected date.",
                          F: !IsBlank(gblDraft.ResolutionDate) && !IsBlank(gblDraft.DetectedDate) && gblDraft.ResolutionDate < gblDraft.DetectedDate },
                        { M: "Only a treasury manager can close a discrepancy as rejected and unresolved.",
                          F: gblDraft.ResolutionType = "Rejected - Unresolved" && !CanApprove },
                        { M: TransitionBlockReason("Discrepancy", Coalesce(gblOriginal.DiscrepancyStatus, "Open"), gblDraft.DiscrepancyStatus),
                          F: gblFormMode = "Edit" && !CanTransition("Discrepancy", Coalesce(gblOriginal.DiscrepancyStatus, "Open"), gblDraft.DiscrepancyStatus) }
                    ),
                    F
                ),
                M,
                Char(10)
            )

    topBar As cmpTopBar:
        X: =ThemeSpace5
        Y: =0
        Width: =Parent.Width - (ThemeSpace5 * 2)
        Height: =ThemeTopBarHeight
        TitleText: |
            =If(gblFormMode = "New", "New discrepancy", "Edit " & Coalesce(gblDraft.Title, "discrepancy"))
        Breadcrumb: |
            =Coalesce(gblParentLC.LCNumber, "No LC selected") & "  /  discrepancy"
        ShowSearch: =false
        ShowBack: =true
        OnBack: =Back()
        ShowPrimary: =false

    # Creating from a module register rather than from an LC workspace: pick the parent
    # first. Without it the record cannot be linked, and an unlinked child record is the
    # one thing this data model must never contain.
    cboParentLC As combobox:
        X: =ThemeSpace5
        Y: =ThemeTopBarHeight + ThemeSpace2
        Width: =400
        Height: =34
        Visible: =IsBlank(gblChildContext) || IsBlank(gblChildContext.LCItemId)
        Items: =SortByColumns(Filter('01_ExportLCs', IsClosed = false), "LCNumber", SortOrder.Ascending)
        DisplayFields: =["LCNumber"]
        SearchFields: =["LCNumber", "CustomerName", "OurReference"]
        IsSearchable: =true
        SelectMultiple: =false
        InputTextPlaceholder: ="Select the LC this discrepancy belongs to"
        Font: =ThemeFont
        Size: =ThemeSizeBody
        OnChange: |
            =Set(gblParentLC, Self.Selected);
            Set(
                gblChildContext,
                {
                    LCItemId: Self.Selected.ID,
                    LCNumber: Self.Selected.LCNumber,
                    InternalLCID: Self.Selected.Title,
                    CustomerName: Self.Selected.CustomerName,
                    CurrencyCode: Self.Selected.CurrencyCode
                }
            )

    recErrors As rectangle:
        X: =ThemeSpace5
        Y: =If(cboParentLC.Visible, cboParentLC.Y + 42, ThemeTopBarHeight + ThemeSpace3)
        Width: =Parent.Width - (ThemeSpace5 * 2)
        Height: =lblErrors.Height + ThemeSpace4
        Fill: =ThemeDangerSoft
        BorderColor: =ThemeDanger
        BorderThickness: =1
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        Visible: =gblShowErrors && Len(lblValidationSource.Text) > 0

    lblErrors As label:
        X: =recErrors.X + ThemeSpace4
        Y: =recErrors.Y + ThemeSpace2
        Width: =recErrors.Width - (ThemeSpace4 * 2)
        Height: |
            =(CountRows(Split(lblValidationSource.Text, Char(10))) * 20) + 8
        Text: =lblValidationSource.Text
        Font: =ThemeFont
        Size: =ThemeSizeBody
        Color: =ThemeDanger
        Visible: =recErrors.Visible
        PaddingLeft: =0

    galForm As gallery:
        X: =ThemeSpace5
        Y: |
            =If(recErrors.Visible, recErrors.Y + recErrors.Height + ThemeSpace3,
                If(cboParentLC.Visible, cboParentLC.Y + 42, ThemeTopBarHeight + ThemeSpace3))
        Width: =Parent.Width - (ThemeSpace5 * 2)
        Height: =Parent.Height - Self.Y - 72
        TemplateSize: =64
        TemplatePadding: =0
        ShowScrollbar: =true
        DelayItemLoading: =false
        WrapCount: =If(IsCompact, 1, 3)
        Items: |
            =Table(
                { K: "Title", L: "Discrepancy reference *", T: "text", O: "" },
                { K: "PresentationRef", L: "Presentation", T: "text", O: "" },
                { K: "CategoryName", L: "Category *", T: "lookup", O: "disccategory" },
                { K: "Severity", L: "Severity", T: "choice", O: "Minor,Major,Critical" },
                { K: "DiscrepancyDescription", L: "Description *", T: "text", O: "" },
                { K: "RelatedDocumentType", L: "Related document", T: "lookup", O: "doctype" },
                { K: "DetectedDate", L: "Detected date", T: "date", O: "" },
                { K: "DetectedBy", L: "Detected by", T: "choice", O: "Issuing Bank,Advising Bank,Confirming Bank,Internal Review,Customer" },
                { K: "BankNoticeRef", L: "Bank notice reference", T: "text", O: "" },
                { K: "BankNoticeDate", L: "Bank notice date", T: "date", O: "" },
                { K: "CustomerActionRequired", L: "Customer action", T: "text", O: "" },
                { K: "BankActionRequired", L: "Bank action", T: "text", O: "" },
                { K: "WaiverRequired", L: "Waiver required", T: "boolean", O: "" },
                { K: "WaiverRequestedDate", L: "Waiver requested", T: "date", O: "" },
                { K: "WaiverReceived", L: "Waiver received", T: "boolean", O: "" },
                { K: "WaiverReceivedDate", L: "Waiver received date", T: "date", O: "" },
                { K: "ResolutionType", L: "Resolution", T: "choice", O: "Not Resolved,Waived by Applicant,Documents Corrected,Re-presented,Sent on Approval Basis,Sent on Collection Basis,Withdrawn,Rejected - Unresolved" },
                { K: "ResolutionNotes", L: "Resolution notes", T: "text", O: "" },
                { K: "ResolutionDate", L: "Resolution date", T: "date", O: "" },
                { K: "DueDate", L: "Due date", T: "date", O: "" },
                { K: "DiscrepancyStatus", L: "Status", T: "status", O: "" }
            )

        lblFieldLabel As label:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =18
            Text: =ThisItem.L
            Font: =ThemeFont
            Size: =ThemeSizeSmall
            Color: =ThemeTextSecondary
            PaddingLeft: =0

        txtField As text:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T in ["text", "number"]
            Format: =If(ThisItem.T = "number", TextFormat.Number, TextFormat.Text)
            Font: =ThemeFont
            Size: =ThemeSizeBody
            BorderColor: =ThemeBorderStrong
            FocusedBorderColor: =ThemeAccent
            BorderThickness: =1
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            Default: |
                =Switch(
                    ThisItem.K,
                    "Title", Coalesce(gblDraft.Title, ""),
                    "PresentationRef", Coalesce(gblDraft.PresentationRef, ""),
                    "DiscrepancyDescription", Coalesce(gblDraft.DiscrepancyDescription, ""),
                    "BankNoticeRef", Coalesce(gblDraft.BankNoticeRef, ""),
                    "CustomerActionRequired", Coalesce(gblDraft.CustomerActionRequired, ""),
                    "BankActionRequired", Coalesce(gblDraft.BankActionRequired, ""),
                    "ResolutionNotes", Coalesce(gblDraft.ResolutionNotes, ""),
                    ""
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "Title", Patch(gblDraft, { Title: Trim(Self.Value) }),
                        "PresentationRef", Patch(gblDraft, { PresentationRef: Trim(Self.Value) }),
                        "DiscrepancyDescription", Patch(gblDraft, { DiscrepancyDescription: Trim(Self.Value) }),
                        "BankNoticeRef", Patch(gblDraft, { BankNoticeRef: Trim(Self.Value) }),
                        "CustomerActionRequired", Patch(gblDraft, { CustomerActionRequired: Trim(Self.Value) }),
                        "BankActionRequired", Patch(gblDraft, { BankActionRequired: Trim(Self.Value) }),
                        "ResolutionNotes", Patch(gblDraft, { ResolutionNotes: Trim(Self.Value) }),
                        gblDraft
                    )
                )

        dpField As datepicker:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "date"
            Font: =ThemeFont
            Size: =ThemeSizeBody
            DefaultDate: |
                =Switch(
                    ThisItem.K,
                    "DetectedDate", gblDraft.DetectedDate,
                    "BankNoticeDate", gblDraft.BankNoticeDate,
                    "WaiverRequestedDate", gblDraft.WaiverRequestedDate,
                    "WaiverReceivedDate", gblDraft.WaiverReceivedDate,
                    "ResolutionDate", gblDraft.ResolutionDate,
                    "DueDate", gblDraft.DueDate,
                    Blank()
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "DetectedDate", Patch(gblDraft, { DetectedDate: Self.SelectedDate }),
                        "BankNoticeDate", Patch(gblDraft, { BankNoticeDate: Self.SelectedDate }),
                        "WaiverRequestedDate", Patch(gblDraft, { WaiverRequestedDate: Self.SelectedDate }),
                        "WaiverReceivedDate", Patch(gblDraft, { WaiverReceivedDate: Self.SelectedDate }),
                        "ResolutionDate", Patch(gblDraft, { ResolutionDate: Self.SelectedDate }),
                        "DueDate", Patch(gblDraft, { DueDate: Self.SelectedDate }),
                        gblDraft
                    )
                )

        tglField As toggle:
            X: =0
            Y: =20
            Width: =80
            Height: =28
            Visible: =ThisItem.T = "boolean"
            Default: |
                =Switch(
                    ThisItem.K,
                    "WaiverRequired", Coalesce(gblDraft.WaiverRequired, false),
                    "WaiverReceived", Coalesce(gblDraft.WaiverReceived, false),
                    false
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "WaiverRequired", Patch(gblDraft, { WaiverRequired: Self.Value }),
                        "WaiverReceived", Patch(gblDraft, { WaiverReceived: Self.Value }),
                        gblDraft
                    )
                )

        drpChoice As dropdown:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "choice"
            Font: =ThemeFont
            Size: =ThemeSizeBody
            Items: =Split(ThisItem.O, ",")
            Default: |
                =Switch(
                    ThisItem.K,
                    "Severity", Coalesce(gblDraft.Severity, ""),
                    "DetectedBy", Coalesce(gblDraft.DetectedBy, ""),
                    "ResolutionType", Coalesce(gblDraft.ResolutionType, ""),
                    ""
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "Severity", Patch(gblDraft, { Severity: Self.Selected.Value }),
                        "DetectedBy", Patch(gblDraft, { DetectedBy: Self.Selected.Value }),
                        "ResolutionType", Patch(gblDraft, { ResolutionType: Self.Selected.Value }),
                        gblDraft
                    )
                )

        # The status picker offers only the transitions 16_StatusMaster permits from the
        # current status, so an illegal move is not presented in the first place - the
        # validation rule behind it is the backstop, not the only control.
        drpStatus As dropdown:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "status"
            Font: =ThemeFont
            Size: =ThemeSizeBody
            Items: |
                =If(
                    gblFormMode = "New",
                    SortByColumns(Filter(colStatus, EntityName = "Discrepancy"), "SortOrder", SortOrder.Ascending),
                    Filter(
                        SortByColumns(Filter(colStatus, EntityName = "Discrepancy"), "SortOrder", SortOrder.Ascending),
                        CanTransition("Discrepancy", Coalesce(gblOriginal.DiscrepancyStatus, "Open"), StatusCode)
                    )
                )
            Default: =gblDraft.DiscrepancyStatus
            OnChange: |
                =Set(gblDraft, Patch(gblDraft, { DiscrepancyStatus: Self.Selected.StatusCode }))

        cboLookup As combobox:
            X: =0
            Y: =18
            Width: =Parent.TemplateWidth - ThemeSpace4
            Height: =32
            Visible: =ThisItem.T = "lookup"
            IsSearchable: =true
            SelectMultiple: =false
            Font: =ThemeFont
            Size: =ThemeSizeBody
            DisplayFields: =["Title"]
            SearchFields: =["Title"]
            Items: |
                =Switch(
                    ThisItem.O,
                    "currency",     colCurrencies,
                    "incoterm",     colIncoterms,
                    "doctype",      colDocTypes,
                    "disccategory", colDiscCategories,
                    "bank",         SortByColumns(Filter('12_Banks', IsActive = true), "Title", SortOrder.Ascending),
                    "advisingbank", SortByColumns(Filter('12_Banks', IsActive = true, CanAdvise = true), "Title", SortOrder.Ascending),
                    "port",         SortByColumns(Filter('22_Ports', IsActive = true), "Title", SortOrder.Ascending),
                    "user",         SortByColumns(Filter('17_Users', IsActive = true), "Title", SortOrder.Ascending),
                    Blank()
                )
            OnChange: |
                =Set(
                    gblDraft,
                    Switch(
                        ThisItem.K,
                        "CategoryName", Patch(gblDraft, { CategoryName: Coalesce(Self.Selected.Title, Self.Selected.UserEmail, "") }),
                        "RelatedDocumentType", Patch(gblDraft, { RelatedDocumentType: Coalesce(Self.Selected.Title, Self.Selected.UserEmail, "") }),
                        gblDraft
                    )
                )

    recActionBar As rectangle:
        X: =0
        Y: =Parent.Height - 64
        Width: =Parent.Width
        Height: =64
        Fill: =ThemeSurface
        BorderColor: =ThemeBorder
        BorderThickness: =1

    lblSaveHint As label:
        X: =ThemeSpace5
        Y: =Parent.Height - 64
        Width: =Parent.Width - 400
        Height: =64
        Text: |
            =If(
                IsBlank(gblChildContext) || IsBlank(gblChildContext.LCItemId),
                "Select the LC this discrepancy belongs to before saving.",
                If(
                    Len(lblValidationSource.Text) > 0,
                    CountRows(Split(lblValidationSource.Text, Char(10))) & " issue(s) to resolve before saving.",
                    "Ready to save."
                )
            )
        Font: =ThemeFont
        Size: =ThemeSizeSmall
        Color: =If(Len(lblValidationSource.Text) > 0, ThemeDanger, ThemeTextMuted)
        VerticalAlign: =VerticalAlign.Middle
        PaddingLeft: =0

    btnCancel As button:
        X: =Parent.Width - 280
        Y: =Parent.Height - 48
        Width: =120
        Height: =34
        Text: ="Cancel"
        Fill: =ThemeSurface
        HoverFill: =ThemeSurfaceHover
        Color: =ThemeTextSecondary
        BorderColor: =ThemeBorderStrong
        BorderThickness: =1
        Font: =ThemeFont
        Size: =ThemeSizeBody
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        OnSelect: =Back()

    btnSave As button:
        X: =Parent.Width - 150
        Y: =Parent.Height - 48
        Width: =150 - ThemeSpace5
        Height: =34
        Text: ="Save"
        Fill: =ThemeAccent
        HoverFill: =ThemeAccentHover
        DisabledFill: =ThemeMutedSoft
        Color: =ThemeTextInverse
        DisabledColor: =ThemeTextMuted
        BorderThickness: =0
        Font: =ThemeFont
        Size: =ThemeSizeBody
        FontWeight: =FontWeight.Semibold
        RadiusTopLeft: =ThemeRadius
        RadiusTopRight: =ThemeRadius
        RadiusBottomLeft: =ThemeRadius
        RadiusBottomRight: =ThemeRadius
        DisplayMode: |
            =If(
                Len(lblValidationSource.Text) > 0 || !IsOfficer ||
                IsBlank(gblChildContext) || IsBlank(gblChildContext.LCItemId),
                DisplayMode.Disabled,
                DisplayMode.Edit
            )
        OnSelect: |
            =Set(gblShowErrors, true);
            If(
                Len(lblValidationSource.Text) > 0,
                Notify("Resolve the listed issues before saving.", NotificationType.Error, 4000),
                (
                    Set(gblCorrelation, GUID());
                    Set(
                        gblSaved,
                        Patch(
                            '06_Discrepancies',
                            If(gblFormMode = "New", Defaults('06_Discrepancies'), gblOriginal),
                            gblDraft,
                            // Denormalised parent keys. Written on every save so a child row can
                            // never drift away from its LC, and so every child query stays a
                            // single indexed server-side filter.
                            {
                                LCItemId: gblChildContext.LCItemId,
                                LCNumber: gblChildContext.LCNumber,
                                InternalLCID: gblChildContext.InternalLCID
                            },
                            {
                            CategoryCode: Coalesce(LookUp(colDiscCategories, Title = gblDraft.CategoryName).CategoryCode, ""),
                            IsOpen: !Coalesce(
                                LookUp(colStatus, EntityName = "Discrepancy" && StatusCode = gblDraft.DiscrepancyStatus).IsTerminal,
                                false
                            ) && gblDraft.DiscrepancyStatus <> "Resolved",
                            DueDate: Coalesce(
                                gblDraft.DueDate,
                                DateAdd(
                                    Coalesce(gblDraft.DetectedDate, Today0),
                                    Coalesce(LookUp(colDiscCategories, Title = gblDraft.CategoryName).DefaultResolutionDays, 3),
                                    Days
                                )
                            ),
                            AssignedToEmail: Coalesce(gblOriginal.AssignedToEmail, User().Email)
                        }
                        )
                    );

                    ForAll(
                        Filter(
                            Table(
                                    { F: "DiscrepancyStatus", O: Coalesce(gblOriginal.DiscrepancyStatus, ""), N: Coalesce(gblDraft.DiscrepancyStatus, "") },
                                    { F: "Severity", O: Coalesce(gblOriginal.Severity, ""), N: Coalesce(gblDraft.Severity, "") },
                                    { F: "ResolutionType", O: Coalesce(gblOriginal.ResolutionType, ""), N: Coalesce(gblDraft.ResolutionType, "") },
                                    { F: "WaiverReceived", O: Text(gblOriginal.WaiverReceived), N: Text(gblDraft.WaiverReceived) }
                            ),
                            O <> N
                        ) As chg,
                        Patch(
                            '10_AuditLog', Defaults('10_AuditLog'),
                            {
                                Title: "Discrepancy:" & gblSaved.Title & ":" & chg.F,
                                EntityName: "Discrepancy",
                                RecordItemId: gblSaved.ID,
                                RecordReference: gblSaved.Title,
                                InternalLCID: gblChildContext.InternalLCID,
                                LCNumber: gblChildContext.LCNumber,
                                ActionType: If(gblFormMode = "New", "Create", "Update"),
                                FieldName: chg.F,
                                OldValue: chg.O,
                                NewValue: chg.N,
                                IsCriticalField: chg.F in Split(CfgT("CriticalAuditFields", ""), ";").Value,
                                ActionByEmail: User().Email,
                                ActionByName: User().FullName,
                                ActionTimestamp: Now(),
                                ActionSource: "Power App",
                                CorrelationId: gblCorrelation,
                                PartitionKey: Text(Today0, "yyyy-mm")
                            }
                        )
                    );

                    // The LC's open-discrepancy counter drives a dashboard KPI and a register
                    // preset, so it is refreshed here rather than left to the nightly flow.
                    With(
                        { openCount: CountRows(Filter('06_Discrepancies', LCItemId = gblChildContext.LCItemId, IsOpen = true)) },
                        Patch(
                            '01_ExportLCs',
                            LookUp('01_ExportLCs', ID = gblChildContext.LCItemId),
                            {
                                OpenDiscrepancyCount: openCount,
                                RequiresAction: openCount > 0 || Coalesce(gblParentLC.MissingDocumentCount, 0) > 0,
                                LastActivityDate: Now()
                            }
                        )
                    );
                    Set(gblCurrentLC, LookUp('01_ExportLCs', ID = gblChildContext.LCItemId));
                    Notify("Saved.", NotificationType.Success, 2500);
                    Back()
                )
            )
